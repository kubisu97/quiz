<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wedding Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/theme.css" />
    <style>
      /* index.html 固有 */
      /* 入口カードは参照元のハードシャドウを押し込みアニメーションに使う */
      .qz-entry {
        display: block;
        text-decoration: none;
        transition: transform var(--motion), box-shadow var(--motion);
      }
      .qz-entry:hover {
        transform: translate(-3px, -3px);
        box-shadow: 15px 15px 0 0 var(--pink);
      }
      .qz-entry:active {
        transform: translate(2px, 2px);
        box-shadow: 6px 6px 0 0 var(--pink);
      }
    </style>
  </head>
  <body>
    <main class="max-w-4xl mx-auto px-6 py-14">
      <header class="mb-12 text-center">
        <p
          class="qz-display qz-display--cream"
          style="font-size: clamp(3rem, 9vw, 6rem)"
        >
          Wedding
        </p>
        <p
          class="qz-display qz-display--pink"
          style="font-size: clamp(3rem, 9vw, 6rem)"
        >
          Quiz
        </p>
        <hr class="qz-rule qz-rule--pink max-w-xs mx-auto mt-6" />
        <p class="qz-jp-head text-base mt-5" style="color: var(--cream)">
          披露宴対抗クイズ
        </p>
        <p class="qz-label qz-onDark-muted mt-2">Choose your screen</p>
      </header>

      <nav class="grid sm:grid-cols-3 gap-7">
        <a href="admin.html" class="qz-card qz-entry p-5">
          <div class="qz-label" style="color: var(--coral)">Host</div>
          <div class="qz-jp-head text-lg mt-2">管理画面</div>
          <p class="text-xs qz-muted mt-2 leading-relaxed">
            チーム・問題の編集、<br />進行操作、動画コントロール
          </p>
        </a>
        <a href="main.html" class="qz-card qz-entry p-5">
          <div class="qz-label" style="color: var(--coral)">Projector</div>
          <div class="qz-jp-head text-lg mt-2">メイン画面</div>
          <p class="text-xs qz-muted mt-2 leading-relaxed">
            QR 表示、問題・タイマー、<br />正解発表・ランキング
          </p>
        </a>
        <a href="player.html" class="qz-card qz-entry p-5">
          <div class="qz-label" style="color: var(--coral)">Player</div>
          <div class="qz-jp-head text-lg mt-2">解答画面</div>
          <p class="text-xs qz-muted mt-2 leading-relaxed">
            チーム名を入力して参加、<br />スマホから回答
          </p>
        </a>
      </nav>

      <div id="status" class="mt-12 text-xs qz-onDark-muted text-center"></div>
      <div id="error-slot"></div>
    </main>

    <script src="env.js" onerror="window.__ENV_LOAD_FAILED__ = true"></script>
    <script type="module">
      import {
        ensureSignedIn,
        envError,
        APP_ID,
        renderSetupError,
      } from "./js/firebase-init.js";

      const statusEl = document.getElementById("status");
      const errorSlot = document.getElementById("error-slot");

      if (envError) {
        renderSetupError(errorSlot, envError);
        statusEl.textContent = "Firebase: 未設定";
      } else {
        statusEl.textContent = "接続中...";
        try {
          const user = await ensureSignedIn();
          statusEl.textContent = `接続済 / AppID: ${APP_ID} / UID: ${user.uid.slice(
            0,
            8
          )}`;
        } catch (err) {
          console.error(err);
          renderSetupError(errorSlot, err.message || String(err));
          statusEl.textContent = "Firebase: 接続失敗";
        }
      }
    </script>
  </body>
</html>
