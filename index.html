<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>エントランス - ウェディングクイズ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Shippori+Mincho+B1:wght@600;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        --mq-gold-hi: #f7e39a;
        --mq-gold: #d4af37;
        --mq-gold-lo: #8a6a1c;
        --mq-navy-hi: #1c2f6b;
        --mq-navy: #0c1740;
        --mq-navy-lo: #060d28;
        --mq-ink: #02040f;
        --mq-text: #f7f3e6;
        --mq-muted: #a7a4c7;
      }
      body {
        font-family: "Noto Sans JP", sans-serif;
        color: var(--mq-text);
        background-color: var(--mq-ink);
        background-image:
          radial-gradient(ellipse 90% 60% at 50% 0%, rgba(47, 76, 167, 0.45), transparent 65%),
          radial-gradient(ellipse 140% 110% at 50% 55%, #12225c 0%, #081233 55%, #02040f 100%);
        background-attachment: fixed;
      }
      .mq-serif { font-family: "Cinzel", "Shippori Mincho B1", serif; letter-spacing: 0.08em; }
      .mq-mincho { font-family: "Shippori Mincho B1", serif; }
      .mq-gold-text {
        background: linear-gradient(180deg, var(--mq-gold-hi) 0%, var(--mq-gold) 55%, var(--mq-gold-lo) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .mq-panel {
        background: linear-gradient(180deg, rgba(28, 47, 107, 0.5) 0%, rgba(8, 18, 51, 0.92) 100%);
        border: 1px solid rgba(212, 175, 55, 0.4);
        border-radius: 0.75rem;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(247, 227, 154, 0.15);
      }
      .mq-hex {
        position: relative;
        padding: 2px;
        clip-path: polygon(26px 0, calc(100% - 26px) 0, 100% 50%, calc(100% - 26px) 100%, 26px 100%, 0 50%);
        background: linear-gradient(180deg, var(--mq-gold-hi) 0%, var(--mq-gold) 30%, var(--mq-gold-lo) 65%, var(--mq-gold) 100%);
      }
      .mq-hex-inner {
        width: 100%;
        height: 100%;
        clip-path: polygon(25px 0, calc(100% - 25px) 0, 100% 50%, calc(100% - 25px) 100%, 25px 100%, 0 50%);
        background: linear-gradient(180deg, #1a2b66 0%, #0c1740 50%, #060d28 100%);
      }
      .mq-hex-inner--selected {
        background: linear-gradient(180deg, #ffd98a 0%, #f59e0b 45%, #a85b06 100%);
        color: #241300;
      }
      .mq-hex-inner--correct {
        background: linear-gradient(180deg, #86efac 0%, #10b981 45%, #047857 100%);
        color: #04160d;
        animation: mq-flash 0.9s ease-in-out infinite alternate;
      }
      .mq-hex-inner--dim { opacity: 0.35; }
      @keyframes mq-flash {
        from { filter: brightness(1); }
        to { filter: brightness(1.35); }
      }
      .mq-hex-letter {
        font-family: "Cinzel", serif;
        color: var(--mq-gold-hi);
        font-weight: 700;
      }
      .mq-hex-inner--selected .mq-hex-letter,
      .mq-hex-inner--correct .mq-hex-letter { color: inherit; }
      .mq-hexline { position: relative; }
      .mq-hexline::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: 2px;
        transform: translateY(-1px);
        background: linear-gradient(90deg, transparent, var(--mq-gold) 12%, var(--mq-gold) 88%, transparent);
        z-index: 0;
      }
      .mq-hexline > .mq-hex { z-index: 1; }
      .mq-btn {
        border-radius: 0.5rem;
        border: 1px solid rgba(212, 175, 55, 0.5);
        background: linear-gradient(180deg, #1a2b66, #0c1740);
        color: var(--mq-text);
        transition: filter 0.15s;
      }
      .mq-btn:hover:not(:disabled) { filter: brightness(1.3); }
      .mq-btn:disabled { opacity: 0.4; cursor: not-allowed; }
      .mq-btn--gold {
        background: linear-gradient(180deg, var(--mq-gold-hi), var(--mq-gold) 50%, var(--mq-gold-lo));
        color: #241300;
        border-color: var(--mq-gold-hi);
        font-weight: 700;
      }
      .mq-btn--danger {
        background: linear-gradient(180deg, #7f1d1d, #450a0a);
        border-color: rgba(248, 113, 113, 0.6);
      }
      .mq-input {
        background: rgba(2, 4, 15, 0.6);
        border: 1px solid rgba(212, 175, 55, 0.35);
        border-radius: 0.5rem;
        color: var(--mq-text);
      }
      .mq-input:focus {
        outline: none;
        border-color: var(--mq-gold);
        box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.25);
      }
      .mq-input::placeholder { color: #8f8cae; }

      /* エントランス固有 */
      .mq-rule {
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--mq-gold) 20%, var(--mq-gold-hi) 50%, var(--mq-gold) 80%, transparent);
      }
      .mq-entry-card {
        transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
      }
      .mq-entry-card:hover {
        border-color: var(--mq-gold-hi);
        box-shadow: 0 0 24px rgba(212, 175, 55, 0.35), 0 8px 28px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(247, 227, 154, 0.3);
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body class="min-h-screen">
    <main id="root" class="max-w-3xl mx-auto px-6 py-16">
      <header class="mb-12 text-center">
        <h1 class="mq-serif mq-gold-text text-5xl sm:text-6xl font-black leading-tight">
          WEDDING QUIZ
        </h1>
        <div class="mq-rule max-w-md mx-auto mt-5"></div>
        <p class="mq-mincho text-lg text-[#f7e39a] mt-4 tracking-widest">
          ウェディングクイズ 〜披露宴対抗戦〜
        </p>
        <p class="text-sm text-[color:var(--mq-muted)] mt-2">
          司会者・メイン画面・解答者の入口
        </p>
      </header>

      <nav class="grid sm:grid-cols-3 gap-4">
        <a
          href="admin.html"
          class="mq-panel mq-entry-card p-5"
        >
          <div class="mq-serif text-[11px] tracking-[0.25em] text-[#d4af37] mb-2">司会者</div>
          <div class="mq-mincho font-bold text-lg">管理画面</div>
          <p class="text-xs text-[color:var(--mq-muted)] mt-2">
            チーム・問題の編集、進行操作
          </p>
        </a>
        <a
          href="main.html"
          class="mq-panel mq-entry-card p-5"
        >
          <div class="mq-serif text-[11px] tracking-[0.25em] text-[#d4af37] mb-2">プロジェクター</div>
          <div class="mq-mincho font-bold text-lg">メイン画面</div>
          <p class="text-xs text-[color:var(--mq-muted)] mt-2">
            QR 表示、問題・タイマー・結果
          </p>
        </a>
        <a
          href="player.html"
          class="mq-panel mq-entry-card p-5"
        >
          <div class="mq-serif text-[11px] tracking-[0.25em] text-[#d4af37] mb-2">参加者</div>
          <div class="mq-mincho font-bold text-lg">解答画面</div>
          <p class="text-xs text-[color:var(--mq-muted)] mt-2">
            QR 経由でチーム選択、回答
          </p>
        </a>
      </nav>

      <div id="status" class="mt-10 text-xs text-[color:var(--mq-muted)] text-center"></div>
      <div id="error-slot"></div>
    </main>

    <script src="env.js" onerror="window.__ENV_LOAD_FAILED__ = true"></script>
    <script type="module">
      import {
        ensureSignedIn,
        envError,
        APP_ID,
        renderSetupError,
      } from "./js/firebase-init.js";

      const statusEl = document.getElementById("status");
      const errorSlot = document.getElementById("error-slot");

      if (envError) {
        renderSetupError(errorSlot, envError);
        statusEl.textContent = "Firebase: 未設定";
      } else {
        statusEl.textContent = "接続中...";
        try {
          const user = await ensureSignedIn();
          statusEl.textContent = `接続済 / AppID: ${APP_ID} / UID: ${user.uid.slice(
            0,
            8
          )}`;
        } catch (err) {
          console.error(err);
          renderSetupError(errorSlot, err.message || String(err));
          statusEl.textContent = "Firebase: 接続失敗";
        }
      }
    </script>
  </body>
</html>
