<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>メイン画面 - Wedding Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- フォントは読み込めなくても表示を止めない（media=print → onload で適用） -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'"
    />
    <link rel="stylesheet" href="css/theme.css?v=20261027a" />
    <style>
      /* main.html 固有 */
      body {
        overflow: hidden;
      }

      /* 1画面に収めるための自動縮小コンテナ。
         中身の実寸を測って transform: scale() で押し込む。 */
      .mq-fit {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      /* 縮小が必要なときだけ上端基準にする。中央基準のままだと
         scale で縮めた分の下端がクリップ判定とズレるため。 */
      .mq-fit.is-scaled {
        align-items: flex-start;
      }
      .mq-fit-inner {
        /* 上端基準で縮めると、はみ出しが必ず下側に出るので計算とズレない */
        transform-origin: top center;
        width: 100%;
        /* カードのハードシャドウ (12px) が clip されないよう余白を確保 */
        padding-bottom: 16px;
        padding-right: 16px;
      }

      /* 動画は高さ基準で最大化する。16:9 なので高さ*16/9 が幅の上限。 */
      .mq-media-video {
        max-width: calc(64vh * 16 / 9);
      }

      /* タイプライター中に高さが変わるとレイアウトが跳ねるので、
         完成後の文字列を透明で重ねて先に場所を確保しておく。 */
      .mq-type-wrap {
        position: relative;
        display: inline-block;
        text-align: center;
      }
      .mq-type-ghost {
        visibility: hidden;
      }
      .mq-type-live {
        position: absolute;
        inset: 0;
      }
      .mq-typing::after {
        content: "";
        display: inline-block;
        width: 0.06em;
        height: 1em;
        margin-left: 0.08em;
        vertical-align: -0.08em;
        background: var(--coral);
        animation: mq-caret 0.7s steps(1) infinite;
      }
      @keyframes mq-caret {
        50% {
          opacity: 0;
        }
      }

      .timer-ring {
        transition: stroke-dashoffset 0.4s linear;
      }

      /* 参照元の「クリームの紙が深緑の地に浮く」感じを問題文パネルに使う */
      .mq-question {
        background: var(--cream);
        border: 2.4px solid var(--forest);
        box-shadow: 10px 10px 0 0 var(--pink);
        color: var(--ink);
      }

      /* 参加方法の説明: 番号付きの手順カード */
      .mq-step__num {
        font-family: var(--font-accent);
        font-weight: 800;
        font-size: 3.5rem;
        line-height: 1;
        color: var(--coral);
      }

      /* 参加受付: チームごとのカード。OK を押したチームは影をコーラルにして目立たせる */
      .mq-entry.is-ready {
        box-shadow: 12px 12px 0 0 var(--coral);
      }
      .mq-entry__qr img,
      .mq-entry__qr canvas {
        display: block;
      }
      .mq-entry__wait {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--muted);
      }
      .mq-ok {
        display: inline-block;
        padding: 0.15em 0.7em;
        background: var(--coral);
        color: var(--cream);
        font-family: var(--font-accent);
        font-weight: 800;
        font-size: 2.25rem;
        line-height: 1.1;
      }
      .mq-ok-pop {
        animation: mq-pop 0.5s cubic-bezier(0.2, 1.6, 0.4, 1) both;
      }
      @keyframes mq-pop {
        from {
          transform: scale(0.4);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
      .mq-members {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 2px 12px;
        margin-top: 0.6rem;
        font-weight: 700;
        font-size: 1rem;
        line-height: 1.5;
        color: var(--ink);
      }

      /* 動画スロット: 中の <video> を枠いっぱいに */
      body[data-status="voting"] #media-status,
      body[data-status="closed"] #media-status,
      body[data-status="result"] #media-status {
        display: none;
      }
      #video-slot > video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
    </style>
    <!-- Tailwind はビルド済み CSS を同梱（cdn.tailwindcss.com は本番利用非推奨のため） -->
    <link rel="stylesheet" href="css/tailwind.css?v=20261027a" />
  </head>
  <body>
    <main id="root" class="h-screen p-6 flex flex-col overflow-hidden">
      <p class="text-center qz-onDark-muted">接続中...</p>
    </main>

    <!-- 開始画面: ブラウザは「一度もクリックされていないページ」の音声再生を拒否するため、
         最初に必ず 1 回押してもらう。動画の準備状況もここで確認できる。 -->
    <div id="start-overlay" class="fixed inset-0 z-[70] flex items-center justify-center p-6" style="background:rgba(16,53,39,.94)">
      <div class="qz-card p-8 max-w-xl w-full text-center space-y-5">
        <p class="qz-display" style="font-size:2.5rem">Wedding Quiz</p>
        <p class="qz-jp-head text-lg">メイン画面（プロジェクター用）</p>
        <div id="overlay-media" class="qz-panel--pink p-3 text-sm leading-relaxed">動画の準備状況を確認中...</div>
        <div class="grid gap-3">
          <button id="btn-start-full" class="qz-btn qz-btn--primary" style="font-size:1.1rem;padding:16px">
            開始する（全画面にする）
          </button>
          <button id="btn-start-window" class="qz-btn">
            開始する（ウィンドウのまま）
          </button>
          <button id="btn-sound-test" class="qz-btn" style="font-size:.85rem">
            🔔 音声テスト（スピーカーから音が出るか確認）
          </button>
        </div>
        <p class="text-[11px] qz-muted leading-relaxed">
          「開始する」を押すと音声付きで動画を流せる状態になります。<br />
          ページを再読み込みしたときも、もう一度押してください。
        </p>
        <p id="overlay-version" class="text-[10px] qz-muted"></p>
      </div>
    </div>

    <button id="sound-hint" class="qz-btn qz-btn--primary hidden fixed bottom-5 right-5 z-50" style="font-size:1rem;padding:14px 20px">
      🔊 クリックして音声をオンにする
    </button>
    <div id="media-status" class="fixed bottom-2 right-3 z-40 text-[11px] qz-onDark-muted pointer-events-none"></div>

    <script src="env.js?v=20261027a"></script>
    <script src="vendor/qrcode.min.js?v=20261027a"></script>
    <script type="module">
      import {
        ensureSignedIn,
        envError,
        refs,
        APP_VERSION,
        TEAM_COLORS,
        escapeHtml,
        renderSetupError,
        describeError,
        mountConnectionBanner,
        mountRehearsalBadge,
        teamJoinUrl,
        teamMembers,
        isLiveQuiz,
        correctIndexOf,
        choiceLetter,
        onSnapshot,
        setDoc,
        query,
        orderBy,
        where,
        startAutoTimer,
      } from "./js/firebase-init.js?v=20261027a";

      const root = document.getElementById("root");
      const overlay = document.getElementById("start-overlay");
      document.getElementById("overlay-version").textContent = `version ${APP_VERSION}`;
      let lastVideoCmdAt = null;
      let audioUnlocked = false;
      let state = null;

      // ---- 開始画面（音声の解除） ----
      // 無音を 1 回鳴らしておくと、以降の動画を音声付きで自動再生できる。
      const SILENT_WAV =
        "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
      // 開始ボタンは認証完了前に押されることもあるので、ここでは後で定義される変数に触らない。
      // 動画・稼働状況まわりの後処理は afterUnlock に後から差し込む。
      let afterUnlock = () => {};
      function unlockAudio() {
        audioUnlocked = true;
        try {
          const a = new Audio(SILENT_WAV);
          a.play().catch(() => {});
        } catch {}
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (Ctx) {
            const ctx = new Ctx();
            ctx.resume?.();
          }
        } catch {}
        document.getElementById("sound-hint")?.classList.add("hidden");
        try {
          afterUnlock();
        } catch (err) {
          console.warn(err);
        }
      }
      function startScreen(fullscreen) {
        overlay.classList.add("hidden");
        unlockAudio();
        if (fullscreen && document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        }
      }
      document.getElementById("btn-start-full").addEventListener("click", () => startScreen(true));
      document.getElementById("btn-start-window").addEventListener("click", () => startScreen(false));
      document.getElementById("btn-sound-test").addEventListener("click", () => {
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          const ctx = new Ctx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.frequency.value = 880;
          gain.gain.value = 0.2;
          osc.connect(gain).connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.6);
        } catch (err) {
          alert("音声テストに失敗しました: " + err.message);
        }
      });

      // 開始後も、画面のどこかをクリックすれば音声を解除できるようにしておく
      document.addEventListener(
        "pointerdown",
        (e) => {
          if (e.target.closest?.("#start-overlay")) return;
          if (!audioUnlocked) unlockAudio();
          document.getElementById("sound-hint")?.classList.add("hidden");
        },
        true
      );

      if (envError) {
        overlay.classList.add("hidden");
        renderSetupError(root, envError);
        throw new Error(envError);
      }

      const conn = mountConnectionBanner();
      mountRehearsalBadge();

      try {
        await ensureSignedIn();
      } catch (err) {
        overlay.classList.add("hidden");
        renderSetupError(root, describeError(err));
        throw err;
      }

      let quizzes = [];
      let teams = [];
      let answers = [];
      let answersUnsub = null;
      let lastQuizId = null;

      onSnapshot(
        refs.state(),
        { includeMetadataChanges: true },
        (snap) => {
          conn.report(snap);
          state = snap.exists() ? snap.data() : null;
          syncAnswersListener();
          render();
          // 動画の再生/停止/音声は再描画を伴わずに届くこともある
          applyVideoState(false);
        },
        (err) => conn.error(err)
      );
      onSnapshot(
        query(refs.quizzes(), orderBy("order")),
        (snap) => {
          quizzes = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          syncPreloads();
          render();
        },
        (err) => conn.error(err)
      );
      onSnapshot(
        query(refs.teams(), orderBy("order")),
        (snap) => {
          teams = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          render();
        },
        (err) => conn.error(err)
      );

      setInterval(() => {
        if (state?.status === "voting") render();
      }, 250);

      // 司会者のスマホが画面ロック等で止まっていても、時間切れの締切・採点が進むようにする保険。
      // 管理画面が先に処理するので、こちらは 2 秒遅れで動く（同時に動いても二重採点はしない）。
      startAutoTimer({
        getState: () => state,
        getQuizzes: () => quizzes,
        graceMs: 2000,
        onError: (err) => console.warn("auto timer (main)", err),
      });

      function syncAnswersListener() {
        const quizId = state?.currentQuizId;
        if (quizId === lastQuizId) return;
        lastQuizId = quizId;
        if (answersUnsub) {
          answersUnsub();
          answersUnsub = null;
        }
        answers = [];
        if (quizId) {
          answersUnsub = onSnapshot(
            query(refs.answers(), where("quizId", "==", quizId)),
            (snap) => {
              answers = snap.docs.map((d) => d.data());
              render();
            },
            (err) => conn.error(err)
          );
        }
      }

      function teamColor(idx) {
        return TEAM_COLORS[idx % TEAM_COLORS.length];
      }

      function parseYouTubeTime(value) {
        if (!value) return null;
        if (/^\d+$/.test(value)) return value;
        const match = String(value).match(/(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?/);
        if (!match) return null;
        const seconds =
          (parseInt(match[1] || "0", 10) * 3600) +
          (parseInt(match[2] || "0", 10) * 60) +
          parseInt(match[3] || "0", 10);
        return seconds > 0 ? String(seconds) : null;
      }

      function youtubeEmbedUrl(rawUrl) {
        try {
          const url = new URL(rawUrl);
          const host = url.hostname.replace(/^www\./, "");
          let id = null;
          if (host === "youtu.be") {
            id = url.pathname.split("/").filter(Boolean)[0];
          } else if (host.endsWith("youtube.com")) {
            if (url.pathname === "/watch") {
              id = url.searchParams.get("v");
            } else {
              const parts = url.pathname.split("/").filter(Boolean);
              if (["embed", "shorts", "live"].includes(parts[0])) id = parts[1];
            }
          }
          if (!id) return null;
          const embed = new URL(
            `https://www.youtube.com/embed/${encodeURIComponent(id)}`
          );
          embed.searchParams.set("autoplay", "1");
          // 音声付き自動再生はほとんどのブラウザで拒否される。
          // まずミュートで確実に再生し、YouTube の操作で音声を戻す。
          embed.searchParams.set("mute", "1");
          embed.searchParams.set("controls", "1");
          embed.searchParams.set("playsinline", "1");
          embed.searchParams.set("rel", "0");
          if (window.location.origin.startsWith("http")) {
            embed.searchParams.set("origin", window.location.origin);
          }
          const start = parseYouTubeTime(
            url.searchParams.get("start") || url.searchParams.get("t")
          );
          if (start) embed.searchParams.set("start", start);
          return embed.toString();
        } catch {
          return null;
        }
      }

      function googleDriveEmbedUrl(rawUrl) {
        try {
          const url = new URL(rawUrl);
          if (url.hostname !== "drive.google.com") return null;
          const match = url.pathname.match(/\/file\/d\/([^/]+)/);
          const id = match?.[1] || url.searchParams.get("id");
          return id
            ? `https://drive.google.com/file/d/${encodeURIComponent(id)}/preview`
            : null;
        } catch {
          return null;
        }
      }

      function vimeoEmbedUrl(rawUrl) {
        try {
          const url = new URL(rawUrl);
          if (!url.hostname.replace(/^www\./, "").endsWith("vimeo.com")) return null;
          const id = url.pathname
            .split("/")
            .filter(Boolean)
            .find((part) => /^\d+$/.test(part));
          return id
            ? `https://player.vimeo.com/video/${id}?autoplay=1&muted=1`
            : null;
        } catch {
          return null;
        }
      }

      // 直リンク動画の URL を絶対 URL にそろえる（media/xxx.mp4 のような相対指定も可）
      function directVideoUrl(rawUrl) {
        try {
          const url = new URL(rawUrl, location.href);
          if (url.hostname.endsWith("dropbox.com")) {
            url.hostname = "dl.dropboxusercontent.com";
            url.searchParams.delete("dl");
          }
          return url.toString();
        } catch {
          return rawUrl;
        }
      }

      function embedUrlOf(rawUrl) {
        if (!rawUrl || !/^https?:/i.test(rawUrl)) return null;
        return (
          youtubeEmbedUrl(rawUrl) ||
          googleDriveEmbedUrl(rawUrl) ||
          vimeoEmbedUrl(rawUrl)
        );
      }

      // ---- 動画の事前読み込み ----
      // 直リンク（MP4 など）は開いた時点で全部ダウンロードしてメモリに持つ。
      // ブラウザの Cache Storage にも保存するので、再読み込みしても回線を使わずに再生できる。
      // 読み込み後に試し再生（1 フレーム目のデコード）までして、このPCで再生できる形式かも確認する。
      const MEDIA_CACHE = "wedding-quiz-media-v1";
      const media = new Map(); // 絶対URL -> { state, progress, blobUrl, message }
      let preloadQueue = Promise.resolve();

      function probePlayable(src) {
        return new Promise((resolve) => {
          const v = document.createElement("video");
          v.muted = true;
          v.preload = "auto";
          v.playsInline = true;
          let done = false;
          const finish = (ok, message) => {
            if (done) return;
            done = true;
            clearTimeout(timer);
            v.removeAttribute("src");
            v.load();
            resolve({ ok, message });
          };
          const timer = setTimeout(
            () => finish(false, "試し再生がタイムアウトしました"),
            20000
          );
          v.addEventListener("loadeddata", () => {
            if (v.videoWidth > 0) finish(true);
            else finish(false, "映像を表示できない形式です（音声のみ、または非対応コーデック）");
          });
          v.addEventListener("error", () =>
            finish(false, "このPCのブラウザでは再生できない形式です（MP4/H.264 に変換してください）")
          );
          v.src = src;
        });
      }

      async function preloadOne(absUrl) {
        const entry = media.get(absUrl);
        if (!entry || entry.state === "ready" || entry.state === "loading") return;
        entry.state = "loading";
        entry.progress = 0;
        entry.message = "";
        updateMediaStatus();
        let blob = null;
        try {
          let cache = null;
          if ("caches" in window) {
            try {
              cache = await caches.open(MEDIA_CACHE);
              const hit = await cache.match(absUrl);
              if (hit) blob = await hit.blob();
            } catch {
              cache = null;
            }
          }
          if (!blob) {
            const res = await fetch(absUrl, { mode: "cors", credentials: "omit" });
            if (!res.ok) throw Object.assign(new Error(`HTTP ${res.status}`), { http: true });
            const type = res.headers.get("content-type") || "";
            if (/text\/html|application\/json/i.test(type)) {
              throw Object.assign(
                new Error("動画ファイルではなく Web ページの URL です（直リンクを指定してください）"),
                { fatal: true }
              );
            }
            const total = Number(res.headers.get("content-length")) || 0;
            if (res.body && total) {
              const reader = res.body.getReader();
              const chunks = [];
              let loaded = 0;
              for (;;) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(value);
                loaded += value.byteLength;
                entry.progress = Math.min(99, Math.round((loaded / total) * 100));
                updateMediaStatus(true);
              }
              blob = new Blob(chunks, { type: type || "video/mp4" });
            } else {
              blob = await res.blob();
            }
            if (cache) {
              try {
                await cache.put(
                  absUrl,
                  new Response(blob, {
                    headers: { "Content-Type": blob.type || "video/mp4" },
                  })
                );
              } catch {}
            }
          }
          const blobUrl = URL.createObjectURL(blob);
          const probe = await probePlayable(blobUrl);
          if (!probe.ok) {
            URL.revokeObjectURL(blobUrl);
            entry.state = "error";
            entry.message = probe.message;
          } else {
            entry.state = "ready";
            entry.blobUrl = blobUrl;
            entry.progress = 100;
          }
        } catch (err) {
          if (err.fatal) {
            entry.state = "error";
            entry.message = err.message;
          } else {
            // CORS 非対応のサーバー・一時的な通信エラー。直接再生できるかだけ確認して、後で再試行する。
            const probe = await probePlayable(absUrl);
            entry.state = probe.ok ? "stream" : "error";
            entry.message = probe.ok
              ? "事前読み込みできないため、その場で読み込んで再生します（回線が必要）"
              : err.http
              ? `動画を取得できません（${err.message}）。URL を確認してください`
              : probe.message;
            entry.retryAt = Date.now() + 30000;
          }
        }
        updateMediaStatus();
      }

      function syncPreloads() {
        const wanted = new Set();
        quizzes.forEach((q) => {
          if (!q.videoUrl || embedUrlOf(q.videoUrl)) return;
          const abs = directVideoUrl(q.videoUrl);
          wanted.add(abs);
          if (!media.has(abs)) {
            media.set(abs, { state: "queued", progress: 0 });
            preloadQueue = preloadQueue.then(() => preloadOne(abs));
          }
        });
        updateMediaStatus();
      }

      // 失敗したものは 30 秒おき・オンライン復帰時に再挑戦する
      function retryPreloads() {
        media.forEach((entry, abs) => {
          if (entry.state === "stream" || (entry.state === "error" && entry.retryAt)) {
            if (Date.now() < (entry.retryAt || 0)) return;
            entry.state = "queued";
            preloadQueue = preloadQueue.then(() => preloadOne(abs));
          }
        });
      }
      setInterval(retryPreloads, 10000);
      window.addEventListener("online", () => {
        media.forEach((e) => (e.retryAt = 0));
        retryPreloads();
      });

      function mediaSummary() {
        const items = [];
        quizzes.forEach((q, index) => {
          if (!q.videoUrl) return;
          const embed = embedUrlOf(q.videoUrl);
          if (embed) {
            items.push({
              index,
              state: "embed",
              message: "YouTube/Drive/Vimeo の埋め込みは事前読み込みできません（当日の回線で再生）",
            });
            return;
          }
          const e = media.get(directVideoUrl(q.videoUrl)) || { state: "queued" };
          items.push({ index, state: e.state, progress: e.progress, message: e.message });
        });
        const ready = items.filter((i) => i.state === "ready").length;
        const loading = items.filter((i) => i.state === "loading" || i.state === "queued").length;
        const issues = items
          .filter((i) => ["stream", "error", "embed"].includes(i.state))
          .map((i) => ({ index: i.index, state: i.state, message: i.message || "" }));
        return { total: items.length, ready, loading, issues, items };
      }

      let mediaPaintTimer = null;
      function updateMediaStatus(throttle = false) {
        if (throttle) {
          if (mediaPaintTimer) return;
          mediaPaintTimer = setTimeout(() => {
            mediaPaintTimer = null;
            paintMediaStatus();
          }, 400);
          return;
        }
        paintMediaStatus();
        scheduleHeartbeat();
      }

      function paintMediaStatus() {
        const s = mediaSummary();
        const corner = document.getElementById("media-status");
        const box = document.getElementById("overlay-media");
        if (s.total === 0) {
          corner.textContent = "";
          box.innerHTML = "動画を使う問題はありません。";
          return;
        }
        const loadingItem = s.items.find((i) => i.state === "loading");
        corner.textContent =
          s.ready === s.total
            ? ""
            : loadingItem
            ? `動画を読み込み中 ${loadingItem.progress || 0}%（${s.ready}/${s.total}）`
            : `動画 ${s.ready}/${s.total} 準備OK・要確認 ${s.issues.length} 件`;
        box.innerHTML = `
          <div class="font-bold">${
            s.ready === s.total
              ? `✓ 動画 ${s.total} 本すべて準備OK（回線が切れても再生できます）`
              : `動画 ${s.ready}/${s.total} 本 準備OK`
          }</div>
          ${s.items
            .filter((i) => i.state !== "ready")
            .map(
              (i) =>
                `<div class="text-xs mt-1" style="color:${
                  i.state === "loading" || i.state === "queued" ? "var(--ink)" : "#c0392b"
                }">Q${i.index + 1}: ${
                  i.state === "loading"
                    ? `読み込み中 ${i.progress || 0}%`
                    : i.state === "queued"
                    ? "読み込み待ち"
                    : escapeHtml(i.message || "")
                }</div>`
            )
            .join("")}`;
      }

      // ---- 稼働状況を管理画面へ知らせる ----
      const screenId = (() => {
        try {
          let id = sessionStorage.getItem("quiz:screenId");
          if (!id) {
            id = "main-" + Math.random().toString(36).slice(2, 10);
            sessionStorage.setItem("quiz:screenId", id);
          }
          return id;
        } catch {
          return "main-" + Math.random().toString(36).slice(2, 10);
        }
      })();
      let heartbeatTimer = null;
      function scheduleHeartbeat() {
        if (heartbeatTimer) return;
        heartbeatTimer = setTimeout(sendHeartbeat, 1500);
      }
      async function sendHeartbeat() {
        heartbeatTimer = null;
        const s = mediaSummary();
        try {
          await setDoc(refs.screen(screenId), {
            kind: "main",
            version: APP_VERSION,
            at: Date.now(),
            audioUnlocked,
            media: {
              total: s.total,
              ready: s.ready,
              loading: s.loading,
              issues: s.issues,
            },
          });
        } catch (err) {
          console.warn("heartbeat failed", err);
        }
      }
      setInterval(sendHeartbeat, 20000);
      scheduleHeartbeat();

      // ---- 動画プレイヤー ----
      // <video> は 1 つだけ作って使い回す。画面の切り替え（受付中→締切→正解発表）で
      // 作り直さないので、一時停止した位置から続きを再生できる。
      const videoEl = document.createElement("video");
      videoEl.id = "mq-video";
      videoEl.controls = true;
      videoEl.playsInline = true;
      videoEl.preload = "auto";
      videoEl.muted = true;
      videoEl.textContent = "この動画URLはブラウザで再生できません。";
      let videoKey = null;

      afterUnlock = () => {
        if (videoEl.isConnected && state?.videoMuted === false) {
          videoEl.muted = false;
          if (state.videoPlaying !== false && !videoEl.ended) videoEl.play().catch(() => {});
        }
        scheduleHeartbeat();
      };
      if (audioUnlocked) afterUnlock();

      function resolveVideoSrc(rawUrl) {
        const abs = directVideoUrl(rawUrl);
        const e = media.get(abs);
        return e?.state === "ready" && e.blobUrl ? e.blobUrl : abs;
      }

      function mediaSlotHtml(quiz, className) {
        if (!quiz?.videoUrl) return "";
        const embed = embedUrlOf(quiz.videoUrl);
        if (embed) {
          return `<iframe src="${escapeHtml(embed)}" class="${className}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
        }
        return `<div id="video-slot" class="${className}"></div>`;
      }

      // 描画後に呼ぶ。スロットがあれば動画を差し込み、無ければ止める。
      function mountVideo(quiz) {
        const slot = document.getElementById("video-slot");
        if (!slot || !quiz?.videoUrl) {
          if (!videoEl.paused) videoEl.pause();
          return;
        }
        const key = `${quiz.id}|${quiz.videoUrl}|${state?.votingStartedAt ?? ""}`;
        if (videoKey !== key) {
          videoKey = key;
          videoEl.src = resolveVideoSrc(quiz.videoUrl);
          // 新しい問題の動画は今の指示（再生/停止）から始める。過去の「頭から再生」は使わない。
          lastVideoCmdAt = state?.videoCmdAt ?? null;
        }
        videoEl.className = "w-full h-full bg-black";
        slot.appendChild(videoEl);
        applyVideoState(true);
      }

      // admin からの指示を <video> に反映する。
      // 同じ指示が繰り返し届いても副作用が出ないよう videoCmdAt で新旧を判定する。
      // reattach=true は再描画で差し直しただけ（位置はそのまま、終わった動画を勝手に頭から流さない）。
      function applyVideoState(reattach) {
        if (!videoEl.isConnected || !state) return;
        const cmdAt = state.videoCmdAt ?? null;
        const isNewCmd = cmdAt !== lastVideoCmdAt;
        if (!isNewCmd && !reattach) return;
        if (isNewCmd) {
          lastVideoCmdAt = cmdAt;
          if (typeof state.videoSeekTo === "number") {
            try {
              videoEl.currentTime = state.videoSeekTo;
            } catch {}
          }
        }
        const wantSound = state.videoMuted === false;
        videoEl.muted = !wantSound;
        if (state.videoPlaying === false) {
          videoEl.pause();
          return;
        }
        if (reattach && !isNewCmd && (videoEl.ended || !videoEl.paused)) return;
        videoEl.play().catch(() => {
          if (wantSound) {
            // 音声付き再生を拒否されたらミュートで再生を継続し、案内を出す
            videoEl.muted = true;
            videoEl.play().catch(() => {});
            showSoundHint();
          }
        });
      }

      function showSoundHint() {
        if (audioUnlocked) return;
        const hint = document.getElementById("sound-hint");
        if (hint) hint.classList.remove("hidden");
      }

      // .mq-fit-inner の実寸が親を超えていたら scale で縮小して1画面に収める。
      // 画像・動画の読み込み後にも高さが変わるので ResizeObserver で追従する。
      let fitObserver = null;
      function applyFit() {
        document.querySelectorAll(".mq-fit").forEach((box) => {
          const inner = box.querySelector(".mq-fit-inner");
          if (!inner) return;
          inner.style.transform = "scale(1)";
          const availH = box.clientHeight;
          const availW = box.clientWidth;
          // scrollHeight は影や絶対配置を取りこぼすので実測の矩形も見る
          const rect = inner.getBoundingClientRect();
          const needH = Math.max(inner.scrollHeight, Math.ceil(rect.height));
          const needW = Math.max(inner.scrollWidth, Math.ceil(rect.width));
          if (!availH || !needH) return;
          const scale = Math.min(1, availH / needH, availW / (needW || 1));
          const scaled = scale < 0.999;
          box.classList.toggle("is-scaled", scaled);
          if (scaled) {
            inner.style.transform = `scale(${scale})`;
          }
        });
      }

      function scheduleFit() {
        requestAnimationFrame(() => {
          applyFit();
          // フォント・画像の反映が遅れるケースの保険
          setTimeout(applyFit, 120);
          setTimeout(applyFit, 500);
        });
        if (fitObserver) fitObserver.disconnect();
        fitObserver = new ResizeObserver(() => applyFit());
        document
          .querySelectorAll(".mq-fit-inner")
          .forEach((el) => fitObserver.observe(el));
      }

      window.addEventListener("resize", applyFit);

      let votingRenderKey = null;
      let resultRenderSig = null;
      let questionTypingTimer = null;
      let typedQuizId = null;

      function stopQuestionTyping() {
        if (questionTypingTimer) clearTimeout(questionTypingTimer);
        questionTypingTimer = null;
      }

      // クイズ番組風に1文字ずつ流す。句読点で一拍置くと読み上げのリズムに近づく。
      function typeQuestion(text) {
        stopQuestionTyping();
        const el = document.getElementById("question-text");
        if (!el) return;
        const chars = Array.from(String(text || ""));
        // 長文でも間延びしないよう、全体で 3.5〜5 秒に収まる速度を選ぶ
        const base = Math.max(
          45,
          Math.min(110, Math.floor(4200 / Math.max(1, chars.length)))
        );
        let index = 0;
        el.textContent = "";
        el.classList.add("mq-typing");
        const tick = () => {
          if (!el.isConnected) {
            questionTypingTimer = null;
            return;
          }
          const ch = chars[index] ?? "";
          el.textContent += ch;
          index += 1;
          if (index < chars.length) {
            // 句読点・記号のあとは長めに止めて「読ませる」
            const pause = /[、。，,！!？?：:]/.test(ch)
              ? base * 6
              : /[「」『』（）()]/.test(ch)
              ? base * 2
              : base;
            questionTypingTimer = setTimeout(tick, pause);
          } else {
            el.classList.remove("mq-typing");
            questionTypingTimer = null;
          }
        };
        // 画面が切り替わった直後に少し溜めてから流し始める
        questionTypingTimer = setTimeout(tick, 320);
      }

      function render() {
        // 出題中は右下の動画準備表示を出さない（ゲストに見せる画面なので）
        document.body.dataset.status = state?.status || "";
        if (!state) {
          votingRenderKey = null;
          resultRenderSig = null;
          root.innerHTML = `<div class="flex-1 flex items-center justify-center"><p class="qz-onDark-muted">待機中...</p></div>`;
          mountVideo(null);
          return;
        }
        if (state.status === "voting" || state.status === "closed") {
          // 同じ問題・同じステータスの間は全再描画せず部分更新（動画を壊さない・文字送りを止めない）
          const key = `${state.currentQuizId || ""}|${state.status}`;
          if (key === votingRenderKey && document.getElementById("mq-voting")) {
            return updateVotingView();
          }
          votingRenderKey = key;
          resultRenderSig = null;
          return renderVoting();
        }
        votingRenderKey = null;
        stopQuestionTyping();
        if (state.status === "result") return renderResult();
        resultRenderSig = null;
        if (state.status === "intro") return renderIntro();
        if (state.status === "join") return renderJoin();
        lobbyRenderSig = null;
        if (state.status === "final_ranking") return renderFinal();
        return renderWaiting();
      }

      // 説明画面・受付画面は state の更新のたびに描き直すと QR やアニメーションがちらつくので、
      // 中身が変わったときだけ描き直す
      let lobbyRenderSig = null;

      function noTeamsHtml() {
        return `<div class="qz-card p-8 text-center max-w-xl mx-auto">
                  <p class="qz-display" style="font-size:2rem">No teams yet</p>
                  <p class="qz-muted text-sm mt-2">まだチームが登録されていません（管理画面で代表者名を登録してください）</p>
                </div>`;
      }

      // 開始前のタイトル画面。参加用の QR は「参加受付」（join）で出す。
      function renderWaiting() {
        typedQuizId = null;
        const currentIdx = state.currentQuizIndex ?? -1;
        const isStart = currentIdx < 0;
        const quiz = quizzes.find((q) => q.id === state.currentQuizId);
        const prevCorrect = correctIndexOf(quiz, state);

        root.innerHTML = `
          <header class="text-center shrink-0">
            <p class="qz-display qz-display--cream" style="font-size:clamp(3rem,7vw,5.5rem)">Wedding Quiz</p>
            <p class="qz-label qz-onDark-muted mt-1">
              ${isStart ? "Starting soon" : `Round ${currentIdx + 1} / ${quizzes.length} done`}
            </p>
          </header>
          <div class="mq-fit mt-4">
            <div class="mq-fit-inner max-w-2xl mx-auto space-y-3">
              ${
                isStart
                  ? `<p class="qz-jp-head text-center" style="color:var(--cream);font-size:clamp(1.25rem,2.4vw,2rem)">まもなく始まります</p>`
                  : teams.length === 0
                  ? noTeamsHtml()
                  : renderScoreboard()
              }
              ${
                quiz && !isStart && Number.isInteger(prevCorrect)
                  ? `<div class="qz-panel p-3">
                       <div class="qz-label qz-onDark-muted" style="font-size:10px">Previous</div>
                       <div class="text-sm truncate mt-1">${escapeHtml(
                         quiz.question
                       )}</div>
                       <div class="text-xs mt-1 qz-coral font-bold">
                         ${choiceLetter(prevCorrect)}.
                         ${escapeHtml(quiz.choices[prevCorrect])}
                       </div>
                     </div>`
                  : ""
              }
            </div>
          </div>
          <div class="shrink-0 text-center text-xs qz-onDark-muted mt-2">
            参加チーム ${teams.length} / 全 ${quizzes.length} 問
          </div>
        `;
        mountVideo(null);
        scheduleFit();
      }

      // 参加方法の説明。司会者が読み上げている間に映す（管理画面の「使い方を表示」）。
      function renderIntro() {
        typedQuizId = null;
        if (lobbyRenderSig === "intro" && document.getElementById("mq-intro")) return;
        lobbyRenderSig = "intro";
        // 文節単位で折り返す（「名前を入 / れて」のような途中改行を防ぐ）
        const steps = [
          ["それぞれ QR コードを", "読み込んで"],
          ["回答画面に", "チーム全員の", "名前を入れて"],
          ["OK を押して", "待っていてください"],
        ].map((phrases) =>
          phrases.map((p) => `<span style="display:inline-block">${p}</span>`).join("")
        );
        root.innerHTML = `
          <header id="mq-intro" class="text-center shrink-0">
            <p class="qz-display qz-display--pink" style="font-size:clamp(2.5rem,5vw,4.25rem)">How to join</p>
            <p class="qz-jp-head mt-2" style="color:var(--cream);font-size:clamp(1.1rem,2vw,1.6rem)">参加のしかた</p>
          </header>
          <div class="mq-fit mt-6">
            <div class="mq-fit-inner max-w-6xl mx-auto">
              <p class="qz-jp-head text-center leading-relaxed" style="color:var(--cream);font-size:clamp(1.4rem,2.6vw,2.4rem)">
                これから、それぞれのチームの<br />
                <span class="qz-coral">代表者さんの名前</span>と<span class="qz-coral">QR コード</span>が出てきます
              </p>
              <div class="grid grid-cols-3 gap-8 mt-10">
                ${steps
                  .map(
                    (text, i) => `
                  <section class="qz-card p-6 text-center">
                    <div class="mq-step__num">${i + 1}</div>
                    <p class="qz-jp-head mt-4 leading-snug" style="font-size:clamp(1.1rem,1.9vw,1.75rem)">${text}</p>
                  </section>`
                  )
                  .join("")}
              </div>
            </div>
          </div>
        `;
        mountVideo(null);
        scheduleFit();
      }

      // 参加受付。チームごとに代表者名と専用 QR を並べ、OK を押したチームから表示を切り替える。
      // QR の生成は重いので、チームの顔ぶれが変わったときだけ描き直し、受付状況は部分更新する。
      function renderJoin() {
        typedQuizId = null;
        const sig = JSON.stringify(["join", teams.map((t) => [t.id, t.name])]);
        if (lobbyRenderSig === sig && document.getElementById("mq-join")) {
          updateJoinStatus(false);
          return;
        }
        lobbyRenderSig = sig;
        const n = teams.length;
        const qrSize = n <= 3 ? 280 : n <= 5 ? 220 : n <= 8 ? 190 : 150;
        const cols = n <= 5 ? Math.max(n, 1) : Math.ceil(n / 2);
        root.innerHTML = `
          <header id="mq-join" class="text-center shrink-0">
            <p class="qz-display qz-display--pink" style="font-size:clamp(2.25rem,4.5vw,3.75rem)">Entry</p>
            <p class="qz-jp-head mt-2" style="color:var(--cream);font-size:clamp(1rem,1.8vw,1.5rem)">
              自分のチームの QR コードを読み込み、チーム全員の名前を入れて OK を押してください
            </p>
          </header>
          <div class="mq-fit mt-6">
            <div class="mq-fit-inner">
              ${
                n === 0
                  ? noTeamsHtml()
                  : `<div class="grid gap-6" style="grid-template-columns:repeat(${cols}, ${
                      qrSize + 48
                    }px);justify-content:center">
                      ${teams
                        .map(
                          (t, i) => `
                        <section class="mq-entry qz-card p-4 flex flex-col items-center text-center"
                          data-team="${t.id}" style="border-top:10px solid ${teamColor(i)}">
                          <div class="qz-label qz-muted" style="font-size:11px">代表</div>
                          <div class="qz-jp-head truncate w-full" style="font-size:1.6rem">${escapeHtml(
                            t.name
                          )}</div>
                          <div class="mq-entry__qr mt-3" data-qr="${t.id}"></div>
                          <div class="mt-3 w-full" data-entry-status="${t.id}"></div>
                        </section>`
                        )
                        .join("")}
                    </div>`
              }
            </div>
          </div>
          <div id="mq-join-count" class="shrink-0 text-center qz-onDark-muted mt-2" style="font-size:1rem"></div>
        `;

        teams.forEach((t) => {
          const box = root.querySelector(`[data-qr="${t.id}"]`);
          if (!box) return;
          const url = teamJoinUrl(t.id);
          try {
            new QRCode(box, {
              text: url,
              width: qrSize,
              height: qrSize,
              colorDark: "#174c39",
              colorLight: "#fffaf0",
              correctLevel: QRCode.CorrectLevel.M,
            });
          } catch (err) {
            console.error(err);
            box.innerHTML = `<p class="text-xs p-2" style="max-width:${qrSize}px;word-break:break-all">${escapeHtml(
              url
            )}</p>`;
          }
        });
        updateJoinStatus(true);
        mountVideo(null);
        scheduleFit();
      }

      // 受付状況だけを書き換える。OK になった瞬間だけポップさせる（描き直しのたびに動かさない）。
      function updateJoinStatus(initial) {
        let ready = 0;
        teams.forEach((t) => {
          const isReady = !!t.readyAt;
          if (isReady) ready++;
          const card = root.querySelector(`.mq-entry[data-team="${t.id}"]`);
          const box = root.querySelector(`[data-entry-status="${t.id}"]`);
          if (!card || !box) return;
          const members = teamMembers(t);
          const sig = JSON.stringify([isReady, members]);
          if (box.dataset.sig === sig) return;
          const becameReady = isReady && box.dataset.ready !== "1";
          box.dataset.sig = sig;
          box.dataset.ready = isReady ? "1" : "0";
          card.classList.toggle("is-ready", isReady);
          box.innerHTML = isReady
            ? `<div class="mq-ok${becameReady && !initial ? " mq-ok-pop" : ""}">✓ OK</div>
               ${
                 members.length
                   ? `<div class="mq-members">${members
                       .map((m) => `<span>${escapeHtml(m)}</span>`)
                       .join("")}</div>`
                   : ""
               }`
            : `<div class="mq-entry__wait">待機中…</div>`;
        });
        const count = document.getElementById("mq-join-count");
        if (count) count.textContent = `受付完了 ${ready} / ${teams.length} チーム`;
      }

      // 正解チーム。採点済みなら採点時に点を入れたチームをそのまま出す（表示と点数を必ず一致させる）。
      function correctTeamsOf(quiz, correct, teamById, answerByTeam) {
        if (state.scoredForQuizId === quiz.id && Array.isArray(state.scoredTeamIds)) {
          return state.scoredTeamIds.map((id) => teamById.get(id)).filter(Boolean);
        }
        const list = [];
        teamById.forEach((t) => {
          const a = answerByTeam.get(t.id);
          if (a && a.choice === correct) list.push(t);
        });
        return list;
      }

      function renderCorrectTeamsBanner(correctTeams, quiz) {
        const points = state.scoredForQuizId === quiz.id && state.scoredPoints
          ? state.scoredPoints
          : quiz.points || 10;
        if (correctTeams.length === 0) {
          return `
            <div class="qz-panel p-4 text-center">
              <div class="qz-label qz-onDark-muted" style="font-size:10px">Correct teams</div>
              <div class="text-xl font-bold mt-1 qz-onDark-muted">正解なし…</div>
            </div>`;
        }
        return `
          <div class="qz-card p-4">
            <div class="text-center mb-3">
              <span class="qz-display qz-display--coral" style="font-size:1.75rem">+${points}</span>
              <span class="qz-label ml-2" style="color:var(--forest)">Correct</span>
            </div>
            <div class="flex flex-wrap justify-center gap-2">
              ${correctTeams
                .map((t) => {
                  const color = teamColor(t.origIndex);
                  return `
                  <div class="flex items-center gap-2 px-3 py-2"
                    style="border:2.4px solid ${color};background:var(--pink-soft)">
                    <span class="w-3 h-3" style="background-color:${color}"></span>
                    <span class="qz-jp-head text-lg">${escapeHtml(t.name)}</span>
                  </div>`;
                })
                .join("")}
            </div>
          </div>`;
      }

      function renderScoreboard() {
        const sorted = [...teams]
          .map((t, i) => ({ ...t, origIndex: i }))
          .sort((a, b) => (b.score || 0) - (a.score || 0));
        const max = Math.max(1, ...teams.map((x) => x.score || 0));
        return `
          <section class="qz-card p-4">
            <h2 class="qz-label" style="color:var(--forest)">Score</h2>
            <div class="space-y-1.5 mt-2">
              ${sorted
                .map((t) => {
                  const color = teamColor(t.origIndex);
                  const pct = ((t.score || 0) / max) * 100;
                  return `
                  <div class="flex items-center gap-2.5 text-xs">
                    <div class="w-24 font-bold truncate">${escapeHtml(
                      t.name
                    )}</div>
                    <div class="flex-1 h-4" style="background:var(--sage-soft);border:1.5px solid var(--forest)">
                      <div class="h-full" style="width:${pct}%;background-color:${color}"></div>
                    </div>
                    <div class="w-10 text-right">
                      <span class="qz-display" style="font-size:1.1rem">${
                        t.score || 0
                      }</span>
                    </div>
                  </div>`;
                })
                .join("")}
            </div>
          </section>`;
      }

      function renderVoting() {
        const quiz = quizzes.find((q) => q.id === state.currentQuizId);
        if (!quiz) {
          root.innerHTML = `<div id="mq-voting" class="flex-1 flex items-center justify-center"><p class="qz-onDark-muted">問題情報が見つかりません</p></div>`;
          // 問題の読み込みが後から届いたら描き直せるようにする
          votingRenderKey = null;
          mountVideo(null);
          return;
        }
        const closed = state.status === "closed";
        const live = isLiveQuiz(quiz);
        // durationMs が無い問題は無制限（司会者が手動で締め切る）
        const unlimited = !state.durationMs;
        const elapsed = Date.now() - (state.votingStartedAt || Date.now());
        const duration = state.durationMs || 0;
        const remainingMs = unlimited || closed ? 0 : Math.max(0, duration - elapsed);
        const remaining = Math.ceil(remainingMs / 1000);
        const progress = closed
          ? 0
          : unlimited
          ? 1
          : Math.max(0, Math.min(1, remainingMs / duration));
        const answeredTeamIds = new Set(answers.map((a) => a.teamId));
        const hasMedia = !!(quiz.videoUrl || quiz.imageUrl);

        const circumference = 2 * Math.PI * 52;
        const dashOffset = circumference * (1 - progress);
        const timerColor = closed
          ? "#ef7044"
          : unlimited
          ? "#174c39"
          : remaining <= 5
          ? "#ef7044"
          : remaining <= 10
          ? "#d9a84e"
          : "#174c39";

        // 文字送りは最初に出題したときだけ。締切画面・再描画では全文をそのまま出す。
        const typeNow = !closed && typedQuizId !== quiz.id;

        // 上: 問題文＋タイマー / 中: メディアを1カラムで大きく
        // 下: 選択肢と回答状況を2カラム
        root.innerHTML = `
          <header id="mq-voting" class="shrink-0 flex items-stretch gap-5">
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-3 mb-1.5">
                <span class="qz-label qz-onDark-muted">
                  Q${(state.currentQuizIndex ?? 0) + 1} / ${quizzes.length}
                </span>
                <span class="text-xs font-bold px-2.5 py-1"
                  style="background:var(--coral);color:#fff">${
                    quiz.points || 10
                  } 点問題</span>
              </div>
              <div class="mq-question px-8 py-5 ${
                hasMedia ? "text-xl md:text-3xl" : "text-3xl md:text-5xl"
              } font-black text-center leading-snug flex items-center justify-center"
                style="font-family:var(--font-body);min-height:5.5rem">
                <span class="mq-type-wrap">
                  <span class="mq-type-ghost" aria-hidden="true">${escapeHtml(
                    quiz.question
                  )}</span>
                  <span id="question-text" class="mq-type-live">${
                    typeNow ? "" : escapeHtml(quiz.question)
                  }</span>
                </span>
              </div>
            </div>
            <div class="relative shrink-0 flex items-center">
              <div class="qz-card p-2" style="box-shadow:6px 6px 0 0 var(--pink)">
                <svg width="120" height="120" viewBox="0 0 128 128">
                  <circle cx="64" cy="64" r="52" stroke="#dde2de" stroke-width="10" fill="none"/>
                  <circle id="timer-ring-fg" cx="64" cy="64" r="52" stroke="${timerColor}" stroke-width="10" fill="none"
                    stroke-linecap="butt"
                    transform="rotate(-90 64 64)"
                    stroke-dasharray="${circumference}"
                    stroke-dashoffset="${dashOffset}"
                    class="timer-ring"/>
                </svg>
                <div class="absolute inset-0 flex flex-col items-center justify-center text-center leading-none">
                  ${
                    closed
                      ? `<span class="qz-jp-head text-base" style="color:var(--coral)">回答<br />締切</span>`
                      : unlimited
                      ? `<span class="qz-jp-head text-sm">回答<br />受付中</span>`
                      : `<span id="timer-num" class="qz-display" style="font-size:2.75rem;color:${timerColor}">${remaining}</span>`
                  }
                </div>
              </div>
            </div>
          </header>
          ${
            closed
              ? `<div class="shrink-0 mt-3 text-center qz-card py-2 px-4" style="box-shadow:6px 6px 0 0 var(--coral)">
                   <span class="qz-display qz-display--coral" style="font-size:1.6rem">Time's up!</span>
                   <span class="qz-jp-head text-lg ml-3">${
                     live
                       ? "回答締切！ このあとの結果で正解が決まります"
                       : "回答締切！ 正解発表をお待ちください"
                   }</span>
                 </div>`
              : ""
          }
          <div class="mq-fit mt-4">
            <div class="mq-fit-inner flex flex-col items-center gap-4">
              ${
                hasMedia
                  ? `<div class="w-full flex flex-col items-center gap-3">
                      ${mediaSlotHtml(
                        quiz,
                        "mq-media-video w-full aspect-video bg-black"
                      )}
                      ${
                        quiz.imageUrl
                          ? `<img src="${quiz.imageUrl}" class="max-h-[60vh] w-auto max-w-full object-contain" style="border:2.4px solid var(--cream);box-shadow:10px 10px 0 0 rgba(0,0,0,.35)" />`
                          : ""
                      }
                    </div>`
                  : ""
              }
              <div class="w-full grid lg:grid-cols-[1fr_auto] gap-5 items-start">
                <div class="grid grid-cols-2 gap-4 min-w-0">
                  ${quiz.choices
                    .map(
                      (c, i) => `
                    <div class="qz-choice${hasMedia ? " qz-choice--calm" : ""}">
                      <span class="qz-choice__key" style="font-size:${
                        hasMedia ? "1.5rem" : "2rem"
                      }">${choiceLetter(i)}</span>
                      <span class="qz-choice__body ${
                        hasMedia ? "text-base md:text-xl" : "text-xl md:text-2xl"
                      }">${escapeHtml(c)}</span>
                    </div>`
                    )
                    .join("")}
                </div>
                <section id="answered-section" class="w-full lg:w-56 shrink-0">
                  ${answeredChipsHtml(answeredTeamIds)}
                </section>
              </div>
            </div>
          </div>
        `;
        if (typeNow) {
          typedQuizId = quiz.id;
          typeQuestion(quiz.question);
        } else {
          stopQuestionTyping();
        }
        mountVideo(quiz);
        scheduleFit();
      }

      // 選択肢の横に縦並びで置くので、狭い幅でも読めるようにする
      function answeredChipsHtml(answeredTeamIds) {
        return `
            <div class="qz-panel p-3">
              <div class="qz-label qz-onDark-muted" style="font-size:10px">
                Answered
                <span class="qz-coral ml-1" style="font-size:14px">${
                  answeredTeamIds.size
                }</span>/${teams.length}
              </div>
              <div class="flex flex-wrap lg:flex-col gap-1.5 mt-2">
                ${teams
                  .map((t, i) => {
                    const answered = answeredTeamIds.has(t.id);
                    const color = teamColor(i);
                    return `
                    <div class="px-2 py-1 text-xs flex items-center gap-1.5 ${
                      answered ? "" : "opacity-40"
                    }"
                      style="border:1.5px solid ${color};background:rgba(0,0,0,.2)">
                      <span class="w-2 h-2 shrink-0" style="background-color:${color}"></span>
                      <span class="truncate flex-1">${escapeHtml(t.name)}</span>
                      ${
                        answered
                          ? '<span class="qz-coral shrink-0 font-bold">✓</span>'
                          : ""
                      }
                    </div>`;
                  })
                  .join("")}
              </div>
            </div>`;
      }

      function updateVotingView() {
        const section = document.getElementById("answered-section");
        if (section) {
          const html = answeredChipsHtml(new Set(answers.map((a) => a.teamId)));
          if (section.dataset.html !== html) {
            section.innerHTML = html;
            section.dataset.html = html;
          }
        }
        applyVideoState(false);
        if (state.status !== "voting" || !state.durationMs) return; // 無制限・締切後はカウントダウンしない
        const duration = state.durationMs;
        const elapsed = Date.now() - (state.votingStartedAt || Date.now());
        const remainingMs = Math.max(0, duration - elapsed);
        const remaining = Math.ceil(remainingMs / 1000);
        const progress = Math.max(0, Math.min(1, remainingMs / duration));
        // リングの半径は renderVoting の r=52 と一致させる
        const circumference = 2 * Math.PI * 52;
        const timerColor =
          remaining <= 5 ? "#ef7044" : remaining <= 10 ? "#d9a84e" : "#174c39";
        const num = document.getElementById("timer-num");
        if (num) {
          num.textContent = remaining;
          num.style.color = timerColor;
        }
        const ring = document.getElementById("timer-ring-fg");
        if (ring) {
          ring.setAttribute("stroke", timerColor);
          ring.setAttribute("stroke-dashoffset", circumference * (1 - progress));
        }
      }

      function renderResult() {
        const quiz = quizzes.find((q) => q.id === state.currentQuizId);
        if (!quiz) {
          resultRenderSig = null;
          root.innerHTML = `<div class="flex-1 flex items-center justify-center"><p class="qz-onDark-muted">問題情報が見つかりません</p></div>`;
          mountVideo(null);
          return;
        }
        const correct = correctIndexOf(quiz, state);
        const teamById = new Map(
          teams.map((t, i) => [t.id, { ...t, origIndex: i }])
        );
        const answerByTeam = new Map(answers.map((a) => [a.teamId, a]));
        const correctTeams = correctTeamsOf(quiz, correct, teamById, answerByTeam);
        const hasMedia = !!(quiz.videoUrl || quiz.imageUrl);

        // 中身が変わらないときは描き直さない（埋め込み動画の再読み込みを防ぐ）
        const sig = JSON.stringify([
          quiz.id,
          quiz.question,
          quiz.choices,
          quiz.videoUrl,
          quiz.imageUrl ? quiz.imageUrl.length : 0,
          correct,
          state.scoredTeamIds,
          teams.map((t) => [t.id, t.name, t.score]),
          answers.map((a) => [a.teamId, a.choice]),
        ]);
        if (sig === resultRenderSig && document.getElementById("mq-result")) return;
        resultRenderSig = sig;

        // 出題中と同じ構成: メディアは1カラムで大きく、その下を2カラム
        root.innerHTML = `
          <header id="mq-result" class="shrink-0 text-center">
            <p class="qz-display qz-display--pink" style="font-size:clamp(2rem,4vw,3.25rem)">Answer</p>
            <h1 class="text-lg md:text-xl font-black truncate qz-cream mt-0.5">
              ${escapeHtml(quiz.question)}
            </h1>
          </header>
          <div class="mq-fit mt-3">
            <div class="mq-fit-inner flex flex-col items-center gap-4">
              ${
                hasMedia
                  ? `<div class="w-full flex flex-col items-center gap-3">
                      ${mediaSlotHtml(
                        quiz,
                        "mq-media-video w-full aspect-video bg-black"
                      )}
                      ${
                        quiz.imageUrl
                          ? `<img src="${quiz.imageUrl}" class="max-h-[50vh] w-auto max-w-full object-contain" style="border:2.4px solid var(--cream);box-shadow:10px 10px 0 0 rgba(0,0,0,.35)" />`
                          : ""
                      }
                    </div>`
                  : ""
              }
              <div class="w-full grid lg:grid-cols-2 gap-5 items-start">
                <div class="space-y-3 min-w-0">
                  ${quiz.choices
                    .map((c, i) => {
                      const isCorrect = i === correct;
                      return `
                      <div class="qz-choice ${
                        isCorrect ? "qz-choice--correct" : "qz-choice--dim"
                      }">
                        <span class="qz-choice__key" style="font-size:1.5rem">${choiceLetter(
                          i
                        )}</span>
                        <span class="qz-choice__body ${
                          hasMedia ? "text-base md:text-lg" : "text-lg md:text-xl"
                        }">
                          ${escapeHtml(c)}
                          ${
                            isCorrect
                              ? '<span class="ml-auto qz-label shrink-0" style="color:var(--coral)">Correct</span>'
                              : ""
                          }
                        </span>
                      </div>`;
                    })
                    .join("")}
                </div>
                <div class="space-y-3 min-w-0">
                  ${renderCorrectTeamsBanner(correctTeams, quiz)}
                  <div class="qz-panel p-4">
                    <h2 class="qz-label qz-onDark-muted" style="font-size:10px">Team answers</h2>
                    <div class="flex flex-wrap gap-2 mt-2">
                      ${teams
                        .map((t, i) => {
                          const a = answerByTeam.get(t.id);
                          const color = teamColor(i);
                          const isCorrect = a?.choice === correct;
                          return `
                          <div class="px-2.5 py-1.5 text-xs"
                            style="border:1.5px solid ${color};background:rgba(0,0,0,.2)">
                            <div class="flex items-center gap-1.5 qz-onDark-muted" style="font-size:10px">
                              <span class="w-2 h-2" style="background-color:${color}"></span>
                              ${escapeHtml(t.name)}
                            </div>
                            <div class="mt-0.5">
                              ${
                                a
                                  ? `<strong>${choiceLetter(
                                      a.choice
                                    )}</strong> ${escapeHtml(
                                      quiz.choices[a.choice]
                                    )} <span class="${
                                      isCorrect ? "qz-coral" : "qz-onDark-muted"
                                    } font-bold">${isCorrect ? "✓" : "✗"}</span>`
                                  : "<span class='qz-onDark-muted'>未回答</span>"
                              }
                            </div>
                          </div>`;
                        })
                        .join("")}
                    </div>
                  </div>
                  ${renderScoreboard()}
                </div>
              </div>
            </div>
          </div>
        `;
        mountVideo(quiz);
        scheduleFit();
      }

      function renderFinal() {
        const sorted = [...teams]
          .map((t, i) => ({ ...t, origIndex: i }))
          .sort((a, b) => (b.score || 0) - (a.score || 0));
        root.innerHTML = `
          <header class="text-center shrink-0 mb-5">
            <p class="qz-display qz-display--cream" style="font-size:clamp(3rem,7vw,5.5rem)">Final Result</p>
            <p class="qz-label qz-onDark-muted mt-1">Thank you for playing</p>
          </header>
          <section class="mq-fit">
            <div class="mq-fit-inner max-w-3xl mx-auto space-y-3">
              ${sorted
                .map((t, rank) => {
                  const color = teamColor(t.origIndex);
                  const isTop = rank === 0;
                  const members = teamMembers(t);
                  return `
                  <div class="${
                    isTop ? "qz-card" : "qz-panel"
                  } flex items-center gap-4 p-4">
                    <div class="qz-display ${
                      isTop ? "qz-display--coral" : "qz-display--pink"
                    }" style="font-size:${
                    isTop ? "3rem" : "2rem"
                  };width:5rem;flex-shrink:0">${rank + 1}</div>
                    <div class="w-2.5 self-stretch shrink-0" style="background-color:${color}"></div>
                    <div class="flex-1 min-w-0">
                      <div class="${
                        isTop ? "" : "qz-cream"
                      } font-black truncate" style="font-size:${
                    isTop ? "1.75rem" : "1.25rem"
                  }">${escapeHtml(t.name)}</div>
                      ${
                        members.length
                          ? `<div class="text-xs truncate ${
                              isTop ? "qz-muted" : "qz-onDark-muted"
                            }">${escapeHtml(members.join("・"))}</div>`
                          : ""
                      }
                    </div>
                    <div class="text-right shrink-0">
                      <span class="qz-display ${
                        isTop ? "" : "qz-display--cream"
                      }" style="font-size:${isTop ? "3rem" : "2rem"}">${
                    t.score || 0
                  }</span>
                      <span class="text-xs ${
                        isTop ? "qz-muted" : "qz-onDark-muted"
                      } ml-1">点</span>
                    </div>
                  </div>`;
                })
                .join("")}
            </div>
          </section>
        `;
        mountVideo(null);
        scheduleFit();
      }

    </script>
  </body>
</html>
