<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>メイン画面 - ウェディングクイズ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Shippori+Mincho+B1:wght@600;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        --mq-gold-hi: #f7e39a;
        --mq-gold: #d4af37;
        --mq-gold-lo: #8a6a1c;
        --mq-navy-hi: #1c2f6b;
        --mq-navy: #0c1740;
        --mq-navy-lo: #060d28;
        --mq-ink: #02040f;
        --mq-text: #f7f3e6;
        --mq-muted: #a7a4c7;
      }
      body {
        font-family: "Noto Sans JP", sans-serif;
        color: var(--mq-text);
        background-color: var(--mq-ink);
        background-image:
          radial-gradient(ellipse 90% 60% at 50% 0%, rgba(47, 76, 167, 0.45), transparent 65%),
          radial-gradient(ellipse 140% 110% at 50% 55%, #12225c 0%, #081233 55%, #02040f 100%);
        background-attachment: fixed;
      }
      .mq-serif { font-family: "Cinzel", "Shippori Mincho B1", serif; letter-spacing: 0.08em; }
      .mq-mincho { font-family: "Shippori Mincho B1", serif; }
      .mq-gold-text {
        background: linear-gradient(180deg, var(--mq-gold-hi) 0%, var(--mq-gold) 55%, var(--mq-gold-lo) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .mq-panel {
        background: linear-gradient(180deg, rgba(28, 47, 107, 0.5) 0%, rgba(8, 18, 51, 0.92) 100%);
        border: 1px solid rgba(212, 175, 55, 0.4);
        border-radius: 0.75rem;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(247, 227, 154, 0.15);
      }
      .mq-hex {
        position: relative;
        padding: 2px;
        clip-path: polygon(26px 0, calc(100% - 26px) 0, 100% 50%, calc(100% - 26px) 100%, 26px 100%, 0 50%);
        background: linear-gradient(180deg, var(--mq-gold-hi) 0%, var(--mq-gold) 30%, var(--mq-gold-lo) 65%, var(--mq-gold) 100%);
      }
      .mq-hex-inner {
        width: 100%;
        height: 100%;
        clip-path: polygon(25px 0, calc(100% - 25px) 0, 100% 50%, calc(100% - 25px) 100%, 25px 100%, 0 50%);
        background: linear-gradient(180deg, #1a2b66 0%, #0c1740 50%, #060d28 100%);
      }
      .mq-hex-inner--selected {
        background: linear-gradient(180deg, #ffd98a 0%, #f59e0b 45%, #a85b06 100%);
        color: #241300;
      }
      .mq-hex-inner--correct {
        background: linear-gradient(180deg, #86efac 0%, #10b981 45%, #047857 100%);
        color: #04160d;
        animation: mq-flash 0.9s ease-in-out infinite alternate;
      }
      .mq-hex-inner--dim { opacity: 0.35; }
      @keyframes mq-flash {
        from { filter: brightness(1); }
        to { filter: brightness(1.35); }
      }
      .mq-hex-letter {
        font-family: "Cinzel", serif;
        color: var(--mq-gold-hi);
        font-weight: 700;
      }
      .mq-hex-inner--selected .mq-hex-letter,
      .mq-hex-inner--correct .mq-hex-letter { color: inherit; }
      .mq-hexline { position: relative; }
      .mq-hexline::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: 2px;
        transform: translateY(-1px);
        background: linear-gradient(90deg, transparent, var(--mq-gold) 12%, var(--mq-gold) 88%, transparent);
        z-index: 0;
      }
      .mq-hexline > .mq-hex { z-index: 1; }
      .mq-btn {
        border-radius: 0.5rem;
        border: 1px solid rgba(212, 175, 55, 0.5);
        background: linear-gradient(180deg, #1a2b66, #0c1740);
        color: var(--mq-text);
        transition: filter 0.15s;
      }
      .mq-btn:hover:not(:disabled) { filter: brightness(1.3); }
      .mq-btn:disabled { opacity: 0.4; cursor: not-allowed; }
      .mq-btn--gold {
        background: linear-gradient(180deg, var(--mq-gold-hi), var(--mq-gold) 50%, var(--mq-gold-lo));
        color: #241300;
        border-color: var(--mq-gold-hi);
        font-weight: 700;
      }
      .mq-btn--danger {
        background: linear-gradient(180deg, #7f1d1d, #450a0a);
        border-color: rgba(248, 113, 113, 0.6);
      }
      .mq-input {
        background: rgba(2, 4, 15, 0.6);
        border: 1px solid rgba(212, 175, 55, 0.35);
        border-radius: 0.5rem;
        color: var(--mq-text);
      }
      .mq-input:focus {
        outline: none;
        border-color: var(--mq-gold);
        box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.25);
      }
      .mq-input::placeholder { color: #8f8cae; }

      /* main.html 固有 */
      .timer-ring {
        transition: stroke-dashoffset 0.4s linear;
      }
    </style>
  </head>
  <body class="min-h-screen">
    <main id="root" class="min-h-screen p-10 flex flex-col">
      <p class="text-center text-[color:var(--mq-muted)]">接続中...</p>
    </main>
    <div id="sound-hint" class="fixed bottom-4 right-4 z-50 bg-black/75 border border-[rgba(212,175,55,0.5)] rounded-full px-4 py-2 text-sm text-[color:var(--mq-gold-hi)]">
      🔇 動画はミュートで自動再生されます。プレイヤーから音声をオンにできます
    </div>

    <script src="env.js"></script>
    <script type="module">
      import {
        ensureSignedIn,
        envError,
        refs,
        TEAM_COLORS,
        escapeHtml,
        renderSetupError,
      } from "./js/firebase-init.js";
      import {
        onSnapshot,
        query,
        orderBy,
        where,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

      const root = document.getElementById("root");

      document.addEventListener(
        "pointerdown",
        () => document.getElementById("sound-hint")?.remove(),
        { once: true }
      );

      if (envError) {
        renderSetupError(root, envError);
        throw new Error(envError);
      }

      try {
        await ensureSignedIn();
      } catch (err) {
        renderSetupError(root, err.message || String(err));
        throw err;
      }

      let state = null;
      let quizzes = [];
      let teams = [];
      let answers = [];
      let answersUnsub = null;
      let lastQuizId = null;

      onSnapshot(refs.state(), (snap) => {
        state = snap.exists() ? snap.data() : null;
        syncAnswersListener();
        render();
      });
      onSnapshot(query(refs.quizzes(), orderBy("order")), (snap) => {
        quizzes = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        render();
      });
      onSnapshot(query(refs.teams(), orderBy("order")), (snap) => {
        teams = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        render();
      });

      setInterval(() => {
        if (state?.status === "voting") render();
      }, 250);

      function syncAnswersListener() {
        const quizId = state?.currentQuizId;
        if (quizId === lastQuizId) return;
        lastQuizId = quizId;
        if (answersUnsub) {
          answersUnsub();
          answersUnsub = null;
        }
        answers = [];
        if (quizId) {
          answersUnsub = onSnapshot(
            query(refs.answers(), where("quizId", "==", quizId)),
            (snap) => {
              answers = snap.docs.map((d) => d.data());
              render();
            }
          );
        }
      }

      function teamColor(idx) {
        return TEAM_COLORS[idx % TEAM_COLORS.length];
      }

      function parseYouTubeTime(value) {
        if (!value) return null;
        if (/^\d+$/.test(value)) return value;
        const match = String(value).match(/(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?/);
        if (!match) return null;
        const seconds =
          (parseInt(match[1] || "0", 10) * 3600) +
          (parseInt(match[2] || "0", 10) * 60) +
          parseInt(match[3] || "0", 10);
        return seconds > 0 ? String(seconds) : null;
      }

      function youtubeEmbedUrl(rawUrl) {
        try {
          const url = new URL(rawUrl);
          const host = url.hostname.replace(/^www\./, "");
          let id = null;
          if (host === "youtu.be") {
            id = url.pathname.split("/").filter(Boolean)[0];
          } else if (host.endsWith("youtube.com")) {
            if (url.pathname === "/watch") {
              id = url.searchParams.get("v");
            } else {
              const parts = url.pathname.split("/").filter(Boolean);
              if (["embed", "shorts", "live"].includes(parts[0])) id = parts[1];
            }
          }
          if (!id) return null;
          const embed = new URL(
            `https://www.youtube.com/embed/${encodeURIComponent(id)}`
          );
          embed.searchParams.set("autoplay", "1");
          // 音声付き自動再生はほとんどのブラウザで拒否される。
          // まずミュートで確実に再生し、YouTube の操作で音声を戻す。
          embed.searchParams.set("mute", "1");
          embed.searchParams.set("controls", "1");
          embed.searchParams.set("playsinline", "1");
          embed.searchParams.set("rel", "0");
          const start = parseYouTubeTime(
            url.searchParams.get("start") || url.searchParams.get("t")
          );
          if (start) embed.searchParams.set("start", start);
          return embed.toString();
        } catch {
          return null;
        }
      }

      function videoHtml(rawUrl, className) {
        if (!rawUrl) return "";
        const youtubeUrl = youtubeEmbedUrl(rawUrl);
        if (youtubeUrl) {
          return `<iframe src="${escapeHtml(youtubeUrl)}" class="${className}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
        }
        return `<video src="${escapeHtml(rawUrl)}" class="${className}" controls autoplay muted playsinline></video>`;
      }

      function playerUrl(teamId) {
        const url = new URL("player.html", window.location.href);
        url.searchParams.set("team", teamId);
        return url.toString();
      }

      let votingRenderKey = null;
      function render() {
        if (!state) {
          votingRenderKey = null;
          root.innerHTML = `<div class="flex-1 flex items-center justify-center"><p class="text-[color:var(--mq-muted)]">待機中...</p></div>`;
          return;
        }
        if (state.status === "voting") {
          // 同じ問題の投票中は全再描画せず部分更新（動画 iframe を壊さないため）
          const key = state.currentQuizId || "";
          if (key === votingRenderKey && document.getElementById("timer-num")) {
            return updateVotingView();
          }
          votingRenderKey = key;
          return renderVoting();
        }
        votingRenderKey = null;
        if (state.status === "result") return renderResult();
        if (state.status === "final_ranking") return renderFinal();
        return renderWaiting();
      }

      function renderWaiting() {
        const currentIdx = state.currentQuizIndex ?? -1;
        const isStart = currentIdx < 0;
        root.innerHTML = `
          <header class="text-center mb-8">
            <p class="mq-serif mq-gold-text text-6xl md:text-8xl font-black tracking-widest mb-4">WEDDING QUIZ</p>
            <p class="text-xs text-[color:var(--mq-muted)] tracking-widest mb-2">ウェディングクイズ</p>
            <h1 class="mq-mincho text-4xl md:text-5xl font-bold">
              ${isStart ? "まもなく開始" : "次の問題を準備中"}
            </h1>
            <p class="mt-3 text-[color:var(--mq-muted)]">
              各チームの代表者はスマホで QR を読み取り、名前を入力してください
            </p>
          </header>
          <section id="qr-grid" class="grid ${
            teams.length <= 3
              ? "grid-cols-1 md:grid-cols-3"
              : "grid-cols-2 md:grid-cols-5"
          } gap-5 mb-8"></section>
          ${teams.length > 0 ? renderScoreboard() : ""}
        `;

        const grid = document.getElementById("qr-grid");
        teams.forEach((t, i) => {
          const color = teamColor(i);
          const card = document.createElement("div");
          card.className =
            "bg-white rounded-lg p-4 flex flex-col items-center border-2 border-[#d4af37] shadow-[0_0_24px_rgba(212,175,55,0.35)]";
          card.innerHTML = `
            <div class="w-full flex items-center gap-2 mb-3">
              <span class="w-3 h-3 rounded-full" style="background-color:${color}"></span>
              <span class="text-zinc-900 font-bold flex-1 truncate">${escapeHtml(
                t.name
              )}</span>
            </div>
            <div id="qr-${t.id}"></div>
            <div class="text-zinc-600 text-xs mt-3">
              代表: ${
                t.representative
                  ? `<span class="text-zinc-900 font-medium">${escapeHtml(
                      t.representative
                    )}</span>`
                  : `<span class="text-zinc-400">未登録</span>`
              }
            </div>
          `;
          grid.appendChild(card);
          new QRCode(card.querySelector(`#qr-${t.id}`), {
            text: playerUrl(t.id),
            width: 180,
            height: 180,
            correctLevel: QRCode.CorrectLevel.M,
          });
        });
      }

      function renderCorrectTeamsBanner(correct, teamById, answerByTeam, quiz) {
        const correctTeams = [];
        teamById.forEach((t) => {
          const a = answerByTeam.get(t.id);
          if (a && a.choice === correct) correctTeams.push(t);
        });
        const points = quiz.points || 10;
        if (correctTeams.length === 0) {
          return `
            <div class="max-w-5xl w-full mq-panel p-5 text-center">
              <div class="text-xs text-[color:var(--mq-muted)] tracking-wide">正解チーム</div>
              <div class="mq-mincho text-2xl font-bold text-[color:var(--mq-muted)] mt-1">正解なし…</div>
            </div>`;
        }
        return `
          <div class="max-w-5xl w-full mq-panel border-2 border-[#d4af37] p-5">
            <div class="text-center mb-3">
              <div class="mq-serif mq-gold-text text-xl md:text-2xl font-bold tracking-wide">🎉 正解チーム ・ +${points} 点</div>
            </div>
            <div class="flex flex-wrap justify-center gap-3">
              ${correctTeams
                .map((t) => {
                  const color = teamColor(t.origIndex);
                  return `
                  <div class="flex items-center gap-3 bg-black/40 rounded-lg px-4 py-3 border-2"
                    style="border-color:${color}">
                    <span class="w-3 h-3 rounded-full" style="background-color:${color}"></span>
                    <span class="mq-mincho text-xl md:text-2xl font-bold">${escapeHtml(
                      t.name
                    )}</span>
                    ${
                      t.representative
                        ? `<span class="text-sm text-[color:var(--mq-muted)]">${escapeHtml(
                            t.representative
                          )}</span>`
                        : ""
                    }
                  </div>`;
                })
                .join("")}
            </div>
          </div>`;
      }

      function renderScoreboard() {
        const sorted = [...teams]
          .map((t, i) => ({ ...t, origIndex: i }))
          .sort((a, b) => (b.score || 0) - (a.score || 0));
        const max = Math.max(1, ...teams.map((x) => x.score || 0));
        return `
          <section class="max-w-3xl mx-auto w-full mq-panel p-5">
            <h2 class="mq-serif mq-gold-text text-sm font-bold uppercase tracking-wide mb-3">
              現在のスコア
            </h2>
            <div class="space-y-2">
              ${sorted
                .map((t) => {
                  const color = teamColor(t.origIndex);
                  const pct = ((t.score || 0) / max) * 100;
                  return `
                  <div class="flex items-center gap-3 text-sm">
                    <div class="w-32 font-medium truncate">${escapeHtml(
                      t.name
                    )}</div>
                    <div class="flex-1 bg-black/40 border border-[rgba(212,175,55,.25)] rounded h-5 overflow-hidden">
                      <div class="h-full" style="width:${pct}%;background-color:${color}"></div>
                    </div>
                    <div class="w-16 text-right font-bold mq-serif">${t.score || 0}</div>
                  </div>`;
                })
                .join("")}
            </div>
          </section>`;
      }

      function renderVoting() {
        const quiz = quizzes.find((q) => q.id === state.currentQuizId);
        if (!quiz) {
          root.innerHTML = `<div class="flex-1 flex items-center justify-center"><p class="text-[color:var(--mq-muted)]">問題情報が見つかりません</p></div>`;
          return;
        }
        const elapsed = Date.now() - (state.votingStartedAt || Date.now());
        const duration = state.durationMs || 30000;
        const remainingMs = Math.max(0, duration - elapsed);
        const remaining = Math.ceil(remainingMs / 1000);
        const progress = Math.max(0, Math.min(1, remainingMs / duration));
        const answeredTeamIds = new Set(answers.map((a) => a.teamId));

        const circumference = 2 * Math.PI * 65;
        const dashOffset = circumference * (1 - progress);
        const timerColor =
          remaining <= 5 ? "#f87171" : remaining <= 10 ? "#fbbf24" : "#d4af37";

        root.innerHTML = `
          <header class="mb-4 flex items-center justify-between">
            <span class="mq-serif text-[color:var(--mq-muted)] text-sm tracking-widest">
              問題 ${(state.currentQuizIndex ?? 0) + 1} / ${quizzes.length}
            </span>
            <span class="mq-panel border-[#d4af37] text-[color:var(--mq-gold-hi)] rounded-full px-4 py-1 font-bold">
              ${quiz.points || 10} 点問題
            </span>
          </header>
          <section class="flex-1 flex flex-col items-center justify-center gap-6">
            <div class="mq-hex max-w-5xl w-full">
              <h1 class="mq-hex-inner mq-mincho px-10 py-6 text-3xl md:text-5xl font-bold text-center leading-snug flex items-center justify-center">
                ${escapeHtml(quiz.question)}
              </h1>
            </div>
            ${videoHtml(
              quiz.videoUrl,
              "w-full max-w-4xl aspect-video rounded-lg border border-[rgba(212,175,55,.4)] bg-black"
            )}
            ${
              quiz.imageUrl
                ? `<img src="${quiz.imageUrl}" class="max-h-80 md:max-h-96 rounded-lg border border-[rgba(212,175,55,.4)] object-contain">`
                : ""
            }
            <div class="relative">
              <svg width="160" height="160" viewBox="0 0 160 160">
                <circle cx="80" cy="80" r="65" stroke="rgba(212,175,55,0.2)" stroke-width="10" fill="none"/>
                <circle id="timer-ring-fg" cx="80" cy="80" r="65" stroke="${timerColor}" stroke-width="10" fill="none"
                  stroke-linecap="round"
                  transform="rotate(-90 80 80)"
                  stroke-dasharray="${circumference}"
                  stroke-dashoffset="${dashOffset}"
                  class="timer-ring"/>
              </svg>
              <div class="absolute inset-0 flex items-center justify-center">
                <span id="timer-num" class="mq-serif text-5xl font-bold" style="color:${timerColor}">${remaining}</span>
              </div>
            </div>
            <div class="grid grid-cols-2 gap-x-8 gap-y-4 max-w-5xl w-full">
              ${quiz.choices
                .map(
                  (c, i) => `
                <div class="mq-hexline">
                  <div class="mq-hex">
                    <div class="mq-hex-inner px-10 py-5 text-xl md:text-2xl font-medium flex items-center gap-4">
                      <span class="mq-hex-letter text-2xl md:text-3xl shrink-0">${String.fromCharCode(
                        65 + i
                      )}:</span>
                      <span>${escapeHtml(c)}</span>
                    </div>
                  </div>
                </div>`
                )
                .join("")}
            </div>
          </section>
          <section id="answered-section" class="max-w-5xl mx-auto w-full mt-6">
            ${answeredChipsHtml(answeredTeamIds)}
          </section>
        `;
      }

      function answeredChipsHtml(answeredTeamIds) {
        return `
            <div class="text-xs text-[color:var(--mq-muted)] mb-2">
              回答済み ${answeredTeamIds.size} / ${teams.length}
            </div>
            <div class="flex flex-wrap gap-2">
              ${teams
                .map((t, i) => {
                  const answered = answeredTeamIds.has(t.id);
                  const color = teamColor(i);
                  return `
                  <div class="px-3 py-1.5 rounded border bg-black/30 text-sm flex items-center gap-2 ${
                    answered ? "" : "opacity-40"
                  }"
                    style="border-color:${color}">
                    <span class="w-2 h-2 rounded-full" style="background-color:${color}"></span>
                    ${escapeHtml(t.name)} ${answered ? "✓" : ""}
                  </div>`;
                })
                .join("")}
            </div>`;
      }

      function updateVotingView() {
        const elapsed = Date.now() - (state.votingStartedAt || Date.now());
        const duration = state.durationMs || 30000;
        const remainingMs = Math.max(0, duration - elapsed);
        const remaining = Math.ceil(remainingMs / 1000);
        const progress = Math.max(0, Math.min(1, remainingMs / duration));
        const circumference = 2 * Math.PI * 65;
        const timerColor =
          remaining <= 5 ? "#f87171" : remaining <= 10 ? "#fbbf24" : "#d4af37";
        const num = document.getElementById("timer-num");
        if (num) {
          num.textContent = remaining;
          num.style.color = timerColor;
        }
        const ring = document.getElementById("timer-ring-fg");
        if (ring) {
          ring.setAttribute("stroke", timerColor);
          ring.setAttribute("stroke-dashoffset", circumference * (1 - progress));
        }
        const section = document.getElementById("answered-section");
        if (section) {
          section.innerHTML = answeredChipsHtml(
            new Set(answers.map((a) => a.teamId))
          );
        }
      }

      function renderResult() {
        const quiz = quizzes.find((q) => q.id === state.currentQuizId);
        if (!quiz) {
          root.innerHTML = `<div class="flex-1 flex items-center justify-center"><p class="text-[color:var(--mq-muted)]">問題情報が見つかりません</p></div>`;
          return;
        }
        const correct = quiz.correctIndex;
        const teamById = new Map(
          teams.map((t, i) => [t.id, { ...t, origIndex: i }])
        );
        const answerByTeam = new Map(answers.map((a) => [a.teamId, a]));

        root.innerHTML = `
          <header class="mb-4 text-center">
            <p class="mq-serif mq-gold-text text-xs tracking-widest">正解発表 ・ ${
              quiz.points || 10
            } 点</p>
            <h1 class="mq-mincho text-2xl md:text-3xl font-bold mt-1">
              ${escapeHtml(quiz.question)}
            </h1>
            ${videoHtml(
              quiz.videoUrl,
              "mt-3 w-full max-w-3xl mx-auto aspect-video rounded-lg border border-[rgba(212,175,55,.4)] bg-black"
            )}
            ${
              quiz.imageUrl
                ? `<img src="${quiz.imageUrl}" class="mt-3 max-h-56 md:max-h-64 rounded-lg border border-[rgba(212,175,55,.4)] object-contain mx-auto">`
                : ""
            }
          </header>
          <section class="flex-1 flex flex-col items-center justify-center gap-6">
            <div class="grid grid-cols-2 gap-x-8 gap-y-4 max-w-5xl w-full">
              ${quiz.choices
                .map((c, i) => {
                  const isCorrect = i === correct;
                  return `
                  <div class="mq-hexline">
                    <div class="mq-hex">
                      <div class="mq-hex-inner ${
                        isCorrect ? "mq-hex-inner--correct" : "mq-hex-inner--dim"
                      } px-10 py-5 text-xl md:text-2xl font-medium flex items-center gap-4">
                        <span class="mq-hex-letter text-2xl md:text-3xl shrink-0">${String.fromCharCode(
                          65 + i
                        )}:</span>
                        <span>${escapeHtml(c)}</span>
                        ${
                          isCorrect
                            ? '<span class="ml-auto text-sm font-bold">正解</span>'
                            : ""
                        }
                      </div>
                    </div>
                  </div>`;
                })
                .join("")}
            </div>
            ${renderCorrectTeamsBanner(correct, teamById, answerByTeam, quiz)}
            <div class="max-w-5xl w-full mq-panel p-5">
              <h2 class="mq-serif mq-gold-text text-sm font-bold uppercase tracking-wide mb-3">
                チームの回答
              </h2>
              <div class="flex flex-wrap gap-3">
                ${teams
                  .map((t, i) => {
                    const a = answerByTeam.get(t.id);
                    const color = teamColor(i);
                    const isCorrect = a?.choice === correct;
                    return `
                    <div class="px-3 py-2 rounded border bg-black/30 text-sm"
                      style="border-color:${color}">
                      <div class="flex items-center gap-2 text-[color:var(--mq-muted)] text-xs">
                        <span class="w-2 h-2 rounded-full" style="background-color:${color}"></span>
                        ${escapeHtml(t.name)}
                      </div>
                      <div class="mt-1">
                        ${
                          a
                            ? `<span class="mq-hex-letter">${String.fromCharCode(
                                65 + a.choice
                              )}:</span> ${escapeHtml(
                                quiz.choices[a.choice]
                              )} <span class="${
                                isCorrect
                                  ? "text-emerald-400"
                                  : "text-rose-400"
                              }">${isCorrect ? "✓" : "✗"}</span>`
                            : "<span class='text-[color:var(--mq-muted)]'>未回答</span>"
                        }
                      </div>
                    </div>`;
                  })
                  .join("")}
              </div>
            </div>
          </section>
          ${renderScoreboard()}
        `;
      }

      function renderFinal() {
        const sorted = [...teams]
          .map((t, i) => ({ ...t, origIndex: i }))
          .sort((a, b) => (b.score || 0) - (a.score || 0));
        const medals = ["1st", "2nd", "3rd"];
        root.innerHTML = `
          <header class="text-center mb-10">
            <p class="mq-serif mq-gold-text text-4xl md:text-6xl font-black tracking-widest">FINAL RESULT</p>
            <h1 class="mq-mincho text-3xl md:text-4xl font-bold mt-3">最終結果</h1>
          </header>
          <section class="flex-1 flex items-center justify-center">
            <div class="max-w-3xl w-full space-y-3">
              ${sorted
                .map((t, rank) => {
                  const color = teamColor(t.origIndex);
                  const label = medals[rank] || `${rank + 1}th`;
                  const emphasize = rank === 0;
                  const rowInner = `
                    <div class="text-2xl font-bold w-20 mq-serif ${
                      emphasize
                        ? "mq-gold-text"
                        : rank === 1
                        ? "text-[#c0c7d4]"
                        : rank === 2
                        ? "text-[#cd9a62]"
                        : "text-[color:var(--mq-muted)]"
                    }">${emphasize ? "👑 " : ""}${label}</div>
                    <div class="w-2 h-10 rounded" style="background-color:${color}"></div>
                    <div class="flex-1 mq-mincho text-xl md:text-2xl font-bold">${escapeHtml(
                      t.name
                    )}</div>
                    <div class="mq-serif text-3xl md:text-4xl font-bold ${
                      emphasize ? "mq-gold-text" : ""
                    }">${
                    t.score || 0
                  } <span class="text-sm text-[color:var(--mq-muted)]">点</span></div>`;
                  if (emphasize) {
                    return `
                  <div class="rounded-xl p-[3px] bg-gradient-to-b from-[#f7e39a] via-[#d4af37] to-[#8a6a1c] shadow-[0_0_30px_rgba(212,175,55,0.45)]">
                    <div class="flex items-center gap-4 rounded-[0.65rem] p-4 bg-gradient-to-b from-[#1a2b66] to-[#060d28]">${rowInner}</div>
                  </div>`;
                  }
                  return `
                  <div class="flex items-center gap-4 mq-panel p-4 ${
                    rank === 1
                      ? "border-[#c0c7d4]"
                      : rank === 2
                      ? "border-[#cd9a62]"
                      : ""
                  }">${rowInner}</div>`;
                })
                .join("")}
            </div>
          </section>
        `;
      }
    </script>
  </body>
</html>
