<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>メイン画面 - ウェディングクイズ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Shippori+Mincho+B1:wght@600;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        --mq-gold-hi: #f7e39a;
        --mq-gold: #d4af37;
        --mq-gold-lo: #8a6a1c;
        --mq-navy-hi: #1c2f6b;
        --mq-navy: #0c1740;
        --mq-navy-lo: #060d28;
        --mq-ink: #02040f;
        --mq-text: #f7f3e6;
        --mq-muted: #a7a4c7;
      }
      body {
        font-family: "Noto Sans JP", sans-serif;
        color: var(--mq-text);
        background-color: var(--mq-ink);
        background-image:
          radial-gradient(ellipse 90% 60% at 50% 0%, rgba(47, 76, 167, 0.45), transparent 65%),
          radial-gradient(ellipse 140% 110% at 50% 55%, #12225c 0%, #081233 55%, #02040f 100%);
        background-attachment: fixed;
      }
      .mq-serif { font-family: "Cinzel", "Shippori Mincho B1", serif; letter-spacing: 0.08em; }
      .mq-mincho { font-family: "Shippori Mincho B1", serif; }
      .mq-gold-text {
        background: linear-gradient(180deg, var(--mq-gold-hi) 0%, var(--mq-gold) 55%, var(--mq-gold-lo) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .mq-panel {
        background: linear-gradient(180deg, rgba(28, 47, 107, 0.5) 0%, rgba(8, 18, 51, 0.92) 100%);
        border: 1px solid rgba(212, 175, 55, 0.4);
        border-radius: 0.75rem;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(247, 227, 154, 0.15);
      }
      .mq-hex {
        position: relative;
        padding: 2px;
        clip-path: polygon(26px 0, calc(100% - 26px) 0, 100% 50%, calc(100% - 26px) 100%, 26px 100%, 0 50%);
        background: linear-gradient(180deg, var(--mq-gold-hi) 0%, var(--mq-gold) 30%, var(--mq-gold-lo) 65%, var(--mq-gold) 100%);
      }
      .mq-hex-inner {
        width: 100%;
        height: 100%;
        clip-path: polygon(25px 0, calc(100% - 25px) 0, 100% 50%, calc(100% - 25px) 100%, 25px 100%, 0 50%);
        background: linear-gradient(180deg, #1a2b66 0%, #0c1740 50%, #060d28 100%);
      }
      .mq-hex-inner--selected {
        background: linear-gradient(180deg, #ffd98a 0%, #f59e0b 45%, #a85b06 100%);
        color: #241300;
      }
      .mq-hex-inner--correct {
        background: linear-gradient(180deg, #86efac 0%, #10b981 45%, #047857 100%);
        color: #04160d;
        animation: mq-flash 0.9s ease-in-out infinite alternate;
      }
      .mq-hex-inner--dim { opacity: 0.35; }
      @keyframes mq-flash {
        from { filter: brightness(1); }
        to { filter: brightness(1.35); }
      }
      .mq-hex-letter {
        font-family: "Cinzel", serif;
        color: var(--mq-gold-hi);
        font-weight: 700;
      }
      .mq-hex-inner--selected .mq-hex-letter,
      .mq-hex-inner--correct .mq-hex-letter { color: inherit; }
      .mq-hexline { position: relative; }
      .mq-hexline::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: 2px;
        transform: translateY(-1px);
        background: linear-gradient(90deg, transparent, var(--mq-gold) 12%, var(--mq-gold) 88%, transparent);
        z-index: 0;
      }
      .mq-hexline > .mq-hex { z-index: 1; }
      .mq-btn {
        border-radius: 0.5rem;
        border: 1px solid rgba(212, 175, 55, 0.5);
        background: linear-gradient(180deg, #1a2b66, #0c1740);
        color: var(--mq-text);
        transition: filter 0.15s;
      }
      .mq-btn:hover:not(:disabled) { filter: brightness(1.3); }
      .mq-btn:disabled { opacity: 0.4; cursor: not-allowed; }
      .mq-btn--gold {
        background: linear-gradient(180deg, var(--mq-gold-hi), var(--mq-gold) 50%, var(--mq-gold-lo));
        color: #241300;
        border-color: var(--mq-gold-hi);
        font-weight: 700;
      }
      .mq-btn--danger {
        background: linear-gradient(180deg, #7f1d1d, #450a0a);
        border-color: rgba(248, 113, 113, 0.6);
      }
      .mq-input {
        background: rgba(2, 4, 15, 0.6);
        border: 1px solid rgba(212, 175, 55, 0.35);
        border-radius: 0.5rem;
        color: var(--mq-text);
      }
      .mq-input:focus {
        outline: none;
        border-color: var(--mq-gold);
        box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.25);
      }
      .mq-input::placeholder { color: #8f8cae; }

      /* main.html 固有 */
      html, body { height: 100%; }
      .timer-ring {
        transition: stroke-dashoffset 0.4s linear;
      }
      /* 1画面に収めるための自動縮小コンテナ。
         中身の実寸を測って transform: scale() で押し込む。 */
      .mq-fit {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .mq-fit-inner {
        transform-origin: center center;
        width: 100%;
      }
      .mq-typing::after {
        content: "";
        display: inline-block;
        width: 0.08em;
        height: 1em;
        margin-left: 0.08em;
        vertical-align: -0.08em;
        background: var(--mq-gold-hi);
        animation: mq-caret 0.7s steps(1) infinite;
      }
      @keyframes mq-caret {
        50% { opacity: 0; }
      }
    </style>
  </head>
  <body class="h-screen overflow-hidden">
    <main id="root" class="h-screen p-6 flex flex-col overflow-hidden">
      <p class="text-center text-[color:var(--mq-muted)]">接続中...</p>
    </main>
    <button id="sound-hint" class="hidden fixed bottom-4 right-4 z-50 bg-black/85 border-2 border-[#d4af37] rounded-full px-5 py-3 text-base font-bold text-[color:var(--mq-gold-hi)] shadow-[0_0_24px_rgba(212,175,55,0.5)] hover:brightness-125">
      🔊 クリックして音声をオンにする
    </button>

    <script src="env.js"></script>
    <script type="module">
      import {
        ensureSignedIn,
        envError,
        refs,
        TEAM_COLORS,
        escapeHtml,
        renderSetupError,
      } from "./js/firebase-init.js";
      import {
        onSnapshot,
        query,
        orderBy,
        where,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

      const root = document.getElementById("root");
      let lastVideoCmdAt = null;
      let audioUnlocked = false;

      // ブラウザは「ユーザー操作のないページ」での音声再生を拒否する。
      // 画面のどこかを一度クリック/タップすれば以降は音声を出せる。
      document.addEventListener(
        "pointerdown",
        () => {
          audioUnlocked = true;
          const v = document.getElementById("mq-video");
          if (v && state?.videoMuted === false) {
            v.muted = false;
            v.play().catch(() => {});
          }
          document.getElementById("sound-hint")?.classList.add("hidden");
        },
        true
      );

      if (envError) {
        renderSetupError(root, envError);
        throw new Error(envError);
      }

      try {
        await ensureSignedIn();
      } catch (err) {
        renderSetupError(root, err.message || String(err));
        throw err;
      }

      let state = null;
      let quizzes = [];
      let teams = [];
      let answers = [];
      let answersUnsub = null;
      let lastQuizId = null;

      onSnapshot(refs.state(), (snap) => {
        state = snap.exists() ? snap.data() : null;
        syncAnswersListener();
        render();
        // 動画の再生/停止/音声は再描画を伴わずに届くこともある
        applyVideoState(false);
      });
      onSnapshot(query(refs.quizzes(), orderBy("order")), (snap) => {
        quizzes = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        render();
      });
      onSnapshot(query(refs.teams(), orderBy("order")), (snap) => {
        teams = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        render();
      });

      setInterval(() => {
        if (state?.status === "voting") render();
      }, 250);

      function syncAnswersListener() {
        const quizId = state?.currentQuizId;
        if (quizId === lastQuizId) return;
        lastQuizId = quizId;
        if (answersUnsub) {
          answersUnsub();
          answersUnsub = null;
        }
        answers = [];
        if (quizId) {
          answersUnsub = onSnapshot(
            query(refs.answers(), where("quizId", "==", quizId)),
            (snap) => {
              answers = snap.docs.map((d) => d.data());
              render();
            }
          );
        }
      }

      function teamColor(idx) {
        return TEAM_COLORS[idx % TEAM_COLORS.length];
      }

      function parseYouTubeTime(value) {
        if (!value) return null;
        if (/^\d+$/.test(value)) return value;
        const match = String(value).match(/(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?/);
        if (!match) return null;
        const seconds =
          (parseInt(match[1] || "0", 10) * 3600) +
          (parseInt(match[2] || "0", 10) * 60) +
          parseInt(match[3] || "0", 10);
        return seconds > 0 ? String(seconds) : null;
      }

      function youtubeEmbedUrl(rawUrl) {
        try {
          const url = new URL(rawUrl);
          const host = url.hostname.replace(/^www\./, "");
          let id = null;
          if (host === "youtu.be") {
            id = url.pathname.split("/").filter(Boolean)[0];
          } else if (host.endsWith("youtube.com")) {
            if (url.pathname === "/watch") {
              id = url.searchParams.get("v");
            } else {
              const parts = url.pathname.split("/").filter(Boolean);
              if (["embed", "shorts", "live"].includes(parts[0])) id = parts[1];
            }
          }
          if (!id) return null;
          const embed = new URL(
            `https://www.youtube.com/embed/${encodeURIComponent(id)}`
          );
          embed.searchParams.set("autoplay", "1");
          // 音声付き自動再生はほとんどのブラウザで拒否される。
          // まずミュートで確実に再生し、YouTube の操作で音声を戻す。
          embed.searchParams.set("mute", "1");
          embed.searchParams.set("controls", "1");
          embed.searchParams.set("playsinline", "1");
          embed.searchParams.set("rel", "0");
          if (window.location.origin.startsWith("http")) {
            embed.searchParams.set("origin", window.location.origin);
          }
          const start = parseYouTubeTime(
            url.searchParams.get("start") || url.searchParams.get("t")
          );
          if (start) embed.searchParams.set("start", start);
          return embed.toString();
        } catch {
          return null;
        }
      }

      function googleDriveEmbedUrl(rawUrl) {
        try {
          const url = new URL(rawUrl);
          if (url.hostname !== "drive.google.com") return null;
          const match = url.pathname.match(/\/file\/d\/([^/]+)/);
          const id = match?.[1] || url.searchParams.get("id");
          return id
            ? `https://drive.google.com/file/d/${encodeURIComponent(id)}/preview`
            : null;
        } catch {
          return null;
        }
      }

      function vimeoEmbedUrl(rawUrl) {
        try {
          const url = new URL(rawUrl);
          if (!url.hostname.replace(/^www\./, "").endsWith("vimeo.com")) return null;
          const id = url.pathname
            .split("/")
            .filter(Boolean)
            .find((part) => /^\d+$/.test(part));
          return id
            ? `https://player.vimeo.com/video/${id}?autoplay=1&muted=1`
            : null;
        } catch {
          return null;
        }
      }

      function directVideoUrl(rawUrl) {
        try {
          const url = new URL(rawUrl);
          if (url.hostname.endsWith("dropbox.com")) {
            url.hostname = "dl.dropboxusercontent.com";
            url.searchParams.delete("dl");
            return url.toString();
          }
          return rawUrl;
        } catch {
          return rawUrl;
        }
      }

      function videoHtml(rawUrl, className) {
        if (!rawUrl) return "";
        const youtubeUrl = youtubeEmbedUrl(rawUrl);
        if (youtubeUrl) {
          return `<iframe src="${escapeHtml(youtubeUrl)}" class="${className}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
        }
        const embedUrl = googleDriveEmbedUrl(rawUrl) || vimeoEmbedUrl(rawUrl);
        if (embedUrl) {
          return `<iframe src="${escapeHtml(embedUrl)}" class="${className}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
        }
        // MP4 直リンクのみ admin から再生/停止/音声を制御できる
        return `<video id="mq-video" src="${escapeHtml(
          directVideoUrl(rawUrl)
        )}" class="${className}" controls autoplay muted playsinline preload="auto">
          この動画URLはブラウザで再生できません。
        </video>`;
      }

      // admin からの指示を <video> に反映する。
      // 同じ指示が繰り返し届いても副作用が出ないよう videoCmdAt で新旧を判定する。
      function applyVideoState(force) {
        const v = document.getElementById("mq-video");
        if (!v || !state) return;
        const cmdAt = state.videoCmdAt || null;
        const isNewCmd = force || cmdAt !== lastVideoCmdAt;
        if (!isNewCmd) return;
        lastVideoCmdAt = cmdAt;

        if (typeof state.videoSeekTo === "number") {
          try {
            v.currentTime = state.videoSeekTo;
          } catch {}
        }
        // 音声オンは「一度ユーザー操作があった」ページでのみ通る。
        // 通らなかった場合は画面のボタンで解除してもらう。
        const wantSound = state.videoMuted === false;
        v.muted = !wantSound;
        if (state.videoPlaying === false) {
          v.pause();
        } else {
          v.play().catch(() => {
            if (wantSound) {
              // 音声付き再生を拒否されたらミュートで再生を継続し、案内を出す
              v.muted = true;
              v.play().catch(() => {});
              showSoundHint();
            }
          });
        }
      }

      function showSoundHint() {
        if (audioUnlocked) return;
        const hint = document.getElementById("sound-hint");
        if (hint) hint.classList.remove("hidden");
      }

      // .mq-fit-inner の実寸が親を超えていたら scale で縮小して1画面に収める。
      // 画像・動画の読み込み後にも高さが変わるので ResizeObserver で追従する。
      let fitObserver = null;
      function applyFit() {
        document.querySelectorAll(".mq-fit").forEach((box) => {
          const inner = box.querySelector(".mq-fit-inner");
          if (!inner) return;
          inner.style.transform = "scale(1)";
          const availH = box.clientHeight;
          const availW = box.clientWidth;
          const needH = inner.scrollHeight;
          const needW = inner.scrollWidth;
          if (!availH || !needH) return;
          const scale = Math.min(1, availH / needH, availW / needW || 1);
          if (scale < 0.999) {
            inner.style.transform = `scale(${scale})`;
          }
        });
      }

      function scheduleFit() {
        requestAnimationFrame(() => {
          applyFit();
          // フォント・画像の反映が遅れるケースの保険
          setTimeout(applyFit, 120);
          setTimeout(applyFit, 500);
        });
        if (fitObserver) fitObserver.disconnect();
        fitObserver = new ResizeObserver(() => applyFit());
        document
          .querySelectorAll(".mq-fit-inner")
          .forEach((el) => fitObserver.observe(el));
      }

      window.addEventListener("resize", applyFit);

      let votingRenderKey = null;
      let questionTypingTimer = null;

      function stopQuestionTyping() {
        if (questionTypingTimer) clearTimeout(questionTypingTimer);
        questionTypingTimer = null;
      }

      function typeQuestion(text) {
        stopQuestionTyping();
        const el = document.getElementById("question-text");
        if (!el) return;
        const chars = Array.from(String(text || ""));
        const delay = Math.max(
          28,
          Math.min(70, Math.floor(2800 / Math.max(1, chars.length)))
        );
        let index = 0;
        el.textContent = "";
        el.classList.add("mq-typing");
        const tick = () => {
          if (!el.isConnected) return;
          el.textContent += chars[index] || "";
          index += 1;
          if (index < chars.length) {
            questionTypingTimer = setTimeout(tick, delay);
          } else {
            el.classList.remove("mq-typing");
            questionTypingTimer = null;
          }
        };
        tick();
      }

      function render() {
        if (!state) {
          votingRenderKey = null;
          root.innerHTML = `<div class="flex-1 flex items-center justify-center"><p class="text-[color:var(--mq-muted)]">待機中...</p></div>`;
          return;
        }
        if (state.status === "voting") {
          // 同じ問題の投票中は全再描画せず部分更新（動画 iframe を壊さないため）
          const key = state.currentQuizId || "";
          if (key === votingRenderKey && document.getElementById("timer-num")) {
            return updateVotingView();
          }
          votingRenderKey = key;
          return renderVoting();
        }
        votingRenderKey = null;
        stopQuestionTyping();
        if (state.status === "result") return renderResult();
        if (state.status === "final_ranking") return renderFinal();
        return renderWaiting();
      }

      function joinUrl() {
        return new URL("player.html", window.location.href).toString();
      }

      // 参加用 QR は全チーム共通の1枚だけ。チームは参加者が自分で作る。
      function renderWaiting() {
        const currentIdx = state.currentQuizIndex ?? -1;
        const isStart = currentIdx < 0;
        const quiz = quizzes.find((q) => q.id === state.currentQuizId);

        root.innerHTML = `
          <header class="text-center shrink-0">
            <p class="mq-serif mq-gold-text text-4xl md:text-5xl font-black tracking-widest">WEDDING QUIZ</p>
            <h1 class="mq-mincho text-xl md:text-2xl font-bold mt-1">
              ${isStart ? "まもなく開始" : `次の問題を準備中（${currentIdx + 1} / ${quizzes.length} 問終了）`}
            </h1>
          </header>
          <div class="mq-fit mt-3">
            <div class="mq-fit-inner flex items-start justify-center gap-8">
              <section class="shrink-0 text-center">
                <div class="bg-white rounded-xl p-4 border-2 border-[#d4af37] shadow-[0_0_28px_rgba(212,175,55,0.4)] inline-block">
                  <div id="join-qr"></div>
                </div>
                <p class="mq-mincho text-base font-bold mt-3">スマホで読み取って参加</p>
                <p class="text-xs text-[color:var(--mq-muted)] mt-1 leading-relaxed">
                  チーム名と代表者名を入力してください<br>
                  同じチーム名なら合流できます
                </p>
              </section>
              <section class="flex-1 max-w-2xl min-w-0">
                ${
                  teams.length === 0
                    ? `<div class="mq-panel p-6 text-center text-[color:var(--mq-muted)]">
                         まだ参加チームがありません
                       </div>`
                    : renderScoreboard()
                }
                ${
                  quiz && !isStart
                    ? `<div class="mq-panel p-3 mt-3">
                         <div class="text-[10px] text-[color:var(--mq-muted)] tracking-widest mb-1">前の問題</div>
                         <div class="mq-mincho text-sm truncate">${escapeHtml(quiz.question)}</div>
                         <div class="text-xs mt-1">
                           <span class="mq-hex-letter">${String.fromCharCode(65 + quiz.correctIndex)}:</span>
                           <span class="text-[#6ee7b7]">${escapeHtml(quiz.choices[quiz.correctIndex])}</span>
                         </div>
                       </div>`
                    : ""
                }
              </section>
            </div>
          </div>
          <div class="shrink-0 text-center text-xs text-[color:var(--mq-muted)] mt-2">
            参加チーム ${teams.length} / 全 ${quizzes.length} 問
          </div>
        `;

        const qrBox = document.getElementById("join-qr");
        new QRCode(qrBox, {
          text: joinUrl(),
          width: 220,
          height: 220,
          correctLevel: QRCode.CorrectLevel.M,
        });
        scheduleFit();
      }

      function renderCorrectTeamsBanner(correct, teamById, answerByTeam, quiz) {
        const correctTeams = [];
        teamById.forEach((t) => {
          const a = answerByTeam.get(t.id);
          if (a && a.choice === correct) correctTeams.push(t);
        });
        const points = quiz.points || 10;
        if (correctTeams.length === 0) {
          return `
            <div class="w-full mq-panel p-4 text-center">
              <div class="text-xs text-[color:var(--mq-muted)] tracking-wide">正解チーム</div>
              <div class="mq-mincho text-2xl font-bold text-[color:var(--mq-muted)] mt-1">正解なし…</div>
            </div>`;
        }
        return `
          <div class="w-full mq-panel border-2 border-[#d4af37] p-4">
            <div class="text-center mb-3">
              <div class="mq-serif mq-gold-text text-xl md:text-2xl font-bold tracking-wide">🎉 正解チーム ・ +${points} 点</div>
            </div>
            <div class="flex flex-wrap justify-center gap-3">
              ${correctTeams
                .map((t) => {
                  const color = teamColor(t.origIndex);
                  return `
                  <div class="flex items-center gap-3 bg-black/40 rounded-lg px-4 py-3 border-2"
                    style="border-color:${color}">
                    <span class="w-3 h-3 rounded-full" style="background-color:${color}"></span>
                    <span class="mq-mincho text-xl md:text-2xl font-bold">${escapeHtml(
                      t.name
                    )}</span>
                    ${
                      t.representative
                        ? `<span class="text-sm text-[color:var(--mq-muted)]">${escapeHtml(
                            t.representative
                          )}</span>`
                        : ""
                    }
                  </div>`;
                })
                .join("")}
            </div>
          </div>`;
      }

      function renderScoreboard() {
        const sorted = [...teams]
          .map((t, i) => ({ ...t, origIndex: i }))
          .sort((a, b) => (b.score || 0) - (a.score || 0));
        const max = Math.max(1, ...teams.map((x) => x.score || 0));
        return `
          <section class="w-full mq-panel p-4">
            <h2 class="mq-serif mq-gold-text text-xs font-bold uppercase tracking-wide mb-2">
              現在のスコア
            </h2>
            <div class="space-y-1.5">
              ${sorted
                .map((t) => {
                  const color = teamColor(t.origIndex);
                  const pct = ((t.score || 0) / max) * 100;
                  return `
                  <div class="flex items-center gap-2.5 text-xs">
                    <div class="w-24 font-medium truncate">${escapeHtml(
                      t.name
                    )}</div>
                    <div class="flex-1 bg-black/40 border border-[rgba(212,175,55,.25)] rounded h-4 overflow-hidden">
                      <div class="h-full" style="width:${pct}%;background-color:${color}"></div>
                    </div>
                    <div class="w-10 text-right font-bold mq-serif text-sm">${t.score || 0}</div>
                  </div>`;
                })
                .join("")}
            </div>
          </section>`;
      }

      function renderVoting() {
        const quiz = quizzes.find((q) => q.id === state.currentQuizId);
        if (!quiz) {
          root.innerHTML = `<div class="flex-1 flex items-center justify-center"><p class="text-[color:var(--mq-muted)]">問題情報が見つかりません</p></div>`;
          return;
        }
        // durationMs が無い問題は無制限（司会者が手動で締め切る）
        const unlimited = !state.durationMs;
        const elapsed = Date.now() - (state.votingStartedAt || Date.now());
        const duration = state.durationMs || 0;
        const remainingMs = unlimited ? 0 : Math.max(0, duration - elapsed);
        const remaining = unlimited ? 0 : Math.ceil(remainingMs / 1000);
        const progress = unlimited
          ? 1
          : Math.max(0, Math.min(1, remainingMs / duration));
        const answeredTeamIds = new Set(answers.map((a) => a.teamId));
        const hasMedia = !!(quiz.videoUrl || quiz.imageUrl);

        const circumference = 2 * Math.PI * 52;
        const dashOffset = circumference * (1 - progress);
        const timerColor = unlimited
          ? "#d4af37"
          : remaining <= 5
          ? "#f87171"
          : remaining <= 10
          ? "#fbbf24"
          : "#d4af37";

        // タイマーはヘッダー右に置き、縦積みを減らして1画面に収める
        root.innerHTML = `
          <header class="shrink-0 flex items-center gap-5">
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-3 mb-1">
                <span class="mq-serif text-[color:var(--mq-muted)] text-xs tracking-widest">
                  問題 ${(state.currentQuizIndex ?? 0) + 1} / ${quizzes.length}
                </span>
                <span class="mq-panel border-[#d4af37] text-[color:var(--mq-gold-hi)] rounded-full px-3 py-0.5 text-xs font-bold">
                  ${quiz.points || 10} 点問題
                </span>
              </div>
              <div class="mq-hex w-full">
                <h1 class="mq-hex-inner mq-mincho px-8 py-4 ${
                  hasMedia ? "text-xl md:text-3xl" : "text-2xl md:text-4xl"
                } font-bold text-center leading-snug flex items-center justify-center" aria-label="${escapeHtml(quiz.question)}">
                  <span id="question-text"></span>
                </h1>
              </div>
            </div>
            <div class="relative shrink-0">
              <svg width="128" height="128" viewBox="0 0 128 128">
                <circle cx="64" cy="64" r="52" stroke="rgba(212,175,55,0.2)" stroke-width="9" fill="none"/>
                <circle id="timer-ring-fg" cx="64" cy="64" r="52" stroke="${timerColor}" stroke-width="9" fill="none"
                  stroke-linecap="round"
                  transform="rotate(-90 64 64)"
                  stroke-dasharray="${circumference}"
                  stroke-dashoffset="${dashOffset}"
                  class="timer-ring"/>
              </svg>
              <div class="absolute inset-0 flex flex-col items-center justify-center text-center leading-tight">
                ${
                  unlimited
                    ? `<span class="mq-mincho text-sm font-bold mq-gold-text">回答<br>受付中</span>`
                    : `<span id="timer-num" class="mq-serif text-4xl font-bold" style="color:${timerColor}">${remaining}</span>`
                }
              </div>
            </div>
          </header>
          <div class="mq-fit mt-3">
            <div class="mq-fit-inner flex flex-col items-center gap-4">
              ${videoHtml(
                quiz.videoUrl,
                "w-full max-w-3xl aspect-video rounded-lg border border-[rgba(212,175,55,.4)] bg-black"
              )}
              ${
                quiz.imageUrl
                  ? `<img src="${quiz.imageUrl}" class="max-h-[38vh] rounded-lg border border-[rgba(212,175,55,.4)] object-contain">`
                  : ""
              }
              <div class="grid grid-cols-2 gap-x-6 gap-y-3 max-w-5xl w-full">
                ${quiz.choices
                  .map(
                    (c, i) => `
                  <div class="mq-hexline">
                    <div class="mq-hex">
                      <div class="mq-hex-inner px-9 py-4 ${
                        hasMedia ? "text-lg md:text-xl" : "text-xl md:text-2xl"
                      } font-medium flex items-center gap-3">
                        <span class="mq-hex-letter text-xl md:text-2xl shrink-0">${String.fromCharCode(
                          65 + i
                        )}:</span>
                        <span>${escapeHtml(c)}</span>
                      </div>
                    </div>
                  </div>`
                  )
                  .join("")}
              </div>
            </div>
          </div>
          <section id="answered-section" class="shrink-0 max-w-5xl mx-auto w-full mt-2">
            ${answeredChipsHtml(answeredTeamIds)}
          </section>
        `;
        typeQuestion(quiz.question);
        scheduleFit();
        applyVideoState(true);
      }

      function answeredChipsHtml(answeredTeamIds) {
        return `
            <div class="text-xs text-[color:var(--mq-muted)] mb-2">
              回答済み ${answeredTeamIds.size} / ${teams.length}
            </div>
            <div class="flex flex-wrap gap-2">
              ${teams
                .map((t, i) => {
                  const answered = answeredTeamIds.has(t.id);
                  const color = teamColor(i);
                  return `
                  <div class="px-3 py-1.5 rounded border bg-black/30 text-sm flex items-center gap-2 ${
                    answered ? "" : "opacity-40"
                  }"
                    style="border-color:${color}">
                    <span class="w-2 h-2 rounded-full" style="background-color:${color}"></span>
                    ${escapeHtml(t.name)} ${answered ? "✓" : ""}
                  </div>`;
                })
                .join("")}
            </div>`;
      }

      function updateVotingView() {
        const section = document.getElementById("answered-section");
        if (section) {
          section.innerHTML = answeredChipsHtml(
            new Set(answers.map((a) => a.teamId))
          );
        }
        applyVideoState(false);
        if (!state.durationMs) return; // 無制限はカウントダウンしない
        const duration = state.durationMs;
        const elapsed = Date.now() - (state.votingStartedAt || Date.now());
        const remainingMs = Math.max(0, duration - elapsed);
        const remaining = Math.ceil(remainingMs / 1000);
        const progress = Math.max(0, Math.min(1, remainingMs / duration));
        // リングの半径は renderVoting の r=52 と一致させる
        const circumference = 2 * Math.PI * 52;
        const timerColor =
          remaining <= 5 ? "#f87171" : remaining <= 10 ? "#fbbf24" : "#d4af37";
        const num = document.getElementById("timer-num");
        if (num) {
          num.textContent = remaining;
          num.style.color = timerColor;
        }
        const ring = document.getElementById("timer-ring-fg");
        if (ring) {
          ring.setAttribute("stroke", timerColor);
          ring.setAttribute("stroke-dashoffset", circumference * (1 - progress));
        }
      }

      function renderResult() {
        const quiz = quizzes.find((q) => q.id === state.currentQuizId);
        if (!quiz) {
          root.innerHTML = `<div class="flex-1 flex items-center justify-center"><p class="text-[color:var(--mq-muted)]">問題情報が見つかりません</p></div>`;
          return;
        }
        const correct = quiz.correctIndex;
        const teamById = new Map(
          teams.map((t, i) => [t.id, { ...t, origIndex: i }])
        );
        const answerByTeam = new Map(answers.map((a) => [a.teamId, a]));
        const hasMedia = !!(quiz.videoUrl || quiz.imageUrl);

        // 左: 問題と選択肢 / 右: 正解チーム・回答一覧・スコア の2カラムで1画面に収める
        root.innerHTML = `
          <header class="shrink-0 text-center">
            <p class="mq-serif mq-gold-text text-xs tracking-widest">正解発表 ・ ${
              quiz.points || 10
            } 点</p>
            <h1 class="mq-mincho text-xl md:text-2xl font-bold mt-0.5 truncate">
              ${escapeHtml(quiz.question)}
            </h1>
          </header>
          <div class="mq-fit mt-3">
            <div class="mq-fit-inner grid ${
              hasMedia ? "lg:grid-cols-2" : "lg:grid-cols-5"
            } gap-6 items-start">
              <div class="${hasMedia ? "" : "lg:col-span-3"} space-y-3">
                ${videoHtml(
                  quiz.videoUrl,
                  "w-full aspect-video rounded-lg border border-[rgba(212,175,55,.4)] bg-black"
                )}
                ${
                  quiz.imageUrl
                    ? `<img src="${quiz.imageUrl}" class="w-full max-h-[30vh] rounded-lg border border-[rgba(212,175,55,.4)] object-contain">`
                    : ""
                }
                <div class="space-y-2.5">
                  ${quiz.choices
                    .map((c, i) => {
                      const isCorrect = i === correct;
                      return `
                      <div class="mq-hexline">
                        <div class="mq-hex">
                          <div class="mq-hex-inner ${
                            isCorrect
                              ? "mq-hex-inner--correct"
                              : "mq-hex-inner--dim"
                          } px-9 py-3 text-base md:text-xl font-medium flex items-center gap-3">
                            <span class="mq-hex-letter text-xl md:text-2xl shrink-0">${String.fromCharCode(
                              65 + i
                            )}:</span>
                            <span>${escapeHtml(c)}</span>
                            ${
                              isCorrect
                                ? '<span class="ml-auto text-xs font-bold">正解</span>'
                                : ""
                            }
                          </div>
                        </div>
                      </div>`;
                    })
                    .join("")}
                </div>
              </div>
              <div class="${hasMedia ? "" : "lg:col-span-2"} space-y-3">
                ${renderCorrectTeamsBanner(correct, teamById, answerByTeam, quiz)}
                <div class="mq-panel p-4">
                  <h2 class="mq-serif mq-gold-text text-xs font-bold uppercase tracking-wide mb-2">
                    チームの回答
                  </h2>
                  <div class="flex flex-wrap gap-2">
                    ${teams
                      .map((t, i) => {
                        const a = answerByTeam.get(t.id);
                        const color = teamColor(i);
                        const isCorrect = a?.choice === correct;
                        return `
                        <div class="px-2.5 py-1.5 rounded border bg-black/30 text-xs"
                          style="border-color:${color}">
                          <div class="flex items-center gap-1.5 text-[color:var(--mq-muted)] text-[10px]">
                            <span class="w-2 h-2 rounded-full" style="background-color:${color}"></span>
                            ${escapeHtml(t.name)}
                          </div>
                          <div class="mt-0.5">
                            ${
                              a
                                ? `<span class="mq-hex-letter">${String.fromCharCode(
                                    65 + a.choice
                                  )}:</span> ${escapeHtml(
                                    quiz.choices[a.choice]
                                  )} <span class="${
                                    isCorrect
                                      ? "text-emerald-400"
                                      : "text-rose-400"
                                  }">${isCorrect ? "✓" : "✗"}</span>`
                                : "<span class='text-[color:var(--mq-muted)]'>未回答</span>"
                            }
                          </div>
                        </div>`;
                      })
                      .join("")}
                  </div>
                </div>
                ${renderScoreboard()}
              </div>
            </div>
          </div>
        `;
        scheduleFit();
        applyVideoState(true);
      }

      function renderFinal() {
        const sorted = [...teams]
          .map((t, i) => ({ ...t, origIndex: i }))
          .sort((a, b) => (b.score || 0) - (a.score || 0));
        const medals = ["1st", "2nd", "3rd"];
        root.innerHTML = `
          <header class="text-center shrink-0 mb-4">
            <p class="mq-serif mq-gold-text text-3xl md:text-5xl font-black tracking-widest">FINAL RESULT</p>
            <h1 class="mq-mincho text-xl md:text-2xl font-bold mt-1">最終結果</h1>
          </header>
          <section class="mq-fit">
            <div class="mq-fit-inner max-w-3xl mx-auto space-y-2.5">
              ${sorted
                .map((t, rank) => {
                  const color = teamColor(t.origIndex);
                  const label = medals[rank] || `${rank + 1}th`;
                  const emphasize = rank === 0;
                  const rowInner = `
                    <div class="text-xl font-bold w-20 mq-serif ${
                      emphasize
                        ? "mq-gold-text"
                        : rank === 1
                        ? "text-[#c0c7d4]"
                        : rank === 2
                        ? "text-[#cd9a62]"
                        : "text-[color:var(--mq-muted)]"
                    }">${emphasize ? "👑 " : ""}${label}</div>
                    <div class="w-2 h-9 rounded" style="background-color:${color}"></div>
                    <div class="flex-1 mq-mincho text-lg md:text-2xl font-bold">${escapeHtml(
                      t.name
                    )}</div>
                    <div class="mq-serif text-2xl md:text-4xl font-bold ${
                      emphasize ? "mq-gold-text" : ""
                    }">${
                    t.score || 0
                  } <span class="text-sm text-[color:var(--mq-muted)]">点</span></div>`;
                  if (emphasize) {
                    return `
                  <div class="rounded-xl p-[3px] bg-gradient-to-b from-[#f7e39a] via-[#d4af37] to-[#8a6a1c] shadow-[0_0_30px_rgba(212,175,55,0.45)]">
                    <div class="flex items-center gap-4 rounded-[0.65rem] p-3 bg-gradient-to-b from-[#1a2b66] to-[#060d28]">${rowInner}</div>
                  </div>`;
                  }
                  return `
                  <div class="flex items-center gap-4 mq-panel p-3 ${
                    rank === 1
                      ? "border-[#c0c7d4]"
                      : rank === 2
                      ? "border-[#cd9a62]"
                      : ""
                  }">${rowInner}</div>`;
                })
                .join("")}
            </div>
          </section>
        `;
        scheduleFit();
      }
    </script>
  </body>
</html>
