<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>解答者 - Wedding Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/theme.css" />
    <style>
      /* player.html 固有 */
      #debug {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        font-size: 10px;
        color: var(--sage);
        background: rgba(16, 53, 39, 0.92);
        border-top: 1px solid var(--forest-line);
        padding: 4px 8px;
        font-family: ui-monospace, monospace;
        pointer-events: none;
        z-index: 50;
      }
      /* スマホなので選択肢は縦積み。指で押しやすい高さを確保する。 */
      .qz-choice__body {
        min-height: 3.25rem;
        font-size: 1.0625rem;
        font-weight: 700;
      }
      .qz-choice__key {
        font-size: 1.25rem;
      }
    </style>
  </head>
  <body>
    <main id="root" class="max-w-md mx-auto px-4 py-5 pb-10 space-y-4">
      <p class="text-center qz-onDark-muted">接続中...</p>
    </main>
    <div id="debug">起動中...</div>

    <script src="env.js"></script>
    <script type="module">
      import {
        ensureSignedIn,
        envError,
        refs,
        TEAM_COLORS,
        escapeHtml,
        renderSetupError,
      } from "./js/firebase-init.js";
      import {
        onSnapshot,
        setDoc,
        updateDoc,
        addDoc,
        getDocs,
        getDoc,
        query,
        orderBy,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

      const root = document.getElementById("root");
      const debugEl = document.getElementById("debug");
      const params = new URLSearchParams(location.search);
      // チームは URL の ?team= か、localStorage に保存した参加履歴で決まる。
      // どちらも無ければチーム名入力フォームを出して自己登録させる。
      const JOIN_KEY = "enkai:joinedTeam";
      let teamId = params.get("team") || localStorage.getItem(JOIN_KEY) || null;

      const APP_VERSION = "v2";
      function debug(msg) {
        if (debugEl) debugEl.textContent = `${APP_VERSION} [${new Date().toLocaleTimeString()}] ${msg}`;
      }
      debug("スクリプト読み込み完了");

      document.addEventListener("pointerdown", (e) => {
        const btn = e.target.closest("button[data-choice]");
        if (btn) {
          debug(`ポインタDOWN: choice=${btn.dataset.choice} disabled=${btn.disabled}`);
        }
      }, true);

      if (envError) {
        renderSetupError(root, envError);
        throw new Error(envError);
      }

      try {
        const user = await ensureSignedIn();
        debug(`認証OK / UID: ${user.uid.slice(0, 6)}`);
      } catch (err) {
        debug(`認証失敗: ${err.message}`);
        renderSetupError(root, err.message || String(err));
        throw err;
      }

      let repKey = null;
      function setTeam(id) {
        teamId = id;
        repKey = `enkai:team:${id}:rep`;
        localStorage.setItem(JOIN_KEY, id);
      }

      // 保存済みチームが削除・リセット済みなら参加情報を捨ててフォームに戻す。
      if (teamId) {
        try {
          const snap = await getDoc(refs.team(teamId));
          if (!snap.exists()) {
            debug(`保存チームが存在しない: ${teamId}`);
            localStorage.removeItem(JOIN_KEY);
            teamId = null;
          }
        } catch (err) {
          debug(`チーム確認失敗: ${err.message}`);
        }
      }
      if (teamId) setTeam(teamId);

      root.addEventListener("click", (e) => {
        const choiceBtn = e.target.closest("button[data-choice]");
        if (choiceBtn) {
          if (choiceBtn.disabled) {
            debug(`タップ検知したが無効: ${choiceBtn.dataset.choice}`);
            return;
          }
          const choice = parseInt(choiceBtn.dataset.choice, 10);
          const repName = localStorage.getItem(repKey);
          debug(`タップ検知: ${String.fromCharCode(65 + choice)} (choice=${choice})`);
          if (!repName) {
            debug("代表者名が未登録");
            return;
          }
          submitAnswer(choice, repName);
          return;
        }
        if (e.target.id === "btn-change-rep") {
          if (confirm("代表者名を変更しますか？")) {
            localStorage.removeItem(repKey);
            render();
          }
          return;
        }
        if (e.target.id === "btn-leave-team") {
          if (!confirm("別のチームで参加し直しますか？")) return;
          if (repKey) localStorage.removeItem(repKey);
          localStorage.removeItem(JOIN_KEY);
          if (teamUnsub) {
            teamUnsub();
            teamUnsub = null;
          }
          store.team = null;
          teamId = null;
          repKey = null;
          syncQuizSubscriptions();
          renderJoinForm();
        }
      });

      root.addEventListener("submit", async (e) => {
        if (e.target.id === "join-form") {
          e.preventDefault();
          const btn = e.target.querySelector("button[type=submit]");
          const teamName = e.target.teamName.value.trim();
          const rep = e.target.rep.value.trim();
          if (!teamName || !rep) return;
          btn.disabled = true;
          btn.textContent = "参加中...";
          debug(`チーム自己登録: ${teamName} / ${rep}`);
          try {
            const id = await joinTeam(teamName, rep);
            setTeam(id);
            localStorage.setItem(repKey, rep);
            startTeamSubscription();
            syncQuizSubscriptions();
            debug(`参加OK: ${teamName} (${id})`);
          } catch (err) {
            debug(`参加失敗: ${err.message}`);
            alert("参加に失敗: " + err.message);
            btn.disabled = false;
            btn.textContent = "このチームで参加する";
          }
          return;
        }
        if (e.target.id === "rep-form") {
          e.preventDefault();
          const rep = e.target.rep.value.trim();
          if (!rep) return;
          debug(`代表者登録: ${rep}`);
          localStorage.setItem(repKey, rep);
          try {
            await updateDoc(refs.team(teamId), { representative: rep });
            debug(`代表者書き込みOK: ${rep}`);
            render();
          } catch (err) {
            debug(`代表者書き込み失敗: ${err.message}`);
            alert("代表者登録に失敗: " + err.message);
          }
        }
      });

      const store = {
        team: null,
        state: null,
        quiz: null,
        answer: null,
        submitting: false,
      };
      let quizUnsub = null;
      let answerUnsub = null;
      let lastSubscribedQuizId = null;
      let teamUnsub = null;

      // 同名チームがあれば再利用し、無ければ新規作成する。
      // 一度離脱した代表者が同じ名前で戻ってきてもスコアを引き継げる。
      async function joinTeam(teamName, rep) {
        const snap = await getDocs(query(refs.teams(), orderBy("order")));
        const docs = snap.docs;
        const existing = docs.find(
          (d) =>
            String(d.data().name || "").trim().toLowerCase() ===
            teamName.toLowerCase()
        );
        if (existing) {
          await updateDoc(refs.team(existing.id), { representative: rep });
          return existing.id;
        }
        const order = docs.length
          ? Math.max(...docs.map((d) => d.data().order || 0)) + 1
          : 0;
        const created = await addDoc(refs.teams(), {
          name: teamName,
          score: 0,
          representative: rep,
          order,
        });
        return created.id;
      }

      function startTeamSubscription() {
        if (teamUnsub) teamUnsub();
        teamUnsub = onSnapshot(refs.team(teamId), (snap) => {
          if (!snap.exists()) {
            // 司会者が削除／リセットした場合は参加フォームに戻す
            debug("チームが削除されました");
            localStorage.removeItem(JOIN_KEY);
            store.team = null;
            teamId = null;
            if (teamUnsub) teamUnsub();
            teamUnsub = null;
            renderJoinForm();
            return;
          }
          store.team = { id: snap.id, ...snap.data() };
          render();
        });
      }

      if (teamId) startTeamSubscription();
      else renderJoinForm();

      onSnapshot(refs.state(), (snap) => {
        store.state = snap.exists() ? snap.data() : null;
        syncQuizSubscriptions();
        render();
      });

      function syncQuizSubscriptions() {
        const quizId = store.state?.currentQuizId || null;
        // チーム確定前／チーム変更後も再購読が必要なので teamId も鍵に含める
        const subKey = `${quizId || ""}:${teamId || ""}`;
        if (subKey === lastSubscribedQuizId) return;
        lastSubscribedQuizId = subKey;
        if (quizUnsub) {
          quizUnsub();
          quizUnsub = null;
        }
        if (answerUnsub) {
          answerUnsub();
          answerUnsub = null;
        }
        store.quiz = null;
        store.answer = null;
        if (!quizId || !teamId) return;
        quizUnsub = onSnapshot(refs.quiz(quizId), (qsnap) => {
          store.quiz = qsnap.exists()
            ? { id: qsnap.id, ...qsnap.data() }
            : null;
          render();
        });
        answerUnsub = onSnapshot(
          refs.answer(`${quizId}_${teamId}`),
          (asnap) => {
            store.answer = asnap.exists() ? asnap.data() : null;
            render();
          }
        );
      }

      function teamColor() {
        const idx = store.team?.order ?? 0;
        return TEAM_COLORS[idx % TEAM_COLORS.length];
      }

      function parseYouTubeTime(value) {
        if (!value) return null;
        if (/^\d+$/.test(value)) return value;
        const match = String(value).match(/(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?/);
        if (!match) return null;
        const seconds =
          (parseInt(match[1] || "0", 10) * 3600) +
          (parseInt(match[2] || "0", 10) * 60) +
          parseInt(match[3] || "0", 10);
        return seconds > 0 ? String(seconds) : null;
      }

      function youtubeEmbedUrl(rawUrl) {
        try {
          const url = new URL(rawUrl);
          const host = url.hostname.replace(/^www\./, "");
          let id = null;
          if (host === "youtu.be") {
            id = url.pathname.split("/").filter(Boolean)[0];
          } else if (host.endsWith("youtube.com")) {
            if (url.pathname === "/watch") {
              id = url.searchParams.get("v");
            } else {
              const parts = url.pathname.split("/").filter(Boolean);
              if (["embed", "shorts", "live"].includes(parts[0])) id = parts[1];
            }
          }
          if (!id) return null;
          const embed = new URL(
            `https://www.youtube.com/embed/${encodeURIComponent(id)}`
          );
          embed.searchParams.set("autoplay", "1");
          embed.searchParams.set("mute", "1");
          embed.searchParams.set("controls", "1");
          embed.searchParams.set("playsinline", "1");
          embed.searchParams.set("rel", "0");
          if (window.location.origin.startsWith("http")) {
            embed.searchParams.set("origin", window.location.origin);
          }
          const start = parseYouTubeTime(
            url.searchParams.get("start") || url.searchParams.get("t")
          );
          if (start) embed.searchParams.set("start", start);
          return embed.toString();
        } catch {
          return null;
        }
      }

      function googleDriveEmbedUrl(rawUrl) {
        try {
          const url = new URL(rawUrl);
          if (url.hostname !== "drive.google.com") return null;
          const match = url.pathname.match(/\/file\/d\/([^/]+)/);
          const id = match?.[1] || url.searchParams.get("id");
          return id
            ? `https://drive.google.com/file/d/${encodeURIComponent(id)}/preview`
            : null;
        } catch {
          return null;
        }
      }

      function vimeoEmbedUrl(rawUrl) {
        try {
          const url = new URL(rawUrl);
          if (!url.hostname.replace(/^www\./, "").endsWith("vimeo.com")) return null;
          const id = url.pathname
            .split("/")
            .filter(Boolean)
            .find((part) => /^\d+$/.test(part));
          return id
            ? `https://player.vimeo.com/video/${id}?autoplay=1&muted=1`
            : null;
        } catch {
          return null;
        }
      }

      function directVideoUrl(rawUrl) {
        try {
          const url = new URL(rawUrl);
          if (url.hostname.endsWith("dropbox.com")) {
            url.hostname = "dl.dropboxusercontent.com";
            url.searchParams.delete("dl");
            return url.toString();
          }
          return rawUrl;
        } catch {
          return rawUrl;
        }
      }

      function videoHtml(rawUrl) {
        if (!rawUrl) return "";
        const youtubeUrl = youtubeEmbedUrl(rawUrl);
        if (youtubeUrl) {
          return `<iframe src="${escapeHtml(youtubeUrl)}" class="w-full aspect-video bg-black" style="border:2px solid var(--forest)" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
        }
        const embedUrl = googleDriveEmbedUrl(rawUrl) || vimeoEmbedUrl(rawUrl);
        if (embedUrl) {
          return `<iframe src="${escapeHtml(embedUrl)}" class="w-full aspect-video bg-black" style="border:2px solid var(--forest)" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
        }
        return `<video src="${escapeHtml(directVideoUrl(rawUrl))}" class="w-full aspect-video bg-black" style="border:2px solid var(--forest)" controls autoplay muted playsinline preload="metadata">
          この動画URLはブラウザで再生できません。
        </video>`;
      }

      function headerHtml(repName) {
        const color = teamColor();
        return `
          <header class="qz-card qz-card--tight px-4 py-3 flex items-center justify-between gap-3">
            <div class="min-w-0">
              <div class="flex items-center gap-2">
                <span class="w-3 h-3 shrink-0" style="background-color:${color}"></span>
                <span class="qz-jp-head text-base truncate">${escapeHtml(
                  store.team.name
                )}</span>
              </div>
              <div class="text-[11px] qz-muted mt-0.5">
                代表 <span style="color:var(--ink)">${escapeHtml(repName)}</span>
              </div>
            </div>
            <div class="flex flex-col gap-1 shrink-0">
              <button id="btn-change-rep" class="text-[10px] underline qz-muted">名前変更</button>
              <button id="btn-leave-team" class="text-[10px] underline qz-muted">チーム変更</button>
            </div>
          </header>`;
      }

      function renderJoinForm() {
        root.innerHTML = `
          <header class="text-center pt-4 pb-1">
            <p class="qz-display qz-display--cream" style="font-size:2.75rem">Wedding</p>
            <p class="qz-display qz-display--pink" style="font-size:2.75rem">Quiz</p>
            <p class="qz-label qz-onDark-muted mt-2">Team Registration</p>
          </header>
          <section class="qz-card p-5 space-y-4">
            <h1 class="qz-jp-head text-lg">チームを作って参加</h1>
            <p class="text-xs leading-relaxed qz-muted">
              チーム名と代表者のお名前を入力してください。<br />
              同じチーム名がすでにある場合はそのチームに合流します。
            </p>
            <form id="join-form" class="space-y-3">
              <label class="block">
                <span class="qz-label" style="color:var(--forest);font-size:10px">Team name</span>
                <input type="text" name="teamName" required minlength="1" maxlength="20"
                  placeholder="例: さくらテーブル"
                  class="qz-input mt-1" autocomplete="off" autofocus />
              </label>
              <label class="block">
                <span class="qz-label" style="color:var(--forest);font-size:10px">Your name</span>
                <input type="text" name="rep" required minlength="1" maxlength="20"
                  placeholder="例: やまだ"
                  class="qz-input mt-1" autocomplete="off" />
              </label>
              <button type="submit" class="qz-btn qz-btn--primary w-full">
                このチームで参加する
              </button>
            </form>
          </section>
          <p class="text-[11px] text-center qz-onDark-muted">
            ※ 代表者のスマホで回答します
          </p>
        `;
      }

      function renderRepForm() {
        const existing = store.team.representative;
        const color = teamColor();
        root.innerHTML = `
          <header class="text-center pt-4 pb-1">
            <p class="qz-display qz-display--cream" style="font-size:2.5rem">Wedding</p>
            <p class="qz-display qz-display--pink" style="font-size:2.5rem">Quiz</p>
            <div class="inline-flex items-center gap-2 mt-3 px-3 py-1.5 qz-panel">
              <span class="w-3 h-3" style="background-color:${color}"></span>
              <span class="text-sm font-bold">${escapeHtml(store.team.name)}</span>
            </div>
          </header>
          <section class="qz-card p-5 space-y-4">
            <h1 class="qz-jp-head text-lg">代表者の名前を入力</h1>
            ${
              existing
                ? `<p class="qz-panel--pink text-xs p-3 leading-relaxed">
                    現在の代表者: <strong>${escapeHtml(existing)}</strong><br />
                    別の端末が登録済みです。新しい名前で上書きすると代表者が交代します。
                  </p>`
                : ""
            }
            <form id="rep-form" class="space-y-3">
              <input type="text" name="rep" required minlength="1" maxlength="20"
                placeholder="お名前 (例: やまだ)" class="qz-input" autofocus />
              <button type="submit" class="qz-btn qz-btn--primary w-full">
                このチームで参加する
              </button>
            </form>
          </section>
        `;
      }

      let votingRenderKey = null;
      function render() {
        if (!teamId) {
          votingRenderKey = null;
          // 入力途中のフォームを state 更新で消さないよう、未表示のときだけ描く
          if (!document.getElementById("join-form")) renderJoinForm();
          return;
        }
        if (!store.team || !store.state) return;
        const savedRep = localStorage.getItem(repKey);
        if (!savedRep) {
          votingRenderKey = null;
          // 同じ理由で、代表者名フォームも入力中は再描画しない
          if (!document.getElementById("rep-form")) renderRepForm();
          return;
        }
        const status = store.state.status;
        if (status === "voting") {
          // 同じ問題の投票中は全再描画せず選択状態のみ更新（動画 iframe を壊さないため）
          const key = `${store.state.currentQuizId || ""}:${
            store.quiz ? "q" : "l"
          }`;
          if (key === votingRenderKey && document.getElementById("choices")) {
            updateVotingSelection();
            return;
          }
          votingRenderKey = key;
          renderVoting(savedRep);
          return;
        }
        votingRenderKey = null;
        if (status === "result") renderResult(savedRep);
        else if (status === "final_ranking") renderFinal(savedRep);
        else renderWaiting(savedRep);
      }

      function renderWaiting(repName) {
        root.innerHTML =
          headerHtml(repName) +
          `<section class="qz-card p-6 text-center space-y-4">
            <p class="qz-display" style="font-size:2.25rem">Stand by</p>
            <h1 class="qz-jp-head text-base">次の問題を待っています</h1>
            <p class="text-xs qz-muted leading-relaxed">
              メイン画面で問題が出ると<br />ここに回答ボタンが表示されます
            </p>
            <div class="qz-panel--pink p-4">
              <div class="qz-label" style="color:var(--forest);font-size:10px">Your score</div>
              <div class="mt-1">
                <span class="qz-display" style="font-size:2.5rem">${
                  store.team.score || 0
                }</span>
                <span class="text-xs qz-muted ml-1">点</span>
              </div>
            </div>
          </section>`;
      }

      // durationMs が無い問題は無制限（司会者が手動で締め切る）
      function isUnlimited() {
        return !store.state?.durationMs;
      }

      // 無制限のときは Infinity を返し、時間切れ判定に引っかからないようにする
      function remainingSec() {
        if (isUnlimited()) return Infinity;
        const elapsed =
          Date.now() - (store.state.votingStartedAt || Date.now());
        return Math.max(
          0,
          Math.ceil((store.state.durationMs - elapsed) / 1000)
        );
      }

      function timerLabel(remaining) {
        return remaining === Infinity ? "受付中" : String(remaining);
      }

      function renderVoting(repName) {
        if (!store.quiz) {
          root.innerHTML =
            headerHtml(repName) +
            `<section class="qz-card p-6 text-center qz-muted text-sm">
              問題を読み込み中...
            </section>`;
          return;
        }
        const quiz = store.quiz;
        const remaining = remainingSec();
        const answered = !!store.answer;
        const locked = remaining === 0;

        root.innerHTML =
          headerHtml(repName) +
          `
          <section class="qz-card p-4 space-y-3">
            <div class="flex items-center justify-between gap-3">
              <span class="qz-label" style="color:var(--forest);font-size:10px">
                Q${(store.state.currentQuizIndex ?? 0) + 1}
              </span>
              <div class="flex items-center gap-2">
                <span class="text-[11px] font-bold px-2 py-0.5"
                  style="background:var(--forest);color:var(--cream)">${
                    quiz.points || 10
                  } 点</span>
                <span id="timer" class="qz-display ${
                  remaining !== Infinity && remaining <= 5
                    ? "qz-display--coral"
                    : ""
                }" style="font-size:1.75rem">${timerLabel(remaining)}</span>
              </div>
            </div>
            <h1 class="qz-jp-head text-lg leading-snug">${escapeHtml(
              quiz.question
            )}</h1>
            ${videoHtml(quiz.videoUrl)}
            ${
              quiz.imageUrl
                ? `<img src="${quiz.imageUrl}" class="w-full max-h-72 object-contain" style="border:2px solid var(--forest)" />`
                : ""
            }
          </section>
          <section id="choices" class="grid grid-cols-1 gap-3">
            ${quiz.choices
              .map((c, i) => {
                const selected = answered && store.answer.choice === i;
                const dim = locked && !selected;
                return `
              <button type="button" class="qz-choice${
                selected ? " qz-choice--selected" : ""
              }${dim ? " qz-choice--dim" : ""}"
                data-choice="${i}" ${locked ? "disabled" : ""}>
                <span class="qz-choice__key">${String.fromCharCode(65 + i)}</span>
                <span class="qz-choice__body">${escapeHtml(c)}</span>
              </button>`;
              })
              .join("")}
          </section>
          <div id="vote-status">${voteStatusHtml(answered, remaining)}</div>
        `;
      }

      function voteStatusHtml(answered, remaining) {
        if (answered) {
          return `<div class="qz-panel--pink p-3 text-center text-sm">
                  現在の選択:
                  <strong>${String.fromCharCode(
                    65 + store.answer.choice
                  )}. ${escapeHtml(
            store.quiz.choices[store.answer.choice]
          )}</strong>${
            remaining > 0
              ? ' <span class="text-[11px] qz-muted">(時間内は変更OK)</span>'
              : ""
          }
                </div>`;
        }
        if (remaining === 0) {
          return `<div class="qz-panel p-3 text-center text-sm qz-onDark-muted">時間切れ</div>`;
        }
        return "";
      }

      function updateVotingSelection() {
        if (!store.quiz) return;
        const remaining = remainingSec();
        const answered = !!store.answer;
        const locked = remaining === 0;
        document
          .querySelectorAll("#choices button[data-choice]")
          .forEach((btn) => {
            const i = parseInt(btn.dataset.choice, 10);
            const selected = answered && store.answer.choice === i;
            btn.disabled = locked;
            btn.classList.toggle("qz-choice--selected", selected);
            btn.classList.toggle("qz-choice--dim", locked && !selected);
          });
        const statusEl = document.getElementById("vote-status");
        if (statusEl) statusEl.innerHTML = voteStatusHtml(answered, remaining);
      }

      function renderResult(repName) {
        const quiz = store.quiz;
        const answered = store.answer;
        const isCorrect =
          quiz && answered && answered.choice === quiz.correctIndex;
        const headline = !answered
          ? "No answer"
          : isCorrect
          ? "Correct"
          : "Wrong";
        root.innerHTML =
          headerHtml(repName) +
          `
          <section class="qz-card p-6 text-center space-y-3">
            <p class="qz-display ${
              isCorrect ? "qz-display--coral" : ""
            }" style="font-size:2.75rem">${headline}</p>
            <p class="qz-jp-head text-xl">${
              !answered ? "未回答" : isCorrect ? "正解！" : "残念…"
            }</p>
            ${
              quiz
                ? `<div class="qz-panel--pink p-3 text-sm">
                    正解:
                    <strong>${String.fromCharCode(
                      65 + quiz.correctIndex
                    )}. ${escapeHtml(quiz.choices[quiz.correctIndex])}</strong>
                  </div>`
                : ""
            }
            ${
              answered
                ? `<div class="text-xs qz-muted">
                    あなたの回答: ${String.fromCharCode(
                      65 + answered.choice
                    )}. ${escapeHtml(quiz?.choices?.[answered.choice] || "")}
                  </div>`
                : ""
            }
            <hr class="qz-rule qz-rule--pink" />
            <div>
              <div class="qz-label qz-muted" style="font-size:10px">Total</div>
              <div>
                <span class="qz-display" style="font-size:2.25rem">${
                  store.team.score || 0
                }</span>
                <span class="text-xs qz-muted ml-1">点</span>
              </div>
            </div>
          </section>`;
      }

      function renderFinal(repName) {
        const color = teamColor();
        root.innerHTML =
          headerHtml(repName) +
          `
          <section class="qz-card p-6 text-center space-y-4">
            <p class="qz-display" style="font-size:2.5rem">Thank you</p>
            <h1 class="qz-jp-head text-lg">最終結果</h1>
            <p class="text-xs qz-muted">メイン画面のランキングをご確認ください</p>
            <div class="p-5" style="border:2.4px solid ${color};background:var(--pink-soft)">
              <div class="text-[11px] qz-muted">${escapeHtml(
                store.team.name
              )} の最終スコア</div>
              <div class="mt-1">
                <span class="qz-display" style="font-size:3rem">${
                  store.team.score || 0
                }</span>
                <span class="text-xs qz-muted ml-1">点</span>
              </div>
            </div>
          </section>`;
      }

      async function submitAnswer(choice, repName) {
        if (store.submitting) {
          debug("送信中のためスキップ");
          return;
        }
        if (store.answer && store.answer.choice === choice) {
          debug("同じ選択肢のためスキップ");
          return;
        }
        if (!store.state || store.state.status !== "voting") {
          debug(`状態が voting でない: ${store.state?.status}`);
          return;
        }
        if (remainingSec() === 0) {
          debug("時間切れのためスキップ");
          return;
        }
        store.submitting = true;
        const letter = String.fromCharCode(65 + choice);
        debug(
          store.answer
            ? `変更: ${String.fromCharCode(65 + store.answer.choice)} → ${letter}`
            : `送信: ${letter}`
        );
        const quizId = store.state.currentQuizId;
        try {
          await setDoc(refs.answer(`${quizId}_${teamId}`), {
            quizId,
            teamId,
            choice,
            representative: repName,
            answeredAt: Date.now(),
          });
          debug(`送信成功: ${letter}`);
        } catch (err) {
          console.error(err);
          debug(`送信失敗: ${err.code || ""} ${err.message}`);
          alert("送信に失敗: " + err.message);
        } finally {
          store.submitting = false;
        }
      }

      setInterval(() => {
        if (store.state?.status !== "voting" || !store.quiz) return;
        const timer = document.getElementById("timer");
        if (!timer) return;
        const remaining = remainingSec();
        timer.textContent = timerLabel(remaining);
        timer.className = `qz-display ${
          remaining !== Infinity && remaining <= 5 ? "qz-display--coral" : ""
        }`;
        timer.style.fontSize = "1.75rem";
        if (!store.answer) {
          debug(`投票中 残${remaining}s answer=${!!store.answer} submitting=${store.submitting}`);
        }
        if (remaining === 0 && !store.answer) {
          document
            .querySelectorAll("#choices button")
            .forEach((btn) => (btn.disabled = true));
        }
      }, 1000);
    </script>
  </body>
</html>
