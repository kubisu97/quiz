<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>解答者 - ウェディングクイズ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Shippori+Mincho+B1:wght@600;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <style>
:root {
  --mq-gold-hi: #f7e39a;
  --mq-gold: #d4af37;
  --mq-gold-lo: #8a6a1c;
  --mq-navy-hi: #1c2f6b;
  --mq-navy: #0c1740;
  --mq-navy-lo: #060d28;
  --mq-ink: #02040f;
  --mq-text: #f7f3e6;
  --mq-muted: #a7a4c7;
}
body {
  font-family: "Noto Sans JP", sans-serif;
  color: var(--mq-text);
  background-color: var(--mq-ink);
  background-image:
    radial-gradient(ellipse 90% 60% at 50% 0%, rgba(47, 76, 167, 0.45), transparent 65%),
    radial-gradient(ellipse 140% 110% at 50% 55%, #12225c 0%, #081233 55%, #02040f 100%);
  background-attachment: fixed;
}
.mq-serif { font-family: "Cinzel", "Shippori Mincho B1", serif; letter-spacing: 0.08em; }
.mq-mincho { font-family: "Shippori Mincho B1", serif; }
.mq-gold-text {
  background: linear-gradient(180deg, var(--mq-gold-hi) 0%, var(--mq-gold) 55%, var(--mq-gold-lo) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.mq-panel {
  background: linear-gradient(180deg, rgba(28, 47, 107, 0.5) 0%, rgba(8, 18, 51, 0.92) 100%);
  border: 1px solid rgba(212, 175, 55, 0.4);
  border-radius: 0.75rem;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(247, 227, 154, 0.15);
}
.mq-hex {
  position: relative;
  padding: 2px;
  clip-path: polygon(26px 0, calc(100% - 26px) 0, 100% 50%, calc(100% - 26px) 100%, 26px 100%, 0 50%);
  background: linear-gradient(180deg, var(--mq-gold-hi) 0%, var(--mq-gold) 30%, var(--mq-gold-lo) 65%, var(--mq-gold) 100%);
}
.mq-hex-inner {
  width: 100%;
  height: 100%;
  clip-path: polygon(25px 0, calc(100% - 25px) 0, 100% 50%, calc(100% - 25px) 100%, 25px 100%, 0 50%);
  background: linear-gradient(180deg, #1a2b66 0%, #0c1740 50%, #060d28 100%);
}
.mq-hex-inner--selected {
  background: linear-gradient(180deg, #ffd98a 0%, #f59e0b 45%, #a85b06 100%);
  color: #241300;
}
.mq-hex-inner--correct {
  background: linear-gradient(180deg, #86efac 0%, #10b981 45%, #047857 100%);
  color: #04160d;
  animation: mq-flash 0.9s ease-in-out infinite alternate;
}
.mq-hex-inner--dim { opacity: 0.35; }
@keyframes mq-flash {
  from { filter: brightness(1); }
  to { filter: brightness(1.35); }
}
.mq-hex-letter {
  font-family: "Cinzel", serif;
  color: var(--mq-gold-hi);
  font-weight: 700;
}
.mq-hex-inner--selected .mq-hex-letter,
.mq-hex-inner--correct .mq-hex-letter { color: inherit; }
.mq-hexline { position: relative; }
.mq-hexline::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  height: 2px;
  transform: translateY(-1px);
  background: linear-gradient(90deg, transparent, var(--mq-gold) 12%, var(--mq-gold) 88%, transparent);
  z-index: 0;
}
.mq-hexline > .mq-hex { z-index: 1; }
.mq-btn {
  border-radius: 0.5rem;
  border: 1px solid rgba(212, 175, 55, 0.5);
  background: linear-gradient(180deg, #1a2b66, #0c1740);
  color: var(--mq-text);
  transition: filter 0.15s;
}
.mq-btn:hover:not(:disabled) { filter: brightness(1.3); }
.mq-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.mq-btn--gold {
  background: linear-gradient(180deg, var(--mq-gold-hi), var(--mq-gold) 50%, var(--mq-gold-lo));
  color: #241300;
  border-color: var(--mq-gold-hi);
  font-weight: 700;
}
.mq-btn--danger {
  background: linear-gradient(180deg, #7f1d1d, #450a0a);
  border-color: rgba(248, 113, 113, 0.6);
}
.mq-input {
  background: rgba(2, 4, 15, 0.6);
  border: 1px solid rgba(212, 175, 55, 0.35);
  border-radius: 0.5rem;
  color: var(--mq-text);
}
.mq-input:focus {
  outline: none;
  border-color: var(--mq-gold);
  box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.25);
}
.mq-input::placeholder { color: #8f8cae; }
      .btn-choice {
        transition: transform 0.08s ease, opacity 0.2s, filter 0.2s;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        color: var(--mq-text);
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
      }
      .btn-choice.mq-hex {
        display: block;
        width: 100%;
        text-align: left;
      }
      .btn-choice .mq-hex-inner {
        min-height: 4.25rem;
      }
      .btn-choice:active {
        transform: scale(0.96);
        filter: brightness(1.15);
      }
      .btn-choice:disabled {
        cursor: not-allowed;
      }
      #debug {
        position: fixed;
        bottom: 4px;
        left: 4px;
        right: 4px;
        font-size: 10px;
        color: #71717a;
        background: rgba(0, 0, 0, 0.6);
        padding: 4px 8px;
        border-radius: 4px;
        font-family: monospace;
        pointer-events: none;
        z-index: 50;
      }
    </style>
  </head>
  <body class="min-h-screen">
    <main id="root" class="max-w-md mx-auto px-4 py-6 space-y-4 min-h-screen">
      <p class="text-center text-[color:var(--mq-muted)]">接続中...</p>
    </main>
    <div id="debug">起動中...</div>

    <script src="env.js"></script>
    <script type="module">
      import {
        ensureSignedIn,
        envError,
        refs,
        TEAM_COLORS,
        escapeHtml,
        renderSetupError,
      } from "./js/firebase-init.js";
      import {
        onSnapshot,
        setDoc,
        updateDoc,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

      const root = document.getElementById("root");
      const debugEl = document.getElementById("debug");
      const params = new URLSearchParams(location.search);
      const teamId = params.get("team");

      const APP_VERSION = "v2";
      function debug(msg) {
        if (debugEl) debugEl.textContent = `${APP_VERSION} [${new Date().toLocaleTimeString()}] ${msg}`;
      }
      debug("スクリプト読み込み完了");

      document.addEventListener("pointerdown", (e) => {
        const btn = e.target.closest("button[data-choice]");
        if (btn) {
          debug(`ポインタDOWN: choice=${btn.dataset.choice} disabled=${btn.disabled}`);
        }
      }, true);

      if (envError) {
        renderSetupError(root, envError);
        throw new Error(envError);
      }

      function showInfo(msg) {
        root.innerHTML = `
          <div class="min-h-[70vh] flex items-center justify-center">
            <div class="mq-panel p-6 text-center max-w-sm">
              <p class="text-sm text-[color:var(--mq-text)]">${escapeHtml(msg)}</p>
            </div>
          </div>`;
      }

      if (!teamId) {
        showInfo(
          "QR コードからアクセスしてください (team パラメータがありません)"
        );
        throw new Error("no team param");
      }

      try {
        const user = await ensureSignedIn();
        debug(`認証OK / UID: ${user.uid.slice(0, 6)}`);
      } catch (err) {
        debug(`認証失敗: ${err.message}`);
        renderSetupError(root, err.message || String(err));
        throw err;
      }

      const repKey = `enkai:team:${teamId}:rep`;

      root.addEventListener("click", (e) => {
        const choiceBtn = e.target.closest("button[data-choice]");
        if (choiceBtn) {
          if (choiceBtn.disabled) {
            debug(`タップ検知したが無効: ${choiceBtn.dataset.choice}`);
            return;
          }
          const choice = parseInt(choiceBtn.dataset.choice, 10);
          const repName = localStorage.getItem(repKey);
          debug(`タップ検知: ${String.fromCharCode(65 + choice)} (choice=${choice})`);
          if (!repName) {
            debug("代表者名が未登録");
            return;
          }
          submitAnswer(choice, repName);
          return;
        }
        if (e.target.id === "btn-change-rep") {
          if (confirm("代表者名を変更しますか？")) {
            localStorage.removeItem(repKey);
            render();
          }
        }
      });

      root.addEventListener("submit", async (e) => {
        if (e.target.id === "rep-form") {
          e.preventDefault();
          const rep = e.target.rep.value.trim();
          if (!rep) return;
          debug(`代表者登録: ${rep}`);
          localStorage.setItem(repKey, rep);
          try {
            await updateDoc(refs.team(teamId), { representative: rep });
            debug(`代表者書き込みOK: ${rep}`);
            render();
          } catch (err) {
            debug(`代表者書き込み失敗: ${err.message}`);
            alert("代表者登録に失敗: " + err.message);
          }
        }
      });

      const store = {
        team: null,
        state: null,
        quiz: null,
        answer: null,
        submitting: false,
      };
      let quizUnsub = null;
      let answerUnsub = null;
      let lastSubscribedQuizId = null;

      onSnapshot(refs.team(teamId), (snap) => {
        if (!snap.exists()) {
          showInfo(
            "指定されたチームが見つかりません。司会者に確認してください。"
          );
          return;
        }
        store.team = { id: snap.id, ...snap.data() };
        render();
      });

      onSnapshot(refs.state(), (snap) => {
        store.state = snap.exists() ? snap.data() : null;
        syncQuizSubscriptions();
        render();
      });

      function syncQuizSubscriptions() {
        const quizId = store.state?.currentQuizId || null;
        if (quizId === lastSubscribedQuizId) return;
        lastSubscribedQuizId = quizId;
        if (quizUnsub) {
          quizUnsub();
          quizUnsub = null;
        }
        if (answerUnsub) {
          answerUnsub();
          answerUnsub = null;
        }
        store.quiz = null;
        store.answer = null;
        if (!quizId) return;
        quizUnsub = onSnapshot(refs.quiz(quizId), (qsnap) => {
          store.quiz = qsnap.exists()
            ? { id: qsnap.id, ...qsnap.data() }
            : null;
          render();
        });
        answerUnsub = onSnapshot(
          refs.answer(`${quizId}_${teamId}`),
          (asnap) => {
            store.answer = asnap.exists() ? asnap.data() : null;
            render();
          }
        );
      }

      function teamColor() {
        const idx = store.team?.order ?? 0;
        return TEAM_COLORS[idx % TEAM_COLORS.length];
      }

      function parseYouTubeTime(value) {
        if (!value) return null;
        if (/^\d+$/.test(value)) return value;
        const match = String(value).match(/(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?/);
        if (!match) return null;
        const seconds =
          (parseInt(match[1] || "0", 10) * 3600) +
          (parseInt(match[2] || "0", 10) * 60) +
          parseInt(match[3] || "0", 10);
        return seconds > 0 ? String(seconds) : null;
      }

      function youtubeEmbedUrl(rawUrl) {
        try {
          const url = new URL(rawUrl);
          const host = url.hostname.replace(/^www\./, "");
          let id = null;
          if (host === "youtu.be") {
            id = url.pathname.split("/").filter(Boolean)[0];
          } else if (host.endsWith("youtube.com")) {
            if (url.pathname === "/watch") {
              id = url.searchParams.get("v");
            } else {
              const parts = url.pathname.split("/").filter(Boolean);
              if (["embed", "shorts", "live"].includes(parts[0])) id = parts[1];
            }
          }
          if (!id) return null;
          const embed = new URL(
            `https://www.youtube.com/embed/${encodeURIComponent(id)}`
          );
          embed.searchParams.set("autoplay", "1");
          embed.searchParams.set("mute", "1");
          embed.searchParams.set("controls", "1");
          embed.searchParams.set("playsinline", "1");
          embed.searchParams.set("rel", "0");
          if (window.location.origin.startsWith("http")) {
            embed.searchParams.set("origin", window.location.origin);
          }
          const start = parseYouTubeTime(
            url.searchParams.get("start") || url.searchParams.get("t")
          );
          if (start) embed.searchParams.set("start", start);
          return embed.toString();
        } catch {
          return null;
        }
      }

      function googleDriveEmbedUrl(rawUrl) {
        try {
          const url = new URL(rawUrl);
          if (url.hostname !== "drive.google.com") return null;
          const match = url.pathname.match(/\/file\/d\/([^/]+)/);
          const id = match?.[1] || url.searchParams.get("id");
          return id
            ? `https://drive.google.com/file/d/${encodeURIComponent(id)}/preview`
            : null;
        } catch {
          return null;
        }
      }

      function vimeoEmbedUrl(rawUrl) {
        try {
          const url = new URL(rawUrl);
          if (!url.hostname.replace(/^www\./, "").endsWith("vimeo.com")) return null;
          const id = url.pathname
            .split("/")
            .filter(Boolean)
            .find((part) => /^\d+$/.test(part));
          return id
            ? `https://player.vimeo.com/video/${id}?autoplay=1&muted=1`
            : null;
        } catch {
          return null;
        }
      }

      function directVideoUrl(rawUrl) {
        try {
          const url = new URL(rawUrl);
          if (url.hostname.endsWith("dropbox.com")) {
            url.hostname = "dl.dropboxusercontent.com";
            url.searchParams.delete("dl");
            return url.toString();
          }
          return rawUrl;
        } catch {
          return rawUrl;
        }
      }

      function videoHtml(rawUrl) {
        if (!rawUrl) return "";
        const youtubeUrl = youtubeEmbedUrl(rawUrl);
        if (youtubeUrl) {
          return `<iframe src="${escapeHtml(youtubeUrl)}" class="w-full aspect-video rounded border border-[rgba(212,175,55,0.4)] bg-black" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
        }
        const embedUrl = googleDriveEmbedUrl(rawUrl) || vimeoEmbedUrl(rawUrl);
        if (embedUrl) {
          return `<iframe src="${escapeHtml(embedUrl)}" class="w-full aspect-video rounded border border-[rgba(212,175,55,0.4)] bg-black" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
        }
        return `<video src="${escapeHtml(directVideoUrl(rawUrl))}" class="w-full aspect-video rounded border border-[rgba(212,175,55,0.4)] bg-black" controls autoplay muted playsinline preload="metadata">
          この動画URLはブラウザで再生できません。
        </video>`;
      }

      function headerHtml(repName) {
        const color = teamColor();
        return `
          <header class="flex items-center justify-between pt-2 pb-2 border-b border-[rgba(212,175,55,0.35)]">
            <div class="flex items-center gap-2 text-sm">
              <span class="w-2.5 h-2.5 rounded-full" style="background-color:${color}"></span>
              <span class="font-medium mq-mincho">${escapeHtml(store.team.name)}</span>
            </div>
            <div class="text-xs text-[color:var(--mq-muted)]">
              代表: <span class="text-[color:var(--mq-text)]">${escapeHtml(repName)}</span>
              <button id="btn-change-rep" class="ml-2 text-[color:var(--mq-muted)] underline">変更</button>
            </div>
          </header>`;
      }

      let votingRenderKey = null;
      function render() {
        if (!store.team || !store.state) return;
        const savedRep = localStorage.getItem(repKey);
        if (!savedRep) {
          votingRenderKey = null;
          renderRepForm();
          return;
        }
        const status = store.state.status;
        if (status === "voting") {
          // 同じ問題の投票中は全再描画せず選択状態のみ更新（動画 iframe を壊さないため）
          const key = `${store.state.currentQuizId || ""}:${store.quiz ? "q" : "l"}`;
          if (key === votingRenderKey && document.getElementById("choices")) {
            updateVotingSelection();
            return;
          }
          votingRenderKey = key;
          renderVoting(savedRep);
          return;
        }
        votingRenderKey = null;
        if (status === "result") renderResult(savedRep);
        else if (status === "final_ranking") renderFinal(savedRep);
        else renderWaiting(savedRep);
      }

      function renderRepForm() {
        const existing = store.team.representative;
        const color = teamColor();
        root.innerHTML = `
          <header class="pt-4 text-center space-y-3">
            <div class="mq-serif mq-gold-text text-2xl font-bold">WEDDING QUIZ</div>
            <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full border border-[rgba(212,175,55,0.4)] bg-[rgba(8,18,51,0.85)]">
              <span class="w-2.5 h-2.5 rounded-full" style="background-color:${color}"></span>
              <span class="font-medium mq-mincho">${escapeHtml(store.team.name)}</span>
            </div>
          </header>
          <section class="mq-panel p-5 mt-4 space-y-4">
            <h1 class="text-lg font-bold mq-mincho">代表者の名前を入力</h1>
            ${
              existing
                ? `<p class="text-xs bg-amber-950/50 border border-amber-600/60 rounded p-3 text-amber-100">
                    現在の代表者: <strong>${escapeHtml(existing)}</strong><br>
                    別の端末が登録済みです。新しい名前で上書きすると代表者が交代します。
                  </p>`
                : ""
            }
            <form id="rep-form" class="space-y-3">
              <input type="text" name="rep" required minlength="1" maxlength="20"
                placeholder="お名前 (例: やまだ)"
                class="mq-input w-full px-3 py-3 text-base"
                autofocus>
              <button type="submit"
                class="mq-btn mq-btn--gold w-full px-4 py-3">
                このチームで参加する
              </button>
            </form>
          </section>
          <p class="text-xs text-[color:var(--mq-muted)] text-center">
            ※ 代表者のスマホで回答します。変更は司会者に依頼してください。
          </p>
        `;
      }

      function renderWaiting(repName) {
        root.innerHTML =
          headerHtml(repName) +
          `<section class="mq-panel p-6 mt-4 text-center space-y-3">
            <h1 class="text-lg font-bold mq-mincho">次の問題を待っています</h1>
            <p class="text-[color:var(--mq-muted)] text-sm">
              メイン画面で問題が出るとここに回答ボタンが表示されます。
            </p>
            <div class="bg-black/30 border border-[rgba(212,175,55,0.25)] rounded p-3 text-sm">
              現在のスコア: <span class="mq-serif mq-gold-text text-xl font-bold">${
                store.team.score || 0
              }</span> 点
            </div>
          </section>`;
      }

      function remainingSec() {
        const elapsed =
          Date.now() - (store.state.votingStartedAt || Date.now());
        return Math.max(
          0,
          Math.ceil(((store.state.durationMs || 30000) - elapsed) / 1000)
        );
      }

      function renderVoting(repName) {
        if (!store.quiz) {
          root.innerHTML =
            headerHtml(repName) +
            `<section class="mq-panel p-6 mt-4 text-center text-[color:var(--mq-muted)]">
              問題を読み込み中...
            </section>`;
          return;
        }
        const quiz = store.quiz;
        const remaining = remainingSec();
        const answered = !!store.answer;
        const locked = remaining === 0;

        root.innerHTML =
          headerHtml(repName) +
          `
          <section class="mq-panel p-4 mt-3 space-y-3">
            <div class="flex items-center justify-between">
              <span class="text-xs text-[color:var(--mq-muted)]">
                問題 ${(store.state.currentQuizIndex ?? 0) + 1}
              </span>
              <div class="flex items-center gap-2">
                <span class="bg-black/30 border border-[rgba(212,175,55,0.5)] rounded-full px-2.5 py-0.5 text-xs font-bold"><span class="mq-gold-text">${quiz.points || 10} 点</span></span>
                <span id="timer" class="mq-serif text-2xl font-bold ${
                  remaining <= 5 ? "text-rose-400" : "mq-gold-text"
                }">${remaining}s</span>
              </div>
            </div>
            <h1 class="text-lg font-bold leading-snug mq-mincho">${escapeHtml(
              quiz.question
            )}</h1>
            ${videoHtml(quiz.videoUrl)}
            ${
              quiz.imageUrl
                ? `<img src="${quiz.imageUrl}" class="w-full max-h-64 object-contain rounded border border-[rgba(212,175,55,0.4)]">`
                : ""
            }
          </section>
          <section id="choices" class="grid grid-cols-1 gap-3 mt-3">
            ${quiz.choices
              .map(
                (c, i) => {
                  const selected = answered && store.answer.choice === i;
                  const dim = locked && !selected;
                  return `
              <button type="button"
                class="btn-choice mq-hex"
                data-choice="${i}"
                ${locked ? "disabled" : ""}>
                <div class="mq-hex-inner ${
                  selected ? "mq-hex-inner--selected" : ""
                }${dim ? " mq-hex-inner--dim" : ""} flex items-center gap-3 px-9 py-4 font-bold text-lg">
                  <span class="mq-hex-letter text-xl shrink-0">${
                    String.fromCharCode(65 + i)
                  }:</span>
                  <span class="flex-1">${escapeHtml(c)}</span>
                </div>
              </button>`;
                }
              )
              .join("")}
          </section>
          <div id="vote-status">${voteStatusHtml(answered, remaining)}</div>
        `;
      }

      function voteStatusHtml(answered, remaining) {
        if (answered) {
          return `<div class="bg-amber-950/50 border border-amber-500/60 rounded p-3 text-center text-sm text-amber-100">
                  現在の選択: <strong>${String.fromCharCode(
                    65 + store.answer.choice
                  )}. ${escapeHtml(
            store.quiz.choices[store.answer.choice]
          )}</strong>${remaining > 0 ? ' <span class="text-xs text-amber-200/80">(時間内は変更OK)</span>' : ""}
                </div>`;
        }
        if (remaining === 0) {
          return `<div class="bg-black/30 border border-[rgba(212,175,55,0.25)] rounded p-3 text-center text-sm text-[color:var(--mq-muted)]">時間切れ</div>`;
        }
        return "";
      }

      function updateVotingSelection() {
        if (!store.quiz) return;
        const remaining = remainingSec();
        const answered = !!store.answer;
        const locked = remaining === 0;
        document
          .querySelectorAll("#choices button[data-choice]")
          .forEach((btn) => {
            const i = parseInt(btn.dataset.choice, 10);
            const selected = answered && store.answer.choice === i;
            btn.disabled = locked;
            const inner = btn.querySelector(".mq-hex-inner");
            if (inner) {
              inner.classList.toggle("mq-hex-inner--selected", selected);
              inner.classList.toggle("mq-hex-inner--dim", locked && !selected);
            }
          });
        const statusEl = document.getElementById("vote-status");
        if (statusEl) statusEl.innerHTML = voteStatusHtml(answered, remaining);
      }

      function renderResult(repName) {
        const quiz = store.quiz;
        const answered = store.answer;
        const isCorrect =
          quiz && answered && answered.choice === quiz.correctIndex;
        root.innerHTML =
          headerHtml(repName) +
          `
          <section class="mq-panel p-6 mt-3 text-center space-y-3">
            <h1 class="mq-mincho text-4xl font-bold ${
              isCorrect ? "text-[#6ee7b7]" : !answered ? "text-[color:var(--mq-muted)]" : "text-rose-400"
            }">
              ${
                !answered
                  ? "未回答"
                  : isCorrect
                  ? "正解"
                  : "不正解"
              }
            </h1>
            ${
              quiz
                ? `<div class="text-sm text-[color:var(--mq-text)]">
                    正解: <strong><span class="mq-hex-letter">${String.fromCharCode(
                      65 + quiz.correctIndex
                    )}</span>. ${escapeHtml(
                    quiz.choices[quiz.correctIndex]
                  )}</strong>
                  </div>`
                : ""
            }
            ${
              answered
                ? `<div class="text-xs text-[color:var(--mq-muted)]">
                    あなたの回答: ${String.fromCharCode(
                      65 + answered.choice
                    )}. ${escapeHtml(
                    quiz?.choices?.[answered.choice] || ""
                  )}
                  </div>`
                : ""
            }
            <div class="bg-black/30 border border-[rgba(212,175,55,0.25)] rounded p-3 text-sm">
              現在のスコア: <span class="mq-serif mq-gold-text text-xl font-bold">${
                store.team.score || 0
              }</span> 点
            </div>
          </section>`;
      }

      function renderFinal(repName) {
        const color = teamColor();
        root.innerHTML =
          headerHtml(repName) +
          `
          <section class="mq-panel p-6 mt-3 text-center space-y-4">
            <h1 class="text-xl font-bold mq-mincho">最終結果</h1>
            <p class="text-[color:var(--mq-muted)] text-sm">メイン画面のランキングをご確認ください</p>
            <div class="rounded border bg-black/30 p-5" style="border-color:${color}">
              <div class="text-xs text-[color:var(--mq-muted)]">${escapeHtml(
                store.team.name
              )} の最終スコア</div>
              <div class="mt-2"><span class="mq-serif mq-gold-text text-4xl font-bold">${store.team.score || 0}</span> <span class="text-sm">点</span></div>
            </div>
          </section>`;
      }

      async function submitAnswer(choice, repName) {
        if (store.submitting) {
          debug("送信中のためスキップ");
          return;
        }
        if (store.answer && store.answer.choice === choice) {
          debug("同じ選択肢のためスキップ");
          return;
        }
        if (!store.state || store.state.status !== "voting") {
          debug(`状態が voting でない: ${store.state?.status}`);
          return;
        }
        if (remainingSec() === 0) {
          debug("時間切れのためスキップ");
          return;
        }
        store.submitting = true;
        const letter = String.fromCharCode(65 + choice);
        debug(
          store.answer
            ? `変更: ${String.fromCharCode(65 + store.answer.choice)} → ${letter}`
            : `送信: ${letter}`
        );
        const quizId = store.state.currentQuizId;
        try {
          await setDoc(refs.answer(`${quizId}_${teamId}`), {
            quizId,
            teamId,
            choice,
            representative: repName,
            answeredAt: Date.now(),
          });
          debug(`送信成功: ${letter}`);
        } catch (err) {
          console.error(err);
          debug(`送信失敗: ${err.code || ""} ${err.message}`);
          alert("送信に失敗: " + err.message);
        } finally {
          store.submitting = false;
        }
      }

      setInterval(() => {
        if (store.state?.status !== "voting" || !store.quiz) return;
        const timer = document.getElementById("timer");
        if (!timer) return;
        const remaining = remainingSec();
        timer.textContent = `${remaining}s`;
        timer.className = `mq-serif text-2xl font-bold ${
          remaining <= 5 ? "text-rose-400" : "mq-gold-text"
        }`;
        if (!store.answer) {
          debug(`投票中 残${remaining}s answer=${!!store.answer} submitting=${store.submitting}`);
        }
        if (remaining === 0 && !store.answer) {
          document
            .querySelectorAll("#choices button")
            .forEach((btn) => (btn.disabled = true));
        }
      }, 1000);
    </script>
  </body>
</html>
