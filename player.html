<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>解答者 - Wedding Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- フォントは読み込めなくても表示を止めない（media=print → onload で適用） -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'"
    />
    <link rel="stylesheet" href="css/theme.css?v=20261027b" />
    <style>
      /* player.html 固有 */
      #debug {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        font-size: 10px;
        color: var(--sage);
        background: rgba(16, 53, 39, 0.92);
        border-top: 1px solid var(--forest-line);
        padding: 4px 8px;
        font-family: ui-monospace, monospace;
        pointer-events: none;
        z-index: 50;
      }
      /* スマホなので選択肢は縦積み。指で押しやすい高さを確保する。 */
      .qz-choice__body {
        min-height: 3.25rem;
        font-size: 1.0625rem;
        font-weight: 700;
      }
      .qz-choice__key {
        font-size: 1.25rem;
      }
    </style>
    <!-- Tailwind はビルド済み CSS を同梱（cdn.tailwindcss.com は本番利用非推奨のため） -->
    <link rel="stylesheet" href="css/tailwind.css?v=20261027b" />
  </head>
  <body>
    <main id="root" class="max-w-md mx-auto px-4 py-5 pb-10 space-y-4">
      <p class="text-center qz-onDark-muted">接続中...</p>
    </main>
    <div id="debug">起動中...</div>

    <script src="env.js?v=20261027b"></script>
    <script type="module">
      import {
        ensureSignedIn,
        envError,
        refs,
        APP_ID,
        APP_VERSION,
        TEAM_COLORS,
        escapeHtml,
        renderSetupError,
        describeError,
        mountConnectionBanner,
        mountRehearsalBadge,
        safeStorage,
        teamMembers,
        isLiveQuiz,
        correctIndexOf,
        choiceLetter,
        onSnapshot,
        setDoc,
        updateDoc,
        getDoc,
        query,
        orderBy,
      } from "./js/firebase-init.js?v=20261027b";

      const root = document.getElementById("root");
      const debugEl = document.getElementById("debug");
      const params = new URLSearchParams(location.search);
      // チームはメイン画面のチーム別 QR（?team=）か、localStorage に保存した参加履歴で決まる。
      // どちらも無ければ登録済みチームの一覧から選ばせる（QR を読み取れなかった人向け）。
      // キーは APP_ID ごとに分ける（リハーサルの参加情報が本番に残らないように）。
      const JOIN_KEY = `enkai:${APP_ID}:joinedTeam`;
      const qrTeamId = params.get("team");
      let teamId = qrTeamId || safeStorage.get(JOIN_KEY) || null;
      // ?team= は最初の 1 回だけ使う。URL に残すと「チーム変更」しても再読み込みで戻ってしまう。
      if (qrTeamId) {
        try {
          const url = new URL(location.href);
          url.searchParams.delete("team");
          history.replaceState(null, "", url);
        } catch {}
      }
      let qrTeamMissing = false;

      function debug(msg) {
        if (debugEl) debugEl.textContent = `v${APP_VERSION} [${new Date().toLocaleTimeString()}] ${msg}`;
      }
      debug("スクリプト読み込み完了");

      document.addEventListener("pointerdown", (e) => {
        const btn = e.target.closest("button[data-choice]");
        if (btn) {
          debug(`ポインタDOWN: choice=${btn.dataset.choice} disabled=${btn.disabled}`);
        }
      }, true);

      if (envError) {
        renderSetupError(root, envError);
        throw new Error(envError);
      }

      const conn = mountConnectionBanner({ compact: true });
      mountRehearsalBadge();

      try {
        const user = await ensureSignedIn();
        debug(`認証OK / UID: ${user.uid.slice(0, 6)}`);
      } catch (err) {
        debug(`認証失敗: ${err.message}`);
        renderSetupError(root, describeError(err));
        throw err;
      }

      function setTeam(id) {
        teamId = id;
        safeStorage.set(JOIN_KEY, id);
      }

      // 保存済みチームが削除済みなら参加情報を捨ててチーム選択に戻す。
      if (teamId) {
        try {
          const snap = await getDoc(refs.team(teamId));
          if (!snap.exists()) {
            debug(`チームが存在しない: ${teamId}`);
            if (teamId === qrTeamId) qrTeamMissing = true;
            safeStorage.remove(JOIN_KEY);
            teamId = null;
          }
        } catch (err) {
          debug(`チーム確認失敗: ${err.message}`);
        }
      }
      if (teamId) setTeam(teamId);

      // 受付済みでもメンバーを直せるようにする（OK を押し直すまで入力フォームを出す）
      let editingMembers = false;
      const MAX_MEMBERS = 20;

      root.addEventListener("click", (e) => {
        const choiceBtn = e.target.closest("button[data-choice]");
        if (choiceBtn) {
          if (choiceBtn.disabled) {
            debug(`タップ検知したが無効: ${choiceBtn.dataset.choice}`);
            return;
          }
          const choice = parseInt(choiceBtn.dataset.choice, 10);
          debug(`タップ検知: ${choiceLetter(choice)} (choice=${choice})`);
          submitAnswer(choice);
          return;
        }
        const pickBtn = e.target.closest("button[data-pick-team]");
        if (pickBtn) {
          const id = pickBtn.dataset.pickTeam;
          const name = pickerTeams?.find((t) => t.id === id)?.name || "";
          if (!confirm(`代表「${name}」のチームで参加しますか？`)) return;
          stopTeamPicker();
          qrTeamMissing = false;
          setTeam(id);
          startTeamSubscription();
          syncQuizSubscriptions();
          debug(`チーム選択: ${name} (${id})`);
          root.innerHTML = `<p class="text-center qz-onDark-muted">読み込み中...</p>`;
          return;
        }
        if (e.target.id === "btn-add-member") {
          const box = document.getElementById("member-inputs");
          const count = box.querySelectorAll("input[name=member]").length;
          if (count >= MAX_MEMBERS) return;
          box.insertAdjacentHTML("beforeend", memberInputHtml("", count));
          box.lastElementChild.focus();
          return;
        }
        if (e.target.id === "btn-edit-members") {
          editingMembers = true;
          render();
          return;
        }
        if (e.target.id === "btn-cancel-members") {
          editingMembers = false;
          root.innerHTML = "";
          render();
          return;
        }
        if (e.target.id === "btn-leave-team") {
          if (!confirm("別のチームで参加し直しますか？")) return;
          safeStorage.remove(JOIN_KEY);
          if (teamUnsub) {
            teamUnsub();
            teamUnsub = null;
          }
          store.team = null;
          teamId = null;
          editingMembers = false;
          syncQuizSubscriptions();
          renderTeamPicker();
        }
      });

      root.addEventListener("submit", async (e) => {
        if (e.target.id !== "members-form") return;
        e.preventDefault();
        const btn = e.target.querySelector("button[type=submit]");
        const members = [...e.target.querySelectorAll("input[name=member]")]
          .map((el) => el.value.trim())
          .filter(Boolean)
          .slice(0, MAX_MEMBERS);
        if (members.length === 0) {
          alert("1 人以上の名前を入力してください");
          return;
        }
        btn.disabled = true;
        btn.textContent = "送信中...";
        debug(`メンバー送信: ${members.length} 人`);
        try {
          await updateDoc(refs.team(teamId), {
            members,
            readyAt: store.team?.readyAt || Date.now(),
          });
          editingMembers = false;
          debug(`受付OK: ${members.join("・")}`);
          render();
        } catch (err) {
          debug(`受付失敗: ${err.message}`);
          alert("送信に失敗しました: " + describeError(err));
          btn.disabled = false;
          btn.textContent = "OK";
        }
      });

      const store = {
        team: null,
        state: null,
        quiz: null,
        answer: null,
        submitting: false,
      };
      let quizUnsub = null;
      let answerUnsub = null;
      let lastSubscribedQuizId = null;
      let teamUnsub = null;

      // QR を読み取れなかった人向けのチーム一覧。チーム選択中だけ購読する。
      let pickerTeams = null;
      let pickerUnsub = null;

      function stopTeamPicker() {
        if (pickerUnsub) pickerUnsub();
        pickerUnsub = null;
        pickerTeams = null;
      }

      function startTeamSubscription() {
        if (teamUnsub) teamUnsub();
        teamUnsub = onSnapshot(
          refs.team(teamId),
          (snap) => {
            if (!snap.exists()) {
              // 司会者が削除した場合はチーム選択に戻す
              debug("チームが削除されました");
              safeStorage.remove(JOIN_KEY);
              store.team = null;
              teamId = null;
              editingMembers = false;
              if (teamUnsub) teamUnsub();
              teamUnsub = null;
              renderTeamPicker();
              return;
            }
            store.team = { id: snap.id, ...snap.data() };
            render();
          },
          (err) => conn.error(err)
        );
      }

      if (teamId) startTeamSubscription();
      else renderTeamPicker();

      onSnapshot(
        refs.state(),
        { includeMetadataChanges: true },
        (snap) => {
          conn.report(snap);
          store.state = snap.exists() ? snap.data() : null;
          syncQuizSubscriptions();
          render();
        },
        (err) => conn.error(err)
      );

      function syncQuizSubscriptions() {
        const quizId = store.state?.currentQuizId || null;
        // チーム確定前／チーム変更後も再購読が必要なので teamId も鍵に含める
        const subKey = `${quizId || ""}:${teamId || ""}`;
        if (subKey === lastSubscribedQuizId) return;
        lastSubscribedQuizId = subKey;
        if (quizUnsub) {
          quizUnsub();
          quizUnsub = null;
        }
        if (answerUnsub) {
          answerUnsub();
          answerUnsub = null;
        }
        store.quiz = null;
        store.answer = null;
        if (!quizId || !teamId) return;
        quizUnsub = onSnapshot(
          refs.quiz(quizId),
          (qsnap) => {
            store.quiz = qsnap.exists()
              ? { id: qsnap.id, ...qsnap.data() }
              : null;
            render();
          },
          (err) => conn.error(err)
        );
        answerUnsub = onSnapshot(
          refs.answer(`${quizId}_${teamId}`),
          (asnap) => {
            store.answer = asnap.exists() ? asnap.data() : null;
            render();
          },
          (err) => conn.error(err)
        );
      }

      function teamColor() {
        const idx = store.team?.order ?? 0;
        return TEAM_COLORS[idx % TEAM_COLORS.length];
      }

      function headerHtml() {
        const color = teamColor();
        const members = teamMembers(store.team);
        return `
          <header class="qz-card qz-card--tight px-4 py-3 flex items-center justify-between gap-3">
            <div class="min-w-0">
              <div class="flex items-center gap-2">
                <span class="w-3 h-3 shrink-0" style="background-color:${color}"></span>
                <span class="text-[10px] qz-muted shrink-0">代表</span>
                <span class="qz-jp-head text-base truncate">${escapeHtml(
                  store.team.name
                )}</span>
              </div>
              <div class="text-[11px] qz-muted mt-0.5 truncate">
                ${
                  members.length
                    ? `<span style="color:var(--ink)">${escapeHtml(members.join("・"))}</span>`
                    : "メンバー未入力"
                }
              </div>
            </div>
            <div class="flex flex-col gap-1 shrink-0">
              <button id="btn-edit-members" class="text-[10px] underline qz-muted">メンバー変更</button>
              <button id="btn-leave-team" class="text-[10px] underline qz-muted">チーム変更</button>
            </div>
          </header>`;
      }

      function brandHeaderHtml(sub) {
        return `
          <header class="text-center pt-4 pb-1">
            <p class="qz-display qz-display--cream" style="font-size:2.5rem">Wedding</p>
            <p class="qz-display qz-display--pink" style="font-size:2.5rem">Quiz</p>
            ${sub}
          </header>`;
      }

      // QR を読み取れなかった人向け: 登録済みチームを代表者名で選ぶ
      // 起動直後（下の let 宣言より前）にも呼ばれるので、ここでは votingRenderKey 等に触らない
      function renderTeamPicker() {
        if (!pickerUnsub) {
          pickerUnsub = onSnapshot(
            query(refs.teams(), orderBy("order")),
            (snap) => {
              pickerTeams = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
              if (!teamId) renderTeamPicker();
            },
            (err) => conn.error(err)
          );
        }
        const list =
          pickerTeams === null
            ? `<p class="text-xs qz-muted">読み込み中...</p>`
            : pickerTeams.length === 0
            ? `<p class="qz-panel--pink text-xs p-3 leading-relaxed">まだチームが登録されていません。司会者の案内をお待ちください。</p>`
            : pickerTeams
                .map(
                  (t) => `
              <button type="button" class="qz-btn w-full" data-pick-team="${t.id}"
                style="display:flex;align-items:center;gap:10px;padding:14px">
                <span class="w-3 h-3 shrink-0" style="background-color:${
                  TEAM_COLORS[(t.order ?? 0) % TEAM_COLORS.length]
                }"></span>
                <span class="text-[11px] qz-muted">代表</span>
                <span class="truncate">${escapeHtml(t.name)}</span>
              </button>`
                )
                .join("");
        root.innerHTML = `
          ${brandHeaderHtml('<p class="qz-label qz-onDark-muted mt-2">Entry</p>')}
          <section id="team-picker" class="qz-card p-5 space-y-4">
            <h1 class="qz-jp-head text-lg">チームを選んで参加</h1>
            <p class="text-xs leading-relaxed qz-muted">
              メイン画面に出ている、自分のチームの代表者さんの QR コードを読み込んでください。<br />
              読み込めないときは、下から代表者さんの名前を選んでください。
            </p>
            ${
              qrTeamMissing
                ? `<p class="qz-panel--pink text-xs p-3 leading-relaxed font-bold" style="color:#c0392b">
                    読み込んだ QR コードのチームが見つかりませんでした。もう一度読み込むか、下から選んでください。
                  </p>`
                : ""
            }
            <div class="space-y-2">${list}</div>
          </section>
        `;
      }

      function memberInputHtml(value, i) {
        return `<input type="text" name="member" maxlength="20" autocomplete="off"
          value="${escapeHtml(value)}" placeholder="${i + 1} 人目のお名前" class="qz-input" />`;
      }

      // 受付: チーム全員の名前を入れて OK。最初の欄には代表者名を入れておく。
      function renderMembersForm() {
        const t = store.team;
        const existing = teamMembers(t);
        const values = existing.length ? [...existing, ""] : [t.name || "", "", "", ""];
        const color = teamColor();
        root.innerHTML = `
          ${brandHeaderHtml(`
            <div class="inline-flex items-center gap-2 mt-3 px-3 py-1.5 qz-panel">
              <span class="w-3 h-3" style="background-color:${color}"></span>
              <span class="text-[11px]">代表</span>
              <span class="text-sm font-bold">${escapeHtml(t.name)}</span>
            </div>`)}
          <section class="qz-card p-5 space-y-4">
            <h1 class="qz-jp-head text-lg">チーム全員の名前を入力</h1>
            <p class="text-xs leading-relaxed qz-muted">
              一緒に回答するメンバー全員の名前を入れて、OK を押してください。<br />
              名前はメイン画面に表示されます。
            </p>
            <form id="members-form" class="space-y-3">
              <div id="member-inputs" class="space-y-2">
                ${values.map((v, i) => memberInputHtml(v, i)).join("")}
              </div>
              <button type="button" id="btn-add-member" class="qz-btn w-full" style="font-size:13px">
                ＋ 入力欄を追加
              </button>
              <button type="submit" class="qz-btn qz-btn--primary w-full" style="font-size:1.25rem;padding:14px">
                OK
              </button>
              ${
                editingMembers
                  ? `<button type="button" id="btn-cancel-members" class="qz-btn qz-btn--ghost w-full" style="font-size:12px">キャンセル</button>`
                  : ""
              }
            </form>
          </section>
          <p class="text-[11px] text-center qz-onDark-muted">
            ※ 回答はこのスマホで行います
          </p>
        `;
      }

      let votingRenderKey = null;
      function render() {
        if (!teamId) {
          votingRenderKey = null;
          if (!document.getElementById("team-picker")) renderTeamPicker();
          return;
        }
        if (!store.team || !store.state) return;
        const status = store.state.status;
        const inQuestion = status === "voting" || status === "closed";
        if (inQuestion) editingMembers = false;
        // 開始前（説明・受付中）でまだ OK を押していなければ受付フォーム。
        // 出題中は回答を優先し、フォームは出さない。
        const lobby = !inQuestion && status !== "result" && status !== "final_ranking";
        if (editingMembers || (lobby && !store.team.readyAt)) {
          votingRenderKey = null;
          // 入力途中のフォームを state 更新で消さないよう、未表示のときだけ描く
          if (!document.getElementById("members-form")) renderMembersForm();
          return;
        }
        if (inQuestion) {
          // 同じ問題・同じステータスの間は全再描画せず選択状態のみ更新
          const key = `${store.state.currentQuizId || ""}:${status}:${
            store.quiz ? "q" : "l"
          }`;
          if (key === votingRenderKey && document.getElementById("choices")) {
            updateVotingSelection();
            return;
          }
          votingRenderKey = key;
          renderVoting();
          return;
        }
        votingRenderKey = null;
        if (status === "result" && store.state.answerVideoPending) renderAnswerVideoWait();
        else if (status === "result") renderResult();
        else if (status === "final_ranking") renderFinal();
        else renderWaiting();
      }

      // 正解発表の動画をメイン画面で流している間は、正解も点数も出さない（動画のネタバレを防ぐ）
      function renderAnswerVideoWait() {
        const answered = store.answer;
        const quiz = store.quiz;
        root.innerHTML =
          headerHtml() +
          `<section class="qz-card p-6 text-center space-y-4">
            <p class="qz-display" style="font-size:2.25rem">Answer</p>
            <h1 class="qz-jp-head text-base">まもなく正解発表</h1>
            <p class="qz-panel--pink p-3 text-xs font-bold">▶ メイン画面（スクリーン）の動画をご覧ください</p>
            ${
              answered
                ? `<div class="text-xs qz-muted">
                    あなたの回答: ${choiceLetter(answered.choice)}. ${escapeHtml(
                      quiz?.choices?.[answered.choice] || ""
                    )}
                  </div>`
                : `<div class="text-xs qz-muted">未回答</div>`
            }
          </section>`;
      }

      function renderWaiting() {
        const notStarted = (store.state.currentQuizIndex ?? -1) < 0;
        if (notStarted) {
          const members = teamMembers(store.team);
          root.innerHTML =
            headerHtml() +
            `<section class="qz-card p-6 text-center space-y-4">
              <p class="qz-display qz-display--coral" style="font-size:2.75rem">OK!</p>
              <h1 class="qz-jp-head text-base">受付が完了しました</h1>
              <p class="text-xs qz-muted leading-relaxed">
                メイン画面にチームの名前が表示されます。<br />
                クイズが始まるまで、この画面のままお待ちください
              </p>
              ${
                members.length
                  ? `<div class="qz-panel--pink p-4">
                      <div class="qz-label" style="color:var(--forest);font-size:10px">Members</div>
                      <div class="text-sm font-bold mt-1 leading-relaxed">${members
                        .map((m) => `<span style="display:inline-block">${escapeHtml(m)}</span>`)
                        .join("・")}</div>
                    </div>`
                  : ""
              }
            </section>`;
          return;
        }
        root.innerHTML =
          headerHtml() +
          `<section class="qz-card p-6 text-center space-y-4">
            <p class="qz-display" style="font-size:2.25rem">Stand by</p>
            <h1 class="qz-jp-head text-base">次の問題を待っています</h1>
            <p class="text-xs qz-muted leading-relaxed">
              メイン画面で問題が出ると<br />ここに回答ボタンが表示されます
            </p>
            <div class="qz-panel--pink p-4">
              <div class="qz-label" style="color:var(--forest);font-size:10px">Your score</div>
              <div class="mt-1">
                <span class="qz-display" style="font-size:2.5rem">${
                  store.team.score || 0
                }</span>
                <span class="text-xs qz-muted ml-1">点</span>
              </div>
            </div>
          </section>`;
      }

      // durationMs が無い問題は無制限（司会者が手動で締め切る）
      function isUnlimited() {
        return !store.state?.durationMs;
      }

      // 無制限のときは Infinity を返し、時間切れ判定に引っかからないようにする
      function remainingSec() {
        if (store.state?.status === "closed") return 0;
        if (isUnlimited()) return Infinity;
        const elapsed =
          Date.now() - (store.state.votingStartedAt || Date.now());
        return Math.max(
          0,
          Math.ceil((store.state.durationMs - elapsed) / 1000)
        );
      }

      function isLocked() {
        return store.state?.status !== "voting" || remainingSec() === 0;
      }

      function timerLabel(remaining) {
        if (store.state?.status === "closed") return "締切";
        return remaining === Infinity ? "受付中" : String(remaining);
      }

      function renderVoting() {
        if (!store.quiz) {
          root.innerHTML =
            headerHtml() +
            `<section class="qz-card p-6 text-center qz-muted text-sm">
              問題を読み込み中...
            </section>`;
          return;
        }
        const quiz = store.quiz;
        const remaining = remainingSec();
        const answered = !!store.answer;
        const locked = isLocked();

        root.innerHTML =
          headerHtml() +
          `
          <section class="qz-card p-4 space-y-3">
            <div class="flex items-center justify-between gap-3">
              <span class="qz-label" style="color:var(--forest);font-size:10px">
                Q${(store.state.currentQuizIndex ?? 0) + 1}
              </span>
              <div class="flex items-center gap-2">
                <span class="text-[11px] font-bold px-2 py-0.5"
                  style="background:var(--forest);color:var(--cream)">${
                    quiz.points || 10
                  } 点</span>
                <span id="timer" class="qz-display ${
                  remaining !== Infinity && remaining <= 5
                    ? "qz-display--coral"
                    : ""
                }" style="font-size:1.75rem">${timerLabel(remaining)}</span>
              </div>
            </div>
            <h1 class="qz-jp-head text-lg leading-snug">${escapeHtml(
              quiz.question
            )}</h1>
            ${
              quiz.videoUrl
                ? `<p class="qz-panel--pink p-3 text-xs text-center font-bold">▶ 動画はメイン画面（スクリーン）をご覧ください</p>`
                : ""
            }
            ${
              quiz.imageUrl
                ? `<img src="${quiz.imageUrl}" class="w-full max-h-72 object-contain" style="border:2px solid var(--forest)" />`
                : ""
            }
          </section>
          <section id="choices" class="grid grid-cols-1 gap-3">
            ${quiz.choices
              .map((c, i) => {
                const selected = answered && store.answer.choice === i;
                const dim = locked && !selected;
                return `
              <button type="button" class="qz-choice${
                selected ? " qz-choice--selected" : ""
              }${dim ? " qz-choice--dim" : ""}"
                data-choice="${i}" ${locked ? "disabled" : ""}>
                <span class="qz-choice__key">${choiceLetter(i)}</span>
                <span class="qz-choice__body">${escapeHtml(c)}</span>
              </button>`;
              })
              .join("")}
          </section>
          <div id="vote-status">${voteStatusHtml(answered, remaining)}</div>
        `;
      }

      function voteStatusHtml(answered, remaining) {
        const closed = store.state?.status === "closed";
        if (answered) {
          return `<div class="qz-panel--pink p-3 text-center text-sm">
                  ${closed ? "あなたの回答" : "現在の選択"}:
                  <strong>${choiceLetter(store.answer.choice)}. ${escapeHtml(
            store.quiz.choices[store.answer.choice]
          )}</strong>${
            !closed && remaining > 0
              ? ' <span class="text-[11px] qz-muted">(時間内は変更OK)</span>'
              : ""
          }
                  ${
                    closed
                      ? '<div class="text-[11px] qz-muted mt-1">回答を締め切りました。正解発表をお待ちください</div>'
                      : ""
                  }
                </div>`;
        }
        if (closed) {
          return `<div class="qz-panel p-3 text-center text-sm qz-onDark-muted">回答締切（未回答）</div>`;
        }
        if (remaining === 0) {
          return `<div class="qz-panel p-3 text-center text-sm qz-onDark-muted">時間切れ</div>`;
        }
        return "";
      }

      function updateVotingSelection() {
        if (!store.quiz) return;
        const remaining = remainingSec();
        const answered = !!store.answer;
        const locked = isLocked();
        document
          .querySelectorAll("#choices button[data-choice]")
          .forEach((btn) => {
            const i = parseInt(btn.dataset.choice, 10);
            const selected = answered && store.answer.choice === i;
            btn.disabled = locked;
            btn.classList.toggle("qz-choice--selected", selected);
            btn.classList.toggle("qz-choice--dim", locked && !selected);
          });
        const statusEl = document.getElementById("vote-status");
        if (statusEl) statusEl.innerHTML = voteStatusHtml(answered, remaining);
      }

      function renderResult() {
        const quiz = store.quiz;
        const answered = store.answer;
        const correct = correctIndexOf(quiz, store.state);
        const isCorrect =
          quiz && answered && Number.isInteger(correct) && answered.choice === correct;
        const headline = !answered
          ? "No answer"
          : isCorrect
          ? "Correct"
          : "Wrong";
        root.innerHTML =
          headerHtml() +
          `
          <section class="qz-card p-6 text-center space-y-3">
            <p class="qz-display ${
              isCorrect ? "qz-display--coral" : ""
            }" style="font-size:2.75rem">${headline}</p>
            <p class="qz-jp-head text-xl">${
              !answered ? "未回答" : isCorrect ? "正解！" : "残念…"
            }</p>
            ${
              quiz && Number.isInteger(correct)
                ? `<div class="qz-panel--pink p-3 text-sm">
                    正解:
                    <strong>${choiceLetter(correct)}. ${escapeHtml(
                      quiz.choices[correct]
                    )}</strong>
                  </div>`
                : ""
            }
            ${
              answered
                ? `<div class="text-xs qz-muted">
                    あなたの回答: ${choiceLetter(answered.choice)}. ${escapeHtml(
                      quiz?.choices?.[answered.choice] || ""
                    )}
                  </div>`
                : ""
            }
            <hr class="qz-rule qz-rule--pink" />
            <div>
              <div class="qz-label qz-muted" style="font-size:10px">Total</div>
              <div>
                <span class="qz-display" style="font-size:2.25rem">${
                  store.team.score || 0
                }</span>
                <span class="text-xs qz-muted ml-1">点</span>
              </div>
            </div>
          </section>`;
      }

      function renderFinal() {
        const color = teamColor();
        root.innerHTML =
          headerHtml() +
          `
          <section class="qz-card p-6 text-center space-y-4">
            <p class="qz-display" style="font-size:2.5rem">Thank you</p>
            <h1 class="qz-jp-head text-lg">最終結果</h1>
            <p class="text-xs qz-muted">メイン画面のランキングをご確認ください</p>
            <div class="p-5" style="border:2.4px solid ${color};background:var(--pink-soft)">
              <div class="text-[11px] qz-muted">${escapeHtml(
                store.team.name
              )} の最終スコア</div>
              <div class="mt-1">
                <span class="qz-display" style="font-size:3rem">${
                  store.team.score || 0
                }</span>
                <span class="text-xs qz-muted ml-1">点</span>
              </div>
            </div>
          </section>`;
      }

      async function submitAnswer(choice) {
        if (store.submitting) {
          debug("送信中のためスキップ");
          return;
        }
        if (store.answer && store.answer.choice === choice) {
          debug("同じ選択肢のためスキップ");
          return;
        }
        if (!store.state || store.state.status !== "voting") {
          debug(`状態が voting でない: ${store.state?.status}`);
          return;
        }
        if (remainingSec() === 0) {
          debug("時間切れのためスキップ");
          return;
        }
        store.submitting = true;
        const letter = choiceLetter(choice);
        debug(
          store.answer
            ? `変更: ${choiceLetter(store.answer.choice)} → ${letter}`
            : `送信: ${letter}`
        );
        const quizId = store.state.currentQuizId;
        try {
          await setDoc(refs.answer(`${quizId}_${teamId}`), {
            quizId,
            teamId,
            choice,
            representative: store.team?.name || null,
            answeredAt: Date.now(),
          });
          debug(`送信成功: ${letter}`);
        } catch (err) {
          console.error(err);
          debug(`送信失敗: ${err.code || ""} ${err.message}`);
          alert("送信に失敗しました: " + describeError(err));
        } finally {
          store.submitting = false;
        }
      }

      setInterval(() => {
        if (store.state?.status !== "voting" || !store.quiz) return;
        const timer = document.getElementById("timer");
        if (!timer) return;
        const remaining = remainingSec();
        timer.textContent = timerLabel(remaining);
        timer.className = `qz-display ${
          remaining !== Infinity && remaining <= 5 ? "qz-display--coral" : ""
        }`;
        timer.style.fontSize = "1.75rem";
        if (!store.answer) {
          debug(`投票中 残${remaining}s answer=${!!store.answer} submitting=${store.submitting}`);
        }
        if (remaining === 0) updateVotingSelection();
      }, 1000);
    </script>
  </body>
</html>
