<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>管理画面 - Wedding Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/theme.css" />
    <style>
      /* admin.html 固有 */
      /* 司会者が本番でスマホから操作するので、押しやすさを優先する */
      .qz-input {
        font-size: 16px; /* iOS の自動ズームを防ぐ */
      }
      .qz-file::file-selector-button {
        margin-right: 0.75rem;
        padding: 0.4rem 0.75rem;
        border: 2px solid var(--forest);
        border-radius: 0;
        background: var(--cream);
        color: var(--forest);
        font-family: var(--font-body);
        font-weight: 700;
        font-size: 0.75rem;
        cursor: pointer;
      }
      .qz-file::file-selector-button:hover {
        background: var(--pink-soft);
      }
      /* 一覧の行 */
      .qz-row {
        background: var(--paper);
        border: 2px solid var(--forest);
        border-radius: 0;
      }
    </style>
  </head>
  <body>
    <main id="root" class="max-w-4xl mx-auto px-6 py-8 space-y-6">
      <header class="flex items-end justify-between pb-4" style="border-bottom:2px solid var(--forest-line)">
        <div>
          <h1 class="qz-jp-head text-xl" style="color:var(--cream)">
            管理画面
            <span class="qz-label qz-display--pink ml-2 align-middle">WEDDING QUIZ</span>
          </h1>
          <p id="auth-status" class="text-xs qz-muted mt-1">接続中...</p>
        </div>
        <a href="index.html" class="text-sm qz-muted hover:text-[var(--coral)]"
          >← トップ</a
        >
      </header>
      <div id="error-slot"></div>
      <div id="app" class="hidden space-y-6">
        <section class="qz-card p-5 space-y-4">
          <h2>
            <span class="qz-label" style="color:var(--coral)">Control</span>
            <span class="qz-jp-head block text-base mt-0.5">進行コントロール</span>
          </h2>
          <div
            id="status-display"
            class="qz-panel p-3 text-sm space-y-1"
          >
            読み込み中...
          </div>
          <div class="grid sm:grid-cols-2 md:grid-cols-4 gap-2">
            <button
              id="btn-start"
              class="qz-btn qz-btn--primary"
            >
              次の問題スタート
            </button>
            <button
              id="btn-reveal"
              class="qz-btn"
            >
              正解発表・採点
            </button>
            <button
              id="btn-final"
              class="qz-btn"
            >
              最終結果表示
            </button>
            <button
              id="btn-reset"
              class="qz-btn qz-btn--danger"
            >
              リセット
            </button>
          </div>
          <div id="video-controls" class="hidden pt-3 space-y-2" style="border-top:2px solid var(--forest-line)">
            <div class="text-xs qz-muted">
              メイン画面の動画コントロール
              <span id="video-state" class="ml-1 text-[var(--coral)] font-bold"></span>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
              <button id="btn-video-play" class="qz-btn qz-btn--primary">
                ▶ 再生
              </button>
              <button id="btn-video-pause" class="qz-btn">
                ⏸ 一時停止
              </button>
              <button id="btn-video-restart" class="qz-btn">
                ⏮ 頭から再生
              </button>
              <button id="btn-video-unmute" class="qz-btn">
                🔊 音声オン
              </button>
            </div>
            <p class="text-[10px] qz-muted leading-relaxed">
              ※ 音声はメイン画面側で一度クリックが必要な場合があります（ブラウザの自動再生制限）。<br>
              ※ YouTube・Google Drive の埋め込みは外部プレイヤーのため制御できません。MP4 の直リンクを推奨します。
            </p>
          </div>
        </section>

        <section class="qz-card p-5 space-y-4">
          <div class="flex items-center justify-between">
            <h2>
              <span class="qz-label" style="color:var(--coral)">Teams</span>
              <span class="qz-jp-head block text-base mt-0.5">チーム</span>
            </h2>
            <div class="flex gap-2">
              <button
                id="btn-seed-teams"
                class="qz-btn" style="font-size:11px;padding:6px 10px"
              >
                デフォルト 5 チーム作成
              </button>
              <button
                id="btn-clear-teams"
                class="qz-btn qz-btn--danger" style="font-size:11px;padding:6px 10px"
              >
                全チーム削除
              </button>
            </div>
          </div>
          <p class="text-xs qz-muted">
            参加者はメイン画面の QR を読み取り、<strong class="">チーム名と代表者名を自分で入力</strong>して参加します。ここでの事前登録は任意です（同じチーム名なら合流します）。
          </p>
          <div id="team-list" class="space-y-2"></div>
          <form id="team-form" class="flex gap-2">
            <input
              type="text"
              name="name"
              placeholder="新しいチーム名"
              required
              class="qz-input flex-1"
            />
            <button
              type="submit"
              class="qz-btn qz-btn--primary"
            >
              追加
            </button>
          </form>
        </section>

        <section class="qz-card p-5 space-y-4">
          <div class="flex items-center justify-between flex-wrap gap-2">
            <h2>
              <span class="qz-label" style="color:var(--coral)">Quizzes</span>
              <span class="qz-jp-head block text-base mt-0.5">クイズ</span>
            </h2>
            <div class="flex gap-2">
              <button id="btn-seed-quizzes" class="qz-btn" style="font-size:11px;padding:6px 10px">
                サンプル 11 問を投入
              </button>
              <button id="btn-clear-quizzes" class="qz-btn qz-btn--danger" style="font-size:11px;padding:6px 10px">
                全問題削除
              </button>
            </div>
          </div>
          <div id="quiz-list" class="space-y-2"></div>
          <form id="quiz-form" class="space-y-2 p-4" style="background:var(--pink-soft);border:2px solid var(--pink)">
            <input
              type="text"
              name="question"
              placeholder="問題文 (例: この人は誰でしょう？)"
              required
              class="qz-input"
            />
            <div class="flex items-start gap-3 flex-wrap">
              <input type="file" id="quiz-image" accept="image/*"
                class="qz-file" style="font-size:11px;color:var(--muted)">
              <div id="quiz-image-preview" class="hidden flex items-center gap-2">
                <img id="quiz-image-preview-img" class="h-16 w-16 object-cover" style="border:2px solid var(--forest)">
                <button type="button" id="btn-clear-image"
                  class="qz-btn" style="font-size:10px;padding:4px 8px">画像クリア</button>
                <span id="quiz-image-size" class="text-xs qz-muted"></span>
              </div>
            </div>
            <input type="url" name="videoUrl" placeholder="動画URL (任意、YouTube・Google Drive・Vimeo・MP4)"
              class="qz-input">
            <input type="text" name="note" placeholder="進行メモ (任意、司会者用。参加者には表示されません)"
              class="qz-input">
            <div class="grid sm:grid-cols-2 gap-2">
              <input
                type="text"
                name="choice0"
                placeholder="選択肢 A"
                required
                class="qz-input"
              />
              <input
                type="text"
                name="choice1"
                placeholder="選択肢 B"
                required
                class="qz-input"
              />
              <input
                type="text"
                name="choice2"
                placeholder="選択肢 C"
                required
                class="qz-input"
              />
              <input
                type="text"
                name="choice3"
                placeholder="選択肢 D"
                required
                class="qz-input"
              />
            </div>
            <div class="flex gap-2 items-center flex-wrap text-sm">
              <label class="qz-muted">正解:</label>
              <select
                name="correctIndex"
                class="qz-input"
              >
                <option value="0">A</option>
                <option value="1">B</option>
                <option value="2">C</option>
                <option value="3">D</option>
              </select>
              <label class="qz-muted ml-2">点数:</label>
              <input
                type="number"
                name="points"
                min="1"
                max="1000"
                value="10"
                required
                class="qz-input" style="width:5rem"
              />
              <label class="qz-muted ml-2">解答時間:</label>
              <input
                type="number"
                name="durationSec"
                min="5"
                max="600"
                placeholder="無制限"
                class="qz-input" style="width:6rem"
              />
              <span class="qz-muted">秒（空欄=MCが手動締切）</span>
              <button
                type="submit"
                class="qz-btn qz-btn--primary ml-auto"
              >
                追加
              </button>
            </div>
          </form>
        </section>
      </div>
    </main>

    <script src="env.js"></script>
    <script type="module">
      import {
        ensureSignedIn,
        envError,
        db,
        APP_ID,
        refs,
        TEAM_COLORS,
        DURATION_MS,
        SCORE_PER_CORRECT,
        escapeHtml,
        renderSetupError,
      } from "./js/firebase-init.js";
      import {
        onSnapshot,
        getDocs,
        getDoc,
        setDoc,
        updateDoc,
        addDoc,
        deleteDoc,
        doc,
        query,
        orderBy,
        where,
        writeBatch,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

      const authStatus = document.getElementById("auth-status");
      const errorSlot = document.getElementById("error-slot");
      const appEl = document.getElementById("app");

      if (envError) {
        renderSetupError(errorSlot, envError);
        authStatus.textContent = "Firebase: 未設定";
        throw new Error(envError);
      }

      let user;
      try {
        user = await ensureSignedIn();
      } catch (err) {
        renderSetupError(errorSlot, err.message || String(err));
        authStatus.textContent = "Firebase: 接続失敗";
        throw err;
      }

      appEl.classList.remove("hidden");
      authStatus.textContent = `接続済 / AppID: ${APP_ID} / UID: ${user.uid.slice(
        0,
        8
      )}`;

      const stateRef = refs.state();
      const initialSnap = await getDoc(stateRef);
      if (!initialSnap.exists()) {
        await setDoc(stateRef, {
          status: "waiting",
          currentQuizId: null,
          currentQuizIndex: -1,
          votingStartedAt: null,
          durationMs: DURATION_MS,
          scoredForQuizId: null,
        });
      }

      let currentState = null;
      let quizzes = [];
      let teams = [];

      onSnapshot(stateRef, (snap) => {
        currentState = snap.data();
        renderStatus();
        updateControlButtons();
        renderVideoControls();
      });
      onSnapshot(query(refs.quizzes(), orderBy("order")), (snap) => {
        quizzes = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        renderQuizzes();
        renderStatus();
        updateControlButtons();
        renderVideoControls();
      });
      onSnapshot(query(refs.teams(), orderBy("order")), (snap) => {
        teams = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        renderTeams();
        renderStatus();
      });

      setInterval(() => {
        if (currentState?.status === "voting") renderStatus();
      }, 500);

      function renderStatus() {
        const el = document.getElementById("status-display");
        if (!currentState) return;
        const quiz = quizzes.find((q) => q.id === currentState.currentQuizId);
        const label =
          {
            waiting: "待機中",
            voting: "回答受付中",
            result: "結果表示",
            final_ranking: "最終結果",
          }[currentState.status] || currentState.status;

        let timerText = "";
        if (currentState.status === "voting") {
          if (!currentState.durationMs) {
            timerText = ' / <strong class="text-[var(--coral)]">時間無制限（手動で締切）</strong>';
          } else if (currentState.votingStartedAt) {
            const elapsed = Date.now() - currentState.votingStartedAt;
            const remaining = Math.max(
              0,
              Math.ceil((currentState.durationMs - elapsed) / 1000)
            );
            timerText =
              remaining > 0
                ? ` / 残り ${remaining} 秒で自動採点`
                : " / 自動採点中...";
          }
        }

        el.innerHTML = `
          <div>ステータス: <strong style="color:var(--coral);font-weight:700">${label}</strong>${timerText}</div>
          <div>現在の問題: ${
            quiz
              ? `#${currentState.currentQuizIndex + 1} ${escapeHtml(
                  quiz.question
                )}`
              : "未設定"
          }</div>
          <div class="qz-muted">登録: クイズ ${quizzes.length} 件 / チーム ${teams.length} 件</div>
        `;
      }

      function updateControlButtons() {
        const start = document.getElementById("btn-start");
        const reveal = document.getElementById("btn-reveal");
        if (!currentState) return;
        const hasNext =
          quizzes.length > 0 &&
          currentState.currentQuizIndex + 1 < quizzes.length;
        start.disabled = currentState.status === "voting" || !hasNext;
        reveal.disabled = currentState.status !== "voting";
      }

      function renderTeams() {
        const list = document.getElementById("team-list");
        if (teams.length === 0) {
          list.innerHTML =
            '<p class="text-xs qz-muted">チーム未登録</p>';
          return;
        }
        list.innerHTML = teams
          .map((t, i) => {
            const color = TEAM_COLORS[i % TEAM_COLORS.length];
            return `
            <div class="qz-row flex items-center gap-2 p-2 flex-wrap text-sm">
              <span class="w-3 h-3 rounded-full" style="background-color:${color}"></span>
              <input class="qz-input flex-1" style="min-width:120px;padding:6px 8px;font-size:14px"
                value="${escapeHtml(t.name)}" data-action="rename" data-id="${t.id}">
              <span class="qz-muted">スコア <span style="color:var(--coral);font-weight:700">${
                t.score || 0
              }</span></span>
              <span class="qz-muted">代表 ${
                t.representative
                  ? `<span class="">${escapeHtml(
                      t.representative
                    )}</span>`
                  : `<span class="qz-muted">未登録</span>`
              }</span>
              <button class="qz-btn" style="font-size:10px;padding:4px 8px"
                data-action="clear-rep" data-id="${t.id}">代表クリア</button>
              <button class="qz-btn qz-btn--danger" style="font-size:10px;padding:4px 8px"
                data-action="delete" data-id="${t.id}">削除</button>
            </div>`;
          })
          .join("");
      }

      function renderQuizzes() {
        const list = document.getElementById("quiz-list");
        if (quizzes.length === 0) {
          list.innerHTML =
            '<p class="text-xs qz-muted">問題未登録</p>';
          return;
        }
        list.innerHTML = quizzes
          .map(
            (q, i) => `
          <div class="qz-row p-3">
            <div class="flex items-start gap-2">
              <span class="text-xs qz-muted font-mono">#${i + 1}</span>
              ${
                q.imageUrl
                  ? `<img src="${q.imageUrl}" class="w-12 h-12 object-cover shrink-0" style="border:2px solid var(--forest)">`
                  : ""
              }
              <div class="flex-1 text-sm">
                <div class="font-medium flex items-center gap-2 flex-wrap">
                  <span>${escapeHtml(q.question)}</span>
                  <label class="text-xs qz-muted flex items-center gap-1">
                    <input type="number" min="1" max="1000"
                      value="${q.points || 10}"
                      data-action="points" data-id="${q.id}"
                      class="qz-input" style="width:4rem;padding:4px;text-align:center;font-weight:700">
                    点
                  </label>
                  <label class="text-xs qz-muted flex items-center gap-1">
                    解答
                    <input type="number" min="5" max="600"
                      value="${q.durationSec || ""}"
                      placeholder="無制限"
                      data-action="duration" data-id="${q.id}"
                      class="qz-input" style="width:5rem;padding:4px;text-align:center">
                    秒
                  </label>
                  ${
                    q.durationSec
                      ? ""
                      : `<span class="text-[10px] px-1.5 py-0.5 font-bold" style="background:var(--coral);color:#fff">手動締切</span>`
                  }
                </div>
                <div class="text-xs qz-muted mt-1 flex flex-wrap gap-x-3">
                  ${q.choices
                    .map(
                      (c, idx) =>
                        `<span class="${
                          idx === q.correctIndex
                            ? "qz-coral"
                            : ""
                        }">${["A", "B", "C", "D"][idx]}. ${escapeHtml(c)}${
                          idx === q.correctIndex ? " ✓" : ""
                        }</span>`
                    )
                    .join("")}
                  ${
                    q.videoUrl
                      ? `<span class="">動画あり</span>`
                      : ""
                  }
                </div>
                ${
                  q.note
                    ? `<div class="text-[10px] qz-muted mt-1 pl-2" style="border-left:3px solid var(--coral)">
                         ${escapeHtml(q.note)}
                       </div>`
                    : ""
                }
              </div>
              <button class="qz-btn qz-btn--danger" style="font-size:10px;padding:4px 8px"
                data-action="delete-quiz" data-id="${q.id}">削除</button>
            </div>
          </div>`
          )
          .join("");
      }

      document
        .getElementById("team-list")
        .addEventListener("click", async (e) => {
          const action = e.target.dataset.action;
          const id = e.target.dataset.id;
          if (!action || !id) return;
          if (action === "delete") {
            if (confirm("このチームを削除しますか？")) {
              await deleteDoc(refs.team(id));
            }
          } else if (action === "clear-rep") {
            await updateDoc(refs.team(id), { representative: null });
          }
        });
      document
        .getElementById("team-list")
        .addEventListener("change", async (e) => {
          if (e.target.dataset.action === "rename") {
            await updateDoc(refs.team(e.target.dataset.id), {
              name: e.target.value.trim(),
            });
          }
        });

      document
        .getElementById("quiz-list")
        .addEventListener("click", async (e) => {
          if (
            e.target.dataset.action === "delete-quiz" &&
            confirm("この問題を削除しますか？")
          ) {
            await deleteDoc(refs.quiz(e.target.dataset.id));
          }
        });

      document
        .getElementById("quiz-list")
        .addEventListener("change", async (e) => {
          const action = e.target.dataset.action;
          const id = e.target.dataset.id;
          if (!id) return;
          if (action === "duration") {
            const seconds = parseDurationInput(e.target.value);
            e.target.value = seconds ?? "";
            await updateDoc(refs.quiz(id), { durationSec: seconds });
          } else if (action === "points") {
            const points = Math.max(
              1,
              Math.min(1000, parseInt(e.target.value, 10) || 10)
            );
            e.target.value = points;
            await updateDoc(refs.quiz(id), { points });
          }
        });

      document
        .getElementById("team-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const name = e.target.name.value.trim();
          if (!name) return;
          const order =
            teams.length > 0
              ? Math.max(...teams.map((t) => t.order || 0)) + 1
              : 0;
          await addDoc(refs.teams(), {
            name,
            score: 0,
            representative: null,
            order,
          });
          e.target.reset();
        });

      document
        .getElementById("btn-seed-teams")
        .addEventListener("click", async () => {
          if (
            !confirm(
              "デフォルトの 5 チームを作成します。既存のチームはそのまま残ります。"
            )
          )
            return;
          const defaults = ["チーム A", "チーム B", "チーム C", "チーム D", "チーム E"];
          const batch = writeBatch(db);
          const base = teams.length;
          for (let i = 0; i < defaults.length; i++) {
            const newRef = doc(refs.teams());
            batch.set(newRef, {
              name: defaults[i],
              score: 0,
              representative: null,
              order: base + i,
            });
          }
          await batch.commit();
        });

      document
        .getElementById("btn-clear-teams")
        .addEventListener("click", async () => {
          if (teams.length === 0) return;
          if (
            !confirm(
              `参加中の ${teams.length} チームと全回答を削除します。やり直す場合に使ってください。よろしいですか？`
            )
          )
            return;
          const ansSnap = await getDocs(refs.answers());
          const batch = writeBatch(db);
          ansSnap.docs.forEach((d) => batch.delete(d.ref));
          teams.forEach((t) => batch.delete(refs.team(t.id)));
          batch.update(stateRef, {
            status: "waiting",
            currentQuizId: null,
            currentQuizIndex: -1,
            votingStartedAt: null,
            scoredForQuizId: null,
          });
          await batch.commit();
        });

      // 当日のクイズシートをそのまま入れたサンプル。
      // 画像・動画は差し替え前提のサンプルURL。durationSec: null は「MCが手動締切」。
      const SAMPLE_VIDEO = "https://samplelib.com/mp4/sample-5s.mp4";
      const sampleImage = (label, bg) =>
        `https://placehold.co/1200x800/${bg}/f7e39a/png?text=${encodeURIComponent(
          label
        )}`;

      const SAMPLE_QUIZZES = [
        {
          question: "この中で、新郎・新婦の赤ちゃんの頃（0〜1歳）の写真はどれ？",
          choices: ["写真A", "写真B", "写真C", "写真D"],
          correctIndex: 0,
          points: 10,
          durationSec: 30,
          imageUrl: sampleImage("Baby Photo A / B / C / D", "0c1740"),
          videoUrl: null,
          note: "画面に4枚の赤ちゃんの写真を並べて提示",
        },
        {
          question:
            "二人が初めて出会った時、〇〇（新郎/新婦）が相手に感じた本音の第一印象は？",
          choices: ["好印象", "チャラそう", "怖そう", "特に何も思わなかった"],
          correctIndex: 1,
          points: 10,

      document
        .getElementById("btn-seed-quizzes")
        .addEventListener("click", async () => {
          if (

                  ? `

既存の ${quizzes.length} 問はそのまま残り、後ろに追加されます。`
                  : "")
            )
          )
            return;
          const base = quizzes.length
            ? Math.max(...quizzes.map((q) => q.order || 0)) + 1
            : 0;
          const batch = writeBatch(db);
          SAMPLE_QUIZZES.forEach((q, i) => {
            batch.set(doc(refs.quizzes()), {
              question: q.question,
              choices: q.choices,
              correctIndex: q.correctIndex,
              points: q.points,
              durationSec: q.durationSec,

              videoUrl: q.videoUrl,
              note: q.note || null,
              order: base + i,
            });
          });
          await batch.commit();
        });

      document
        .getElementById("btn-clear-quizzes")
        .addEventListener("click", async () => {
          if (quizzes.length === 0) return;
          if (!confirm(`登録済みの ${quizzes.length} 問すべてを削除します。よろしいですか？`))
            return;
          const batch = writeBatch(db);
          quizzes.forEach((q) => batch.delete(refs.quiz(q.id)));
          batch.update(stateRef, {
            status: "waiting",
            currentQuizId: null,
            currentQuizIndex: -1,
            votingStartedAt: null,
            scoredForQuizId: null,
          });
          await batch.commit();
        });

      let currentImageDataUrl = null;

      async function fileToResizedDataUrl(file, maxSize = 800, quality = 0.8) {
        const img = new Image();
        const url = URL.createObjectURL(file);
        try {
          await new Promise((resolve, reject) => {
            img.onload = resolve;
            img.onerror = reject;
            img.src = url;
          });
        } finally {
          URL.revokeObjectURL(url);
        }
        let { width, height } = img;
        if (width > height && width > maxSize) {
          height = Math.round((height * maxSize) / width);
          width = maxSize;
        } else if (height >= width && height > maxSize) {
          width = Math.round((width * maxSize) / height);
          height = maxSize;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        return canvas.toDataURL("image/jpeg", quality);
      }

      function clearQuizImage() {
        currentImageDataUrl = null;
        document.getElementById("quiz-image").value = "";
        document.getElementById("quiz-image-preview").classList.add("hidden");
      }

      document
        .getElementById("quiz-image")
        .addEventListener("change", async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          try {
            let dataUrl = await fileToResizedDataUrl(file, 800, 0.8);
            if (dataUrl.length > 900_000) {
              dataUrl = await fileToResizedDataUrl(file, 600, 0.7);
            }
            if (dataUrl.length > 900_000) {
              alert(
                "画像サイズが大きすぎます。別の画像を選ぶか、事前にサイズを小さくしてください。"
              );
              clearQuizImage();
              return;
            }
            currentImageDataUrl = dataUrl;
            const img = document.getElementById("quiz-image-preview-img");
            img.src = dataUrl;
            document
              .getElementById("quiz-image-preview")
              .classList.remove("hidden");
            document.getElementById(
              "quiz-image-size"
            ).textContent = `${Math.round(dataUrl.length / 1024)} KB`;
          } catch (err) {
            console.error(err);
            alert("画像の処理に失敗しました: " + err.message);
          }
        });

      document
        .getElementById("btn-clear-image")
        .addEventListener("click", clearQuizImage);

      document
        .getElementById("quiz-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          const order =
            quizzes.length > 0
              ? Math.max(...quizzes.map((q) => q.order || 0)) + 1
              : 0;
          await addDoc(refs.quizzes(), {
            question: fd.get("question").trim(),
            choices: [0, 1, 2, 3].map((i) => fd.get(`choice${i}`).trim()),
            correctIndex: parseInt(fd.get("correctIndex"), 10),
            points: parseInt(fd.get("points"), 10) || 10,
            durationSec: parseDurationInput(fd.get("durationSec")),
            imageUrl: currentImageDataUrl || null,
            videoUrl: fd.get("videoUrl").trim() || null,
            note: fd.get("note").trim() || null,
            order,
          });
          e.target.reset();
          clearQuizImage();
        });

      // 空欄・0・不正値は「無制限（MCが手動で締切）」を意味する null にする。
      function parseDurationInput(raw) {
        const n = parseInt(String(raw ?? "").trim(), 10);
        if (!Number.isFinite(n) || n <= 0) return null;
        return Math.max(5, Math.min(600, n));
      }

      document
        .getElementById("btn-start")
        .addEventListener("click", async () => {
          const nextIndex = (currentState?.currentQuizIndex ?? -1) + 1;
          if (nextIndex >= quizzes.length) {
            alert("次の問題がありません");
            return;
          }
          if (teams.length === 0) {
            alert("チームを先に登録してください");
            return;
          }
          const quiz = quizzes[nextIndex];
          const durationSec = parseDurationInput(quiz.durationSec);
          await updateDoc(stateRef, {
            status: "voting",
            currentQuizId: quiz.id,
            currentQuizIndex: nextIndex,
            votingStartedAt: Date.now(),
            // null = 無制限。タイマーを表示せず自動採点もしない。
            durationMs: durationSec ? durationSec * 1000 : null,
            videoPlaying: true,
            videoCue: Date.now(),
          });
        });

      async function doReveal() {
        if (!currentState || currentState.status !== "voting") return;
        const quizId = currentState.currentQuizId;
        const quiz = quizzes.find((q) => q.id === quizId);
        if (!quiz) return;
        if (currentState.scoredForQuizId !== quizId) {
          const ansSnap = await getDocs(
            query(refs.answers(), where("quizId", "==", quizId))
          );
          const batch = writeBatch(db);
          const teamMap = new Map(teams.map((t) => [t.id, t]));
          const points = quiz.points || SCORE_PER_CORRECT;
          ansSnap.docs.forEach((d) => {
            const a = d.data();
            if (a.choice === quiz.correctIndex) {
              const team = teamMap.get(a.teamId);
              if (team) {
                batch.update(refs.team(a.teamId), {
                  score: (team.score || 0) + points,
                });
              }
            }
          });
          batch.update(stateRef, {
            status: "result",
            scoredForQuizId: quizId,
          });
          await batch.commit();
        } else {
          await updateDoc(stateRef, { status: "result" });
        }
      }

      document.getElementById("btn-reveal").addEventListener("click", doReveal);

      let autoRevealInFlight = false;
      setInterval(async () => {
        if (!currentState || currentState.status !== "voting") {
          autoRevealInFlight = false;
          return;
        }
        if (autoRevealInFlight) return;
        // durationMs が null（無制限）の問題は自動採点しない
        if (!currentState.durationMs) return;
        const elapsed =
          Date.now() - (currentState.votingStartedAt || Date.now());
        if (elapsed < currentState.durationMs) return;
        autoRevealInFlight = true;
        try {
          await doReveal();
        } finally {
          autoRevealInFlight = false;
        }
      }, 500);

      // 動画コントロール: state に指示を書き、main.html が反映する。
      // videoCmdAt は「同じボタンを連続で押しても main に届く」ための単調増加の印。
      async function sendVideoCmd(patch) {
        await updateDoc(stateRef, { ...patch, videoCmdAt: Date.now() });
      }

      document
        .getElementById("btn-video-play")
        .addEventListener("click", () => sendVideoCmd({ videoPlaying: true }));
      document
        .getElementById("btn-video-pause")
        .addEventListener("click", () => sendVideoCmd({ videoPlaying: false }));
      document
        .getElementById("btn-video-restart")
        .addEventListener("click", () =>
          sendVideoCmd({ videoPlaying: true, videoSeekTo: 0 })
        );
      document
        .getElementById("btn-video-unmute")
        .addEventListener("click", () => sendVideoCmd({ videoMuted: false }));

      function renderVideoControls() {
        const box = document.getElementById("video-controls");
        if (!currentState) return;
        const quiz = quizzes.find((q) => q.id === currentState.currentQuizId);
        const show =
          !!quiz?.videoUrl &&
          (currentState.status === "voting" || currentState.status === "result");
        box.classList.toggle("hidden", !show);
        if (!show) return;
        const label = document.getElementById("video-state");
        label.textContent = `${
          currentState.videoPlaying === false ? "一時停止中" : "再生中"
        } / ${currentState.videoMuted === false ? "音声オン" : "ミュート"}`;
      }

      document
        .getElementById("btn-final")
        .addEventListener("click", async () => {
          await updateDoc(stateRef, { status: "final_ranking" });
        });

      document

          if (
            !confirm(
              "スコアと回答をリセットします。問題とチームは残ります。よろしいですか？"
            )
          )
            return;
          const ansSnap = await getDocs(refs.answers());
          const batch = writeBatch(db);
          ansSnap.docs.forEach((d) => batch.delete(d.ref));
          teams.forEach((t) =>
            batch.update(refs.team(t.id), { score: 0, representative: null })
          );
          batch.update(stateRef, {
            status: "waiting",
            currentQuizId: null,
            currentQuizIndex: -1,
            votingStartedAt: null,
            scoredForQuizId: null,
            videoPlaying: true,
            videoMuted: true,
            videoSeekTo: null,
          });
          await batch.commit();
        });
