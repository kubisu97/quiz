<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>管理画面 - ウェディングクイズ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Shippori+Mincho+B1:wght@600;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        --mq-gold-hi: #f7e39a;
        --mq-gold: #d4af37;
        --mq-gold-lo: #8a6a1c;
        --mq-navy-hi: #1c2f6b;
        --mq-navy: #0c1740;
        --mq-navy-lo: #060d28;
        --mq-ink: #02040f;
        --mq-text: #f7f3e6;
        --mq-muted: #a7a4c7;
      }
      body {
        font-family: "Noto Sans JP", sans-serif;
        color: var(--mq-text);
        background-color: var(--mq-ink);
        background-image:
          radial-gradient(ellipse 90% 60% at 50% 0%, rgba(47, 76, 167, 0.45), transparent 65%),
          radial-gradient(ellipse 140% 110% at 50% 55%, #12225c 0%, #081233 55%, #02040f 100%);
        background-attachment: fixed;
      }
      .mq-serif { font-family: "Cinzel", "Shippori Mincho B1", serif; letter-spacing: 0.08em; }
      .mq-mincho { font-family: "Shippori Mincho B1", serif; }
      .mq-gold-text {
        background: linear-gradient(180deg, var(--mq-gold-hi) 0%, var(--mq-gold) 55%, var(--mq-gold-lo) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .mq-panel {
        background: linear-gradient(180deg, rgba(28, 47, 107, 0.5) 0%, rgba(8, 18, 51, 0.92) 100%);
        border: 1px solid rgba(212, 175, 55, 0.4);
        border-radius: 0.75rem;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(247, 227, 154, 0.15);
      }
      .mq-hex {
        position: relative;
        padding: 2px;
        clip-path: polygon(26px 0, calc(100% - 26px) 0, 100% 50%, calc(100% - 26px) 100%, 26px 100%, 0 50%);
        background: linear-gradient(180deg, var(--mq-gold-hi) 0%, var(--mq-gold) 30%, var(--mq-gold-lo) 65%, var(--mq-gold) 100%);
      }
      .mq-hex-inner {
        width: 100%;
        height: 100%;
        clip-path: polygon(25px 0, calc(100% - 25px) 0, 100% 50%, calc(100% - 25px) 100%, 25px 100%, 0 50%);
        background: linear-gradient(180deg, #1a2b66 0%, #0c1740 50%, #060d28 100%);
      }
      .mq-hex-inner--selected {
        background: linear-gradient(180deg, #ffd98a 0%, #f59e0b 45%, #a85b06 100%);
        color: #241300;
      }
      .mq-hex-inner--correct {
        background: linear-gradient(180deg, #86efac 0%, #10b981 45%, #047857 100%);
        color: #04160d;
        animation: mq-flash 0.9s ease-in-out infinite alternate;
      }
      .mq-hex-inner--dim { opacity: 0.35; }
      @keyframes mq-flash {
        from { filter: brightness(1); }
        to { filter: brightness(1.35); }
      }
      .mq-hex-letter {
        font-family: "Cinzel", serif;
        color: var(--mq-gold-hi);
        font-weight: 700;
      }
      .mq-hex-inner--selected .mq-hex-letter,
      .mq-hex-inner--correct .mq-hex-letter { color: inherit; }
      .mq-hexline { position: relative; }
      .mq-hexline::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: 2px;
        transform: translateY(-1px);
        background: linear-gradient(90deg, transparent, var(--mq-gold) 12%, var(--mq-gold) 88%, transparent);
        z-index: 0;
      }
      .mq-hexline > .mq-hex { z-index: 1; }
      .mq-btn {
        border-radius: 0.5rem;
        border: 1px solid rgba(212, 175, 55, 0.5);
        background: linear-gradient(180deg, #1a2b66, #0c1740);
        color: var(--mq-text);
        transition: filter 0.15s;
      }
      .mq-btn:hover:not(:disabled) { filter: brightness(1.3); }
      .mq-btn:disabled { opacity: 0.4; cursor: not-allowed; }
      .mq-btn--gold {
        background: linear-gradient(180deg, var(--mq-gold-hi), var(--mq-gold) 50%, var(--mq-gold-lo));
        color: #241300;
        border-color: var(--mq-gold-hi);
        font-weight: 700;
      }
      .mq-btn--danger {
        background: linear-gradient(180deg, #7f1d1d, #450a0a);
        border-color: rgba(248, 113, 113, 0.6);
      }
      .mq-input {
        background: rgba(2, 4, 15, 0.6);
        border: 1px solid rgba(212, 175, 55, 0.35);
        border-radius: 0.5rem;
        color: var(--mq-text);
      }
      .mq-input:focus {
        outline: none;
        border-color: var(--mq-gold);
        box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.25);
      }
      .mq-input::placeholder { color: #8f8cae; }

      /* admin.html 固有 */
      .mq-file::file-selector-button {
        margin-right: 0.75rem;
        padding: 0.375rem 0.75rem;
        border-radius: 0.375rem;
        border: 1px solid rgba(212, 175, 55, 0.5);
        background: linear-gradient(180deg, #1a2b66, #0c1740);
        color: var(--mq-gold-hi);
        font-size: 0.75rem;
        cursor: pointer;
      }
      .mq-file::file-selector-button:hover { filter: brightness(1.3); }
    </style>
  </head>
  <body class="min-h-screen">
    <main id="root" class="max-w-4xl mx-auto px-6 py-8 space-y-6">
      <header class="flex items-end justify-between border-b border-[rgba(212,175,55,.35)] pb-4">
        <div>
          <h1 class="text-xl font-bold mq-mincho">
            管理画面
            <span class="mq-serif mq-gold-text text-sm font-bold tracking-[0.25em] ml-2 align-middle">WEDDING QUIZ</span>
          </h1>
          <p id="auth-status" class="text-xs text-[var(--mq-muted)] mt-1">接続中...</p>
        </div>
        <a href="index.html" class="text-sm text-[var(--mq-muted)] hover:text-[var(--mq-gold-hi)]"
          >← トップ</a
        >
      </header>
      <div id="error-slot"></div>
      <div id="app" class="hidden space-y-6">
        <section class="mq-panel p-5 space-y-4">
          <h2 class="text-xs font-bold mq-serif mq-gold-text uppercase tracking-[0.25em]">
            進行コントロール
          </h2>
          <div
            id="status-display"
            class="bg-black/30 border border-[rgba(212,175,55,.25)] rounded p-3 text-sm space-y-1"
          >
            読み込み中...
          </div>
          <div class="grid sm:grid-cols-2 md:grid-cols-4 gap-2">
            <button
              id="btn-start"
              class="mq-btn mq-btn--gold px-4 py-2 font-medium text-sm"
            >
              次の問題スタート
            </button>
            <button
              id="btn-reveal"
              class="mq-btn px-4 py-2 font-medium text-sm"
            >
              正解発表・採点
            </button>
            <button
              id="btn-final"
              class="mq-btn px-4 py-2 font-medium text-sm"
            >
              最終結果表示
            </button>
            <button
              id="btn-reset"
              class="mq-btn mq-btn--danger px-4 py-2 font-medium text-sm"
            >
              リセット
            </button>
          </div>
        </section>

        <section class="mq-panel p-5 space-y-4">
          <div class="flex items-center justify-between">
            <h2 class="text-xs font-bold mq-serif mq-gold-text uppercase tracking-[0.25em]">
              チーム
            </h2>
            <button
              id="btn-seed-teams"
              class="mq-btn text-xs px-3 py-1"
            >
              デフォルト 5 チーム作成
            </button>
          </div>
          <p class="text-xs text-[var(--mq-muted)]">
            各チームの QR はメイン画面で表示されます。参加者は QR 読み取り後、代表者名を入力してチームを決定します。
          </p>
          <div id="team-list" class="space-y-2"></div>
          <form id="team-form" class="flex gap-2">
            <input
              type="text"
              name="name"
              placeholder="新しいチーム名"
              required
              class="flex-1 mq-input px-3 py-2 text-sm"
            />
            <button
              type="submit"
              class="mq-btn mq-btn--gold px-4 py-2 text-sm font-medium"
            >
              追加
            </button>
          </form>
        </section>

        <section class="mq-panel p-5 space-y-4">
          <h2 class="text-xs font-bold mq-serif mq-gold-text uppercase tracking-[0.25em]">
            クイズ
          </h2>
          <div id="quiz-list" class="space-y-2"></div>
          <form id="quiz-form" class="space-y-2 bg-black/30 border border-[rgba(212,175,55,.25)] p-4 rounded">
            <input
              type="text"
              name="question"
              placeholder="問題文 (例: この人は誰でしょう？)"
              required
              class="w-full mq-input px-3 py-2 text-sm"
            />
            <div class="flex items-start gap-3 flex-wrap">
              <input type="file" id="quiz-image" accept="image/*"
                class="text-xs text-[var(--mq-muted)] mq-file">
              <div id="quiz-image-preview" class="hidden flex items-center gap-2">
                <img id="quiz-image-preview-img" class="h-16 w-16 object-cover rounded border border-[rgba(212,175,55,.4)]">
                <button type="button" id="btn-clear-image"
                  class="mq-btn text-xs px-2 py-1">画像クリア</button>
                <span id="quiz-image-size" class="text-xs text-[var(--mq-muted)]"></span>
              </div>
            </div>
            <input type="url" name="videoUrl" placeholder="動画URL (任意、YouTube または MP4 の直接URL)"
              class="w-full mq-input px-3 py-2 text-sm">
            <div class="grid sm:grid-cols-2 gap-2">
              <input
                type="text"
                name="choice0"
                placeholder="選択肢 A"
                required
                class="mq-input px-3 py-2 text-sm"
              />
              <input
                type="text"
                name="choice1"
                placeholder="選択肢 B"
                required
                class="mq-input px-3 py-2 text-sm"
              />
              <input
                type="text"
                name="choice2"
                placeholder="選択肢 C"
                required
                class="mq-input px-3 py-2 text-sm"
              />
              <input
                type="text"
                name="choice3"
                placeholder="選択肢 D"
                required
                class="mq-input px-3 py-2 text-sm"
              />
            </div>
            <div class="flex gap-2 items-center flex-wrap text-sm">
              <label class="text-[var(--mq-muted)]">正解:</label>
              <select
                name="correctIndex"
                class="mq-input px-3 py-2"
              >
                <option value="0">A</option>
                <option value="1">B</option>
                <option value="2">C</option>
                <option value="3">D</option>
              </select>
              <label class="text-[var(--mq-muted)] ml-2">点数:</label>
              <input
                type="number"
                name="points"
                min="1"
                max="1000"
                value="10"
                required
                class="mq-input px-3 py-2 w-20"
              />
              <button
                type="submit"
                class="ml-auto mq-btn mq-btn--gold px-4 py-2 font-medium"
              >
                追加
              </button>
            </div>
          </form>
        </section>
      </div>
    </main>

    <script src="env.js"></script>
    <script type="module">
      import {
        ensureSignedIn,
        envError,
        db,
        APP_ID,
        refs,
        TEAM_COLORS,
        DURATION_MS,
        SCORE_PER_CORRECT,
        escapeHtml,
        renderSetupError,
      } from "./js/firebase-init.js";
      import {
        onSnapshot,
        getDocs,
        getDoc,
        setDoc,
        updateDoc,
        addDoc,
        deleteDoc,
        doc,
        query,
        orderBy,
        where,
        writeBatch,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

      const authStatus = document.getElementById("auth-status");
      const errorSlot = document.getElementById("error-slot");
      const appEl = document.getElementById("app");

      if (envError) {
        renderSetupError(errorSlot, envError);
        authStatus.textContent = "Firebase: 未設定";
        throw new Error(envError);
      }

      let user;
      try {
        user = await ensureSignedIn();
      } catch (err) {
        renderSetupError(errorSlot, err.message || String(err));
        authStatus.textContent = "Firebase: 接続失敗";
        throw err;
      }

      appEl.classList.remove("hidden");
      authStatus.textContent = `接続済 / AppID: ${APP_ID} / UID: ${user.uid.slice(
        0,
        8
      )}`;

      const stateRef = refs.state();
      const initialSnap = await getDoc(stateRef);
      if (!initialSnap.exists()) {
        await setDoc(stateRef, {
          status: "waiting",
          currentQuizId: null,
          currentQuizIndex: -1,
          votingStartedAt: null,
          durationMs: DURATION_MS,
          scoredForQuizId: null,
        });
      }

      let currentState = null;
      let quizzes = [];
      let teams = [];

      onSnapshot(stateRef, (snap) => {
        currentState = snap.data();
        renderStatus();
        updateControlButtons();
      });
      onSnapshot(query(refs.quizzes(), orderBy("order")), (snap) => {
        quizzes = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        renderQuizzes();
        renderStatus();
        updateControlButtons();
      });
      onSnapshot(query(refs.teams(), orderBy("order")), (snap) => {
        teams = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        renderTeams();
        renderStatus();
      });

      setInterval(() => {
        if (currentState?.status === "voting") renderStatus();
      }, 500);

      function renderStatus() {
        const el = document.getElementById("status-display");
        if (!currentState) return;
        const quiz = quizzes.find((q) => q.id === currentState.currentQuizId);
        const label =
          {
            waiting: "待機中",
            voting: "回答受付中",
            result: "結果表示",
            final_ranking: "最終結果",
          }[currentState.status] || currentState.status;

        let timerText = "";
        if (currentState.status === "voting" && currentState.votingStartedAt) {
          const elapsed = Date.now() - currentState.votingStartedAt;
          const remaining = Math.max(
            0,
            Math.ceil((currentState.durationMs - elapsed) / 1000)
          );
          timerText =
            remaining > 0
              ? ` / 残り ${remaining} 秒で自動採点`
              : " / 自動採点中...";
        }

        el.innerHTML = `
          <div>ステータス: <strong class="mq-gold-text font-bold">${label}</strong>${timerText}</div>
          <div>現在の問題: ${
            quiz
              ? `#${currentState.currentQuizIndex + 1} ${escapeHtml(
                  quiz.question
                )}`
              : "未設定"
          }</div>
          <div class="text-[var(--mq-muted)]">登録: クイズ ${quizzes.length} 件 / チーム ${teams.length} 件</div>
        `;
      }

      function updateControlButtons() {
        const start = document.getElementById("btn-start");
        const reveal = document.getElementById("btn-reveal");
        if (!currentState) return;
        const hasNext =
          quizzes.length > 0 &&
          currentState.currentQuizIndex + 1 < quizzes.length;
        start.disabled = currentState.status === "voting" || !hasNext;
        reveal.disabled = currentState.status !== "voting";
      }

      function renderTeams() {
        const list = document.getElementById("team-list");
        if (teams.length === 0) {
          list.innerHTML =
            '<p class="text-xs text-[var(--mq-muted)]">チーム未登録</p>';
          return;
        }
        list.innerHTML = teams
          .map((t, i) => {
            const color = TEAM_COLORS[i % TEAM_COLORS.length];
            return `
            <div class="flex items-center gap-2 bg-black/30 border border-[rgba(212,175,55,.25)] p-2 rounded flex-wrap text-sm">
              <span class="w-3 h-3 rounded-full" style="background-color:${color}"></span>
              <input class="flex-1 min-w-[120px] mq-input px-2 py-1"
                value="${escapeHtml(t.name)}" data-action="rename" data-id="${t.id}">
              <span class="text-[var(--mq-muted)]">スコア <span class="mq-gold-text font-bold">${
                t.score || 0
              }</span></span>
              <span class="text-[var(--mq-muted)]">代表 ${
                t.representative
                  ? `<span class="text-[var(--mq-text)]">${escapeHtml(
                      t.representative
                    )}</span>`
                  : `<span class="text-[#6b688f]">未登録</span>`
              }</span>
              <button class="mq-btn text-xs px-2 py-1"
                data-action="clear-rep" data-id="${t.id}">代表クリア</button>
              <button class="mq-btn mq-btn--danger text-xs px-2 py-1"
                data-action="delete" data-id="${t.id}">削除</button>
            </div>`;
          })
          .join("");
      }

      function renderQuizzes() {
        const list = document.getElementById("quiz-list");
        if (quizzes.length === 0) {
          list.innerHTML =
            '<p class="text-xs text-[var(--mq-muted)]">問題未登録</p>';
          return;
        }
        list.innerHTML = quizzes
          .map(
            (q, i) => `
          <div class="bg-black/30 border border-[rgba(212,175,55,.25)] p-3 rounded">
            <div class="flex items-start gap-2">
              <span class="text-xs text-[var(--mq-muted)] font-mono">#${i + 1}</span>
              ${
                q.imageUrl
                  ? `<img src="${q.imageUrl}" class="w-12 h-12 object-cover rounded border border-[rgba(212,175,55,.4)] shrink-0">`
                  : ""
              }
              <div class="flex-1 text-sm">
                <div class="font-medium flex items-center gap-2 flex-wrap">
                  <span>${escapeHtml(q.question)}</span>
                  <span class="text-xs border border-[var(--mq-gold)] mq-gold-text font-bold rounded px-2 py-0.5">${
                    q.points || 10
                  } 点</span>
                </div>
                <div class="text-xs text-[var(--mq-muted)] mt-1 flex flex-wrap gap-x-3">
                  ${q.choices
                    .map(
                      (c, idx) =>
                        `<span class="${
                          idx === q.correctIndex
                            ? "text-emerald-400"
                            : ""
                        }">${["A", "B", "C", "D"][idx]}. ${escapeHtml(c)}${
                          idx === q.correctIndex ? " ✓" : ""
                        }</span>`
                    )
                    .join("")}
                  ${
                    q.videoUrl
                      ? `<span class="text-sky-400">動画あり</span>`
                      : ""
                  }
                </div>
              </div>
              <button class="mq-btn mq-btn--danger text-xs px-2 py-1"
                data-action="delete-quiz" data-id="${q.id}">削除</button>
            </div>
          </div>`
          )
          .join("");
      }

      document
        .getElementById("team-list")
        .addEventListener("click", async (e) => {
          const action = e.target.dataset.action;
          const id = e.target.dataset.id;
          if (!action || !id) return;
          if (action === "delete") {
            if (confirm("このチームを削除しますか？")) {
              await deleteDoc(refs.team(id));
            }
          } else if (action === "clear-rep") {
            await updateDoc(refs.team(id), { representative: null });
          }
        });
      document
        .getElementById("team-list")
        .addEventListener("change", async (e) => {
          if (e.target.dataset.action === "rename") {
            await updateDoc(refs.team(e.target.dataset.id), {
              name: e.target.value.trim(),
            });
          }
        });

      document
        .getElementById("quiz-list")
        .addEventListener("click", async (e) => {
          if (
            e.target.dataset.action === "delete-quiz" &&
            confirm("この問題を削除しますか？")
          ) {
            await deleteDoc(refs.quiz(e.target.dataset.id));
          }
        });

      document
        .getElementById("team-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const name = e.target.name.value.trim();
          if (!name) return;
          const order =
            teams.length > 0
              ? Math.max(...teams.map((t) => t.order || 0)) + 1
              : 0;
          await addDoc(refs.teams(), {
            name,
            score: 0,
            representative: null,
            order,
          });
          e.target.reset();
        });

      document
        .getElementById("btn-seed-teams")
        .addEventListener("click", async () => {
          if (
            !confirm(
              "デフォルトの 5 チームを作成します。既存のチームはそのまま残ります。"
            )
          )
            return;
          const defaults = ["チーム A", "チーム B", "チーム C", "チーム D", "チーム E"];
          const batch = writeBatch(db);
          const base = teams.length;
          for (let i = 0; i < defaults.length; i++) {
            const newRef = doc(refs.teams());
            batch.set(newRef, {
              name: defaults[i],
              score: 0,
              representative: null,
              order: base + i,
            });
          }
          await batch.commit();
        });

      let currentImageDataUrl = null;

      async function fileToResizedDataUrl(file, maxSize = 800, quality = 0.8) {
        const img = new Image();
        const url = URL.createObjectURL(file);
        try {
          await new Promise((resolve, reject) => {
            img.onload = resolve;
            img.onerror = reject;
            img.src = url;
          });
        } finally {
          URL.revokeObjectURL(url);
        }
        let { width, height } = img;
        if (width > height && width > maxSize) {
          height = Math.round((height * maxSize) / width);
          width = maxSize;
        } else if (height >= width && height > maxSize) {
          width = Math.round((width * maxSize) / height);
          height = maxSize;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        return canvas.toDataURL("image/jpeg", quality);
      }

      function clearQuizImage() {
        currentImageDataUrl = null;
        document.getElementById("quiz-image").value = "";
        document.getElementById("quiz-image-preview").classList.add("hidden");
      }

      document
        .getElementById("quiz-image")
        .addEventListener("change", async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          try {
            let dataUrl = await fileToResizedDataUrl(file, 800, 0.8);
            if (dataUrl.length > 900_000) {
              dataUrl = await fileToResizedDataUrl(file, 600, 0.7);
            }
            if (dataUrl.length > 900_000) {
              alert(
                "画像サイズが大きすぎます。別の画像を選ぶか、事前にサイズを小さくしてください。"
              );
              clearQuizImage();
              return;
            }
            currentImageDataUrl = dataUrl;
            const img = document.getElementById("quiz-image-preview-img");
            img.src = dataUrl;
            document
              .getElementById("quiz-image-preview")
              .classList.remove("hidden");
            document.getElementById(
              "quiz-image-size"
            ).textContent = `${Math.round(dataUrl.length / 1024)} KB`;
          } catch (err) {
            console.error(err);
            alert("画像の処理に失敗しました: " + err.message);
          }
        });

      document
        .getElementById("btn-clear-image")
        .addEventListener("click", clearQuizImage);

      document
        .getElementById("quiz-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          const order =
            quizzes.length > 0
              ? Math.max(...quizzes.map((q) => q.order || 0)) + 1
              : 0;
          await addDoc(refs.quizzes(), {
            question: fd.get("question").trim(),
            choices: [0, 1, 2, 3].map((i) => fd.get(`choice${i}`).trim()),
            correctIndex: parseInt(fd.get("correctIndex"), 10),
            points: parseInt(fd.get("points"), 10) || 10,
            imageUrl: currentImageDataUrl || null,
            videoUrl: fd.get("videoUrl").trim() || null,
            order,
          });
          e.target.reset();
          clearQuizImage();
        });

      document
        .getElementById("btn-start")
        .addEventListener("click", async () => {
          const nextIndex = (currentState?.currentQuizIndex ?? -1) + 1;
          if (nextIndex >= quizzes.length) {
            alert("次の問題がありません");
            return;
          }
          if (teams.length === 0) {
            alert("チームを先に登録してください");
            return;
          }
          const quiz = quizzes[nextIndex];
          await updateDoc(stateRef, {
            status: "voting",
            currentQuizId: quiz.id,
            currentQuizIndex: nextIndex,
            votingStartedAt: Date.now(),
            durationMs: DURATION_MS,
          });
        });

      async function doReveal() {
        if (!currentState || currentState.status !== "voting") return;
        const quizId = currentState.currentQuizId;
        const quiz = quizzes.find((q) => q.id === quizId);
        if (!quiz) return;
        if (currentState.scoredForQuizId !== quizId) {
          const ansSnap = await getDocs(
            query(refs.answers(), where("quizId", "==", quizId))
          );
          const batch = writeBatch(db);
          const teamMap = new Map(teams.map((t) => [t.id, t]));
          const points = quiz.points || SCORE_PER_CORRECT;
          ansSnap.docs.forEach((d) => {
            const a = d.data();
            if (a.choice === quiz.correctIndex) {
              const team = teamMap.get(a.teamId);
              if (team) {
                batch.update(refs.team(a.teamId), {
                  score: (team.score || 0) + points,
                });
              }
            }
          });
          batch.update(stateRef, {
            status: "result",
            scoredForQuizId: quizId,
          });
          await batch.commit();
        } else {
          await updateDoc(stateRef, { status: "result" });
        }
      }

      document.getElementById("btn-reveal").addEventListener("click", doReveal);

      let autoRevealInFlight = false;
      setInterval(async () => {
        if (!currentState || currentState.status !== "voting") {
          autoRevealInFlight = false;
          return;
        }
        if (autoRevealInFlight) return;
        const elapsed =
          Date.now() - (currentState.votingStartedAt || Date.now());
        if (elapsed < (currentState.durationMs || 30000)) return;
        autoRevealInFlight = true;
        try {
          await doReveal();
        } finally {
          autoRevealInFlight = false;
        }
      }, 500);

      document
        .getElementById("btn-final")
        .addEventListener("click", async () => {
          await updateDoc(stateRef, { status: "final_ranking" });
        });

      document
        .getElementById("btn-reset")
        .addEventListener("click", async () => {
          if (
            !confirm(
              "スコアと回答をリセットします。問題とチームは残ります。よろしいですか？"
            )
          )
            return;
          const ansSnap = await getDocs(refs.answers());
          const batch = writeBatch(db);
          ansSnap.docs.forEach((d) => batch.delete(d.ref));
          teams.forEach((t) =>
            batch.update(refs.team(t.id), { score: 0, representative: null })
          );
          batch.update(stateRef, {
            status: "waiting",
            currentQuizId: null,
            currentQuizIndex: -1,
            votingStartedAt: null,
            scoredForQuizId: null,
          });
          await batch.commit();
        });
    </script>
  </body>
</html>
